    answer: |
      ```python
      def is_palindrome(s):
          s = s.lower()
          left, right = 0, len(s) - 1
          while left < right:
              if s[left] != s[right]:
                  return False
              left += 1
              right -= 1
          return True
      ```
    explanation: "Two pointers start at opposite ends and move toward the center, comparing characters pairwise; returning False as soon as any pair doesn't match avoids unnecessary further comparisons, and reaching the middle without any mismatch confirms the string reads the same forwards and backwards."
