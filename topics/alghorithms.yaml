    text: "Write a function (in any language) that performs an iterative (non-recursive) Breadth-First Search (BFS) on a graph represented as an adjacency list, starting from a given node, and returns the list of visited nodes in visitation order."
    answer: |
      ```python
      from collections import deque

      def bfs(graph, start):
          visited = {start}
          order = []
          queue = deque([start])
          while queue:
              node = queue.popleft()
              order.append(node)
              for neighbor in graph[node]:
                  if neighbor not in visited:
                      visited.add(neighbor)
                      queue.append(neighbor)
          return order
      ```
    explanation: "A queue (FIFO) is what gives BFS its level-by-level exploration order: nodes are processed in the exact order they were first discovered, and marking a node as visited as soon as it's added to the queue (rather than when it's dequeued) prevents the same node from being enqueued multiple times through different paths before it's ever processed."
