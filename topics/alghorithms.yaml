    answer: |
      ```python
      def two_sum(nums, target):
          seen = {}
          for i, num in enumerate(nums):
              complement = target - num
              if complement in seen:
                  return [seen[complement], i]
              seen[num] = i
          return None
      ```
    explanation: "Instead of checking every pair (O(n^2)), a hash map records each number's index as it's scanned; before inserting the current number, the function checks whether its complement (target minus the current number) was already seen earlier in the array, giving O(1) average-case lookups and O(n) overall time, at the cost of O(n) extra space for the hash map."
