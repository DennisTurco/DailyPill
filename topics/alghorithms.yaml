    text: "Explain why a naive recursive Fibonacci implementation runs in exponential time, describing specifically what redundant work occurs."
    answer: "Computing fib(n) naively calls fib(n-1) and fib(n-2). But fib(n-1) itself calls fib(n-2) and fib(n-3) — meaning fib(n-2) gets computed independently, from scratch, in two completely separate branches of the recursion tree (once directly from fib(n), and once as part of computing fib(n-1)). This duplication compounds at every level: fib(n-3) is recomputed even more times, and so on down to the base cases, which end up being recomputed an exponentially growing number of times as n increases. The total number of function calls made grows roughly proportional to the golden-ratio-based growth rate of the Fibonacci sequence itself (approximately 1.618^n), which is exponential in n."
    explanation: "This redundant recomputation is exactly the 'overlapping subproblems' property that dynamic programming (via memoization or tabulation) is designed to eliminate — storing each fib(k) result the first time it's computed reduces the total distinct subproblems solved from exponentially many down to just n+1 (fib(0) through fib(n)), each solved exactly once."
