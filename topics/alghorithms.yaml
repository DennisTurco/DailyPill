    text: "Write a function (in any language) that performs binary search on a sorted array of integers, returning the index of a target value or -1 if not found."
    answer: |
      ```python
      def binary_search(arr, target):
          low, high = 0, len(arr) - 1
          while low <= high:
              mid = (low + high) // 2
              if arr[mid] == target:
                  return mid
              elif arr[mid] < target:
                  low = mid + 1
              else:
                  high = mid - 1
          return -1
      ```
    explanation: "Each iteration halves the remaining search space by comparing the target against the middle element and discarding the half that cannot contain it, giving O(log n) time; the loop terminates either by finding the target or by low exceeding high, meaning the remaining search space is empty."
