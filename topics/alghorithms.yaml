    difficulty: 3
    text: "Explain what a Union-Find (Disjoint Set Union) structure is used for in Kruskal's Minimum Spanning Tree algorithm, and why it's needed."
    answer: "Kruskal's algorithm processes all of a graph's edges in increasing order of weight, greedily adding each edge to the growing minimum spanning tree unless doing so would create a cycle (since a spanning tree, by definition, must have no cycles). To efficiently check 'would adding this edge create a cycle', the algorithm needs to quickly determine whether the edge's two endpoints are already connected to each other through previously-added edges. A Union-Find structure tracks exactly this: each vertex starts in its own singleton set, and whenever an edge is added to the MST, the sets containing its two endpoints are unioned together; checking whether an edge would create a cycle is then just checking whether its two endpoints are already in the same set (via 'find') — if they are, adding that edge would connect two already-connected vertices, necessarily forming a cycle, so the edge is skipped."
    explanation: "Without Union-Find (or an equivalent efficient connectivity check), determining whether adding an edge creates a cycle would require a much more expensive traversal (like a full BFS/DFS) of the current partial tree for every single candidate edge; Union-Find with its optimizations (union-by-rank, path compression) makes each check nearly constant time, which is essential for Kruskal's overall efficiency."
