name: Algorithms and data structures
category: Computer Science
difficulty: medium
ai_generate: true
content: |
  Time complexity: O(1), O(log n), O(n), O(n log n), O(n^2)
  Data structures: array, list, stack, queue, tree, graph, hash map
  Sorting algorithms: bubble sort, merge sort, quick sort
manual_questions:
  - type: multiple_choice
    difficulty: 2
    text: "What is the time complexity of binary search on a sorted array?"
    options:
      - "O(n)"
      - "O(log n)"
      - "O(n^2)"
      - "O(1)"
    answer: 1
    explanation: "Binary search halves the search space each step, giving O(log n); O(n) would be linear scan, O(1) is only for direct lookups, and O(n^2) is far worse than what binary search achieves."
  - type: multiple_choice
    difficulty: 1
    text: "Which data structure uses LIFO (Last In, First Out) ordering?"
    options:
      - "Queue"
      - "Stack"
      - "Heap"
      - "Linked list"
    answer: 1
    explanation: "A stack adds and removes elements from the same end, so the last item pushed is the first one popped (Last In, First Out), unlike a queue which is FIFO."
  - type: multiple_choice
    difficulty: 1
    text: "Which data structure uses FIFO (First In, First Out) ordering?"
    options:
      - "Stack"
      - "Queue"
      - "Tree"
      - "Graph"
    answer: 1
    explanation: "A queue removes elements in the same order they were added (First In, First Out), which is why it's used for things like task scheduling, unlike a stack which is LIFO."
  - type: multiple_choice
    difficulty: 3
    text: "What is the average time complexity of searching in a balanced binary search tree?"
    options:
      - "O(1)"
      - "O(log n)"
      - "O(n)"
      - "O(n log n)"
    answer: 1
    explanation: "In a balanced BST, height is O(log n), and each comparison eliminates one subtree, so search takes O(log n) on average; an unbalanced tree could degrade this to O(n)."
  - type: multiple_choice
    difficulty: 3
    text: "Which sorting algorithm has an average-case time complexity of O(n log n) and is stable?"
    options:
      - "Bubble sort"
      - "Insertion sort"
      - "Merge sort"
      - "Selection sort"
    answer: 2
    explanation: "Merge sort always splits and merges in O(n log n) and preserves the relative order of equal elements, making it stable; bubble/insertion/selection sort are O(n^2) on average."
  - type: multiple_choice
    difficulty: 3
    text: "What is the worst-case time complexity of quicksort?"
    options:
      - "O(n log n)"
      - "O(n^2)"
      - "O(log n)"
      - "O(n)"
    answer: 1
    explanation: "With a poor pivot choice (e.g. already-sorted input with a naive pivot), partitions become maximally unbalanced, degrading quicksort to O(n^2); its average case is O(n log n)."
  - type: multiple_choice
    difficulty: 2
    text: "Which data structure is typically used to implement a priority queue efficiently?"
    options:
      - "Array"
      - "Heap"
      - "Stack"
      - "Linked list"
    answer: 1
    explanation: "A binary heap gives O(log n) insertion and O(log n) removal of the min/max element while keeping O(1) access to that element, making it the standard priority queue implementation."
  - type: multiple_choice
    difficulty: 4
    text: "What is the space complexity of an adjacency matrix representation of a graph with V vertices?"
    options:
      - "O(V)"
      - "O(V + E)"
      - "O(V^2)"
      - "O(E)"
    answer: 2
    explanation: "An adjacency matrix stores a V-by-V grid of entries to represent every possible pair of vertices, giving O(V^2) space regardless of how many edges actually exist."
  - type: multiple_choice
    difficulty: 3
    text: "Which tree traversal visits the root before its subtrees?"
    options:
      - "In-order"
      - "Pre-order"
      - "Post-order"
      - "Level-order"
    answer: 1
    explanation: "Pre-order visits the root, then the left subtree, then the right subtree, so the root is processed first; in-order and post-order visit the root in the middle or last, respectively."
  - type: multiple_choice
    difficulty: 3
    text: "What is the time complexity of inserting an element at the head of a singly linked list?"
    options:
      - "O(1)"
      - "O(log n)"
      - "O(n)"
      - "O(n^2)"
    answer: 0
    explanation: "Inserting at the head only requires creating a new node and repointing the head pointer, a constant-time operation regardless of list length, unlike inserting at an arbitrary position."
  - type: multiple_choice
    difficulty: 4
    text: "Which algorithmic technique does merge sort use?"
    options:
      - "Greedy"
      - "Divide and conquer"
      - "Dynamic programming"
      - "Backtracking"
    answer: 1
    explanation: "Merge sort splits the array into halves, recursively sorts each, then merges the results, which is the classic divide-and-conquer pattern rather than greedy, DP, or backtracking."
  - type: multiple_choice
    difficulty: 5
    text: "What is the time complexity of the Floyd-Warshall all-pairs shortest path algorithm?"
    options:
      - "O(V^2)"
      - "O(V^3)"
      - "O(V log V)"
      - "O(E log V)"
    answer: 1
    explanation: "Floyd-Warshall uses three nested loops over all V vertices (as intermediate, source, and destination), giving O(V^3), which is efficient for dense graphs needing all-pairs shortest paths."
  - type: completion
    difficulty: 2
    text: "A data structure that stores key-value pairs with average O(1) lookup is called a ____ map."
    answer: "hash"
    explanation: "A hash map computes an index from the key via a hash function, giving average O(1) insertion and lookup instead of scanning entries linearly."
  - type: completion
    difficulty: 4
    text: "The technique of solving a problem by storing the results of overlapping subproblems is called ____ programming."
    answer: "dynamic"
    explanation: "Dynamic programming caches (memoizes) results of overlapping subproblems so each is computed only once, avoiding the exponential blowup of naive recursion."
  - type: completion
    difficulty: 4
    text: "A self-balancing binary search tree in which the heights of the two child subtrees of any node differ by at most one is called an ____ tree."
    answer: "AVL"
    explanation: "AVL trees are named after their inventors Adelson-Velsky and Landis; they rebalance via rotations whenever a subtree height difference exceeds one, keeping operations O(log n)."
  - type: single_word
    difficulty: 2
    text: "What is the term for the number of edges connected to a vertex in a graph?"
    answer: "degree"
    explanation: "The degree of a vertex counts how many edges touch it directly; it's a basic property used to analyze graph structure and connectivity."
  - type: single_word
    difficulty: 3
    text: "What is the name of the algorithmic technique that makes the locally optimal choice at each step?"
    answer: "greedy"
    explanation: "Greedy algorithms pick the best-looking option at each step without reconsidering past choices, which works optimally for problems like Kruskal's MST but not for all problems."
  - type: single_word
    difficulty: 3
    text: "What is the common abbreviation for the graph traversal that explores as deep as possible before backtracking?"
    answer: "DFS"
    explanation: "Depth-First Search follows a branch as far as possible before backtracking, typically implemented recursively or with an explicit stack, as opposed to BFS which explores level by level."
  - type: multiple_choice
    difficulty: 1
    text: "What does Big-O notation describe about an algorithm?"
    options:
      - "An upper bound on how its running time (or space usage) grows as input size increases"
      - "The exact number of seconds an algorithm will take to run"
      - "The amount of RAM installed on the machine running it"
      - "The programming language the algorithm must be written in"
    answer: 0
    explanation: "Big-O describes asymptotic growth rate as input size approaches infinity, abstracting away constant factors and lower-order terms, machine-specific speed, and implementation details — it answers 'how does cost scale', not 'how many milliseconds exactly'."
  - type: multiple_choice
    difficulty: 2
    text: "What is the time complexity of accessing an element by index in an array?"
    options:
      - "O(1)"
      - "O(n)"
      - "O(log n)"
      - "O(n^2)"
    answer: 0
    explanation: "Because array elements are stored contiguously in memory, the address of any index can be computed directly (base address plus index times element size) without needing to traverse anything, giving constant-time access."
  - type: multiple_choice
    difficulty: 2
    text: "What is the time complexity of accessing the k-th element of a singly linked list?"
    options:
      - "O(n)"
      - "O(1)"
      - "O(log n)"
      - "O(n log n)"
    answer: 0
    explanation: "A linked list has no direct indexing — reaching the k-th node requires following 'next' pointers one at a time starting from the head, taking time proportional to k (and up to n in the worst case)."
  - type: multiple_choice
    difficulty: 2
    text: "What is a key advantage of a linked list over an array for frequent insertions/removals in the middle of the collection?"
    options:
      - "Once you have a reference to the relevant node, insertion/removal is O(1), without needing to shift other elements"
      - "Linked lists always use less total memory than arrays"
      - "Linked lists support O(1) random access by index, arrays do not"
      - "There is no advantage; arrays are always faster for every operation"
    answer: 0
    explanation: "Inserting into or removing from the middle of an array requires shifting every subsequent element to keep the array contiguous (O(n)); a linked list only needs to update a couple of pointers around the insertion/removal point, once you've located it, which is O(1) — though locating that point in the first place still takes O(n) for a singly linked list."
  - type: multiple_choice
    difficulty: 3
    text: "What is 'amortized' time complexity, using a dynamic array's (e.g. Python list, Java ArrayList) append operation as an example?"
    options:
      - "The average cost per operation over a sequence of operations, even though some individual operations (like a resize) are more expensive than others"
      - "The guaranteed worst-case time for every single individual operation, with no exceptions"
      - "A synonym for best-case time complexity"
      - "The time complexity measured only when the array is completely empty"
    answer: 0
    explanation: "Most appends to a dynamic array are O(1), but occasionally the underlying array is full and must be resized (typically doubled) and every existing element copied over, an O(n) operation; because these expensive resizes happen increasingly rarely as the array grows, the average cost per append across a long sequence of appends still works out to O(1) amortized, even though a few individual appends are more expensive."
  - type: multiple_choice
    difficulty: 1
    text: "What is the worst-case time complexity of bubble sort?"
    options:
      - "O(n^2)"
      - "O(n log n)"
      - "O(n)"
      - "O(log n)"
    answer: 0
    explanation: "Bubble sort repeatedly steps through the list, swapping adjacent out-of-order elements; in the worst case (reverse-sorted input) this requires roughly n passes each doing up to n comparisons, giving O(n^2)."
  - type: multiple_choice
    difficulty: 2
    text: "What is the worst-case time complexity of insertion sort?"
    options:
      - "O(n^2)"
      - "O(n log n)"
      - "O(log n)"
      - "O(1)"
    answer: 0
    explanation: "Insertion sort builds the sorted portion one element at a time, shifting elements to make room; in the worst case (reverse-sorted input) each new element must shift past all previously sorted elements, giving O(n^2) overall, though it performs close to O(n) on already nearly-sorted input."
  - type: multiple_choice
    difficulty: 2
    text: "Why is insertion sort sometimes preferred over more asymptotically efficient algorithms (like quicksort) for very small or nearly-sorted arrays?"
    options:
      - "Its low overhead per element and near-linear performance on nearly-sorted data can make it faster in practice for small inputs, despite worse asymptotic complexity"
      - "Insertion sort has a better worst-case complexity than quicksort for every input size"
      - "Insertion sort is the only sorting algorithm capable of handling duplicate values"
      - "Insertion sort cannot be implemented for arrays, only linked lists"
    answer: 0
    explanation: "Asymptotic complexity describes behavior as n grows large; for small n, the constant factors and low overhead of a simple algorithm like insertion sort can outperform an asymptotically superior but more complex algorithm — this is why many real-world sorting implementations (like Timsort) fall back to insertion sort for small sub-arrays."
  - type: multiple_choice
    difficulty: 3
    text: "What is the time complexity of building a max-heap from an unsorted array of n elements using the standard bottom-up heapify approach?"
    options:
      - "O(n)"
      - "O(n log n)"
      - "O(n^2)"
      - "O(log n)"
    answer: 0
    explanation: "Although a single 'sift-down' operation is O(log n), and there are O(n) nodes, a more careful analysis (accounting for the fact that most nodes are near the bottom of the tree and need very few sift-down steps) shows the total cost sums to O(n), not the looser O(n log n) bound a naive analysis might suggest."
  - type: multiple_choice
    difficulty: 2
    text: "What is the time complexity of heapsort?"
    options:
      - "O(n log n) in all cases (best, average, and worst)"
      - "O(n) in all cases"
      - "O(n^2) in the worst case only"
      - "O(log n) in all cases"
    answer: 0
    explanation: "Heapsort builds a heap in O(n) and then repeatedly extracts the max/min (each extraction being O(log n)) n times, giving O(n log n) — unlike quicksort, this bound holds even in the worst case, at the cost of heapsort typically having worse real-world constant factors and being non-stable."
  - type: multiple_choice
    difficulty: 3
    text: "What distinguishes counting sort and radix sort from comparison-based sorts like quicksort or merge sort?"
    options:
      - "They don't compare elements directly against each other, instead exploiting known structure (like a limited range of integer values) to achieve better than O(n log n) time in specific cases"
      - "They can only ever sort already-sorted input"
      - "They require significantly more comparisons than any comparison-based sort"
      - "They cannot be used on integers, only strings"
    answer: 0
    explanation: "Comparison sorts are proven to require at least O(n log n) comparisons in the worst case; counting sort and radix sort sidestep this lower bound entirely by not comparing elements pairwise, instead using the values' structure (e.g. counting occurrences of each possible value) to achieve O(n + k) or similar, but only work well under specific conditions (like a bounded range of integer keys)."
  - type: multiple_choice
    difficulty: 2
    text: "What is the primary difference between Breadth-First Search (BFS) and Depth-First Search (DFS) on a graph?"
    options:
      - "BFS explores all neighbors at the current depth before moving deeper; DFS explores as far as possible along one branch before backtracking"
      - "BFS can only be used on trees, DFS only on general graphs"
      - "DFS always finds the shortest path, BFS does not"
      - "They are two names for the exact same algorithm"
    answer: 0
    explanation: "BFS uses a queue and expands level by level, which is why it finds the shortest path in an unweighted graph; DFS uses a stack (or recursion) and dives deep along one path before backtracking to explore alternatives, which uses less memory for wide graphs but doesn't guarantee the shortest path."
  - type: multiple_choice
    difficulty: 2
    text: "Why does BFS find the shortest path (in terms of number of edges) in an unweighted graph, while DFS does not guarantee this?"
    options:
      - "BFS explores nodes in increasing order of distance from the start, so the first time it reaches a node is guaranteed to be via a shortest path; DFS can reach a node via a long, roundabout path before a shorter one is explored"
      - "DFS is simply a slower version of BFS with no other difference"
      - "BFS only works on graphs with fewer than 100 nodes"
      - "Neither algorithm can be used to find shortest paths under any circumstances"
    answer: 0
    explanation: "Because BFS visits all nodes at distance 1 before any node at distance 2, and so on, the level at which a node is first discovered exactly equals its shortest distance (in edge count) from the start; DFS's exploration order has no such guarantee, since it commits to going deep along one path regardless of whether a shorter path to the same node exists elsewhere."
  - type: multiple_choice
    difficulty: 3
    text: "What problem does Dijkstra's algorithm solve, and what limitation does it have regarding edge weights?"
    options:
      - "It finds the shortest path from a source to all other nodes in a weighted graph, but only works correctly if all edge weights are non-negative"
      - "It finds the shortest path in an unweighted graph only"
      - "It works correctly with negative edge weights but not with positive ones"
      - "It only works on graphs with exactly one possible path between any two nodes"
    answer: 0
    explanation: "Dijkstra's greedy approach (always expanding the currently-closest unvisited node) relies on the assumption that once a node's shortest distance is finalized, no later path through a negative-weight edge could ever make a shorter path appear — that assumption breaks with negative weights, which is why Bellman-Ford (slower, but tolerant of negative weights, as long as there's no negative cycle) is used instead when negative weights are possible."
  - type: multiple_choice
    difficulty: 4
    text: "Why does the Bellman-Ford algorithm work correctly with negative edge weights, unlike Dijkstra's algorithm, despite being asymptotically slower?"
    options:
      - "Instead of greedily finalizing a node's distance once visited, it relaxes every edge repeatedly (V-1 times), allowing earlier distance estimates to still be improved later by paths through negative-weight edges"
      - "Bellman-Ford does not actually compute shortest paths at all, only approximate ones"
      - "Bellman-Ford ignores negative edges entirely rather than processing them"
      - "It works only on graphs with fewer than 10 vertices"
    answer: 0
    explanation: "Dijkstra assumes a node's shortest distance is final once discovered (safe only with non-negative weights); Bellman-Ford instead repeatedly relaxes all edges across the whole graph for V-1 iterations, guaranteeing that even paths made shorter later on by a negative-weight edge are eventually accounted for, at the cost of O(V*E) time instead of Dijkstra's faster O((V+E) log V) with a good priority queue."
  - type: multiple_choice
    difficulty: 3
    text: "What do Kruskal's and Prim's algorithms both compute for a weighted, connected, undirected graph?"
    options:
      - "A Minimum Spanning Tree (MST) — a subset of edges connecting all vertices with the minimum possible total edge weight, and no cycles"
      - "The shortest path between two specific vertices"
      - "Whether the graph contains a cycle, with no regard to edge weights"
      - "The maximum flow between a source and a sink"
    answer: 0
    explanation: "Both are classic greedy MST algorithms, differing in strategy: Kruskal's sorts all edges by weight and greedily adds the smallest edge that doesn't create a cycle (commonly using a Union-Find structure to detect cycles efficiently); Prim's grows a single tree outward, greedily adding the cheapest edge connecting the current tree to a new vertex."
  - type: multiple_choice
    difficulty: 3
    text: "What is 'topological sort', and under what condition on a directed graph is it possible to compute one?"
    options:
      - "A linear ordering of vertices such that for every directed edge u -> v, u comes before v in the ordering; it's only possible if the graph is a Directed Acyclic Graph (DAG), i.e. has no cycles"
      - "A sort that arranges vertices purely alphabetically by their labels"
      - "It is possible for any directed graph, including ones containing cycles"
      - "It requires the graph to be undirected"
    answer: 0
    explanation: "A cycle would make a consistent linear ordering impossible (u must come before v, but also after it, if there's a cycle involving both), so topological sort is defined only for DAGs — common applications include scheduling tasks with dependencies, or determining a valid build/compile order for modules."
  - type: multiple_choice
    difficulty: 4
    text: "What is the purpose of a Union-Find (Disjoint Set Union) data structure?"
    options:
      - "Efficiently track a partition of elements into disjoint sets, supporting fast 'union' (merge two sets) and 'find' (which set does this element belong to) operations"
      - "Efficiently find the shortest path between two nodes in a graph"
      - "Efficiently sort a large array of integers"
      - "Efficiently compute the height of a binary tree"
    answer: 0
    explanation: "Union-Find is the standard structure behind cycle detection in Kruskal's MST algorithm (two endpoints of an edge are in the same set if and only if they're already connected) and behind connected-component tracking generally; with optimizations like union-by-rank and path compression, both operations run in near-constant (technically inverse-Ackermann) amortized time."
  - type: multiple_choice
    difficulty: 2
    text: "What is a trie (prefix tree) particularly well-suited for?"
    options:
      - "Efficiently storing and searching a set of strings, especially for prefix-based operations like autocomplete"
      - "Storing key-value pairs with average O(1) lookup, like a hash map"
      - "Representing a graph's edges compactly"
      - "Sorting a large array of numbers"
    answer: 0
    explanation: "Each path from the root of a trie down to a marked node represents a stored string, sharing common prefixes across branches — this makes operations like 'find all words starting with this prefix' (autocomplete) very efficient, something a hash map or balanced BST doesn't support as naturally."
  - type: multiple_choice
    difficulty: 4
    text: "What property must a red-black tree maintain that guarantees its height stays O(log n)?"
    options:
      - "A set of coloring and structural rules (e.g. no two adjacent red nodes, every root-to-leaf path has the same number of black nodes) that bound how unbalanced the tree can become"
      - "Every node must have exactly two children, with no exceptions"
      - "All values must be inserted in strictly increasing order"
      - "The tree must be rebuilt entirely from scratch after every single insertion"
    answer: 0
    explanation: "Red-black trees are self-balancing BSTs that maintain a set of invariants (via node coloring and rotations during insertion/deletion) ensuring the longest root-to-leaf path is never more than twice the shortest, which guarantees O(log n) height and therefore O(log n) search/insert/delete — they're the underlying structure behind many standard library ordered map/set implementations."
  - type: multiple_choice
    difficulty: 2
    text: "What does it mean for a binary search tree to become 'unbalanced', and what is the consequence for search performance?"
    options:
      - "Its height grows closer to O(n) (e.g. degenerating into a linked-list-like chain) instead of staying O(log n), degrading search/insert/delete to O(n) in the worst case"
      - "It means the tree contains duplicate values, which is otherwise unrelated to balance"
      - "It means the tree has more left children than right children, with no effect on performance"
      - "Balance has no effect on any BST operation's performance"
    answer: 0
    explanation: "If elements are inserted in already-sorted order into a naive (non-self-balancing) BST, each new node becomes the only child of the previous one, producing a degenerate, linked-list-shaped tree with height O(n) instead of O(log n) — which is exactly why self-balancing variants (AVL, red-black trees) exist, to guarantee O(log n) height regardless of insertion order."
  - type: multiple_choice
    difficulty: 2
    text: "What is 'memoization', in the context of dynamic programming?"
    options:
      - "Caching the results of expensive function calls (typically recursive ones) so repeated calls with the same inputs can be answered instantly instead of recomputed"
      - "A technique for sorting an array using minimal memory"
      - "A synonym for garbage collection"
      - "A way to permanently delete unused variables from memory"
    answer: 0
    explanation: "Memoization is the 'top-down' style of dynamic programming: a naive recursive solution is kept mostly as-is, but a cache (often a dictionary/array) stores each subproblem's result the first time it's computed, so overlapping recursive calls with identical arguments are answered from the cache instead of being recomputed from scratch."
  - type: multiple_choice
    difficulty: 3
    text: "What is the key difference between the 'top-down' (memoization) and 'bottom-up' (tabulation) approaches to dynamic programming?"
    options:
      - "Top-down starts from the original problem and recursively breaks it down, caching results as they're computed; bottom-up starts from the smallest subproblems and iteratively builds up to the final answer"
      - "Bottom-up cannot be used for any problem that top-down can solve"
      - "Top-down never uses any extra memory beyond the input itself"
      - "They are exact synonyms describing the same technique"
    answer: 0
    explanation: "Both avoid redundant recomputation of overlapping subproblems, but via opposite control flow: memoization follows the natural recursive structure of the problem (computing subproblems on demand as needed), while tabulation explicitly computes subproblems in a fixed order (usually via a loop filling in a table) from the smallest up to the final answer, often avoiding recursion's call-stack overhead entirely."
  - type: multiple_choice
    difficulty: 4
    text: "Why does naive recursive computation of Fibonacci numbers (fib(n) = fib(n-1) + fib(n-2)) run in exponential time, and how does dynamic programming fix this?"
    options:
      - "The naive recursion recomputes the same fib(k) values repeatedly across many different call branches; DP stores each fib(k) result once it's computed, so it's never recomputed, reducing the total work to linear time"
      - "Naive recursion is actually already O(n), and DP provides no improvement"
      - "The exponential slowdown is caused by integer overflow, not redundant computation"
      - "DP fixes this only by using a faster programming language, not by changing the algorithm"
    answer: 0
    explanation: "Computing fib(n) naively re-derives fib(n-2) both directly and as part of computing fib(n-1), and this redundancy compounds at every level, leading to roughly 2^n total calls; storing (memoizing) each fib(k) the first time it's computed means each distinct subproblem is solved exactly once, collapsing the total work down to O(n)."
  - type: multiple_choice
    difficulty: 2
    text: "What is the general strategy behind a 'divide and conquer' algorithm?"
    options:
      - "Break a problem into smaller, independent subproblems of the same type, solve each recursively, and combine their solutions into a solution for the original problem"
      - "Always try every possible solution exhaustively, one at a time"
      - "Make the locally best choice at each step, never reconsidering it"
      - "Store previously computed results to avoid recomputing them"
    answer: 0
    explanation: "Merge sort and quicksort are classic divide-and-conquer algorithms: each splits the problem into smaller sub-arrays, recursively sorts each independently, and (for merge sort specifically) combines the sorted results — this differs from dynamic programming, which is specifically for problems where subproblems overlap and their results can be reused, rather than being fully independent."
  - type: multiple_choice
    difficulty: 3
    text: "What is 'backtracking', as an algorithmic technique?"
    options:
      - "Incrementally building candidate solutions and abandoning ('backtracking' from) a partial solution as soon as it's determined it cannot possibly lead to a valid complete solution"
      - "A technique that only ever considers the very first solution found, without checking any alternatives"
      - "A synonym for dynamic programming with no distinction"
      - "A technique that requires sorting the input first, in every case"
    answer: 0
    explanation: "Backtracking explores a solution space depth-first, but prunes branches early the moment they're known to be invalid or unable to lead anywhere useful (e.g. in the N-Queens problem, abandoning a partial placement as soon as two queens attack each other), avoiding wasted work exploring the rest of a doomed branch."
  - type: multiple_choice
    difficulty: 2
    text: "What is the 'two-pointer' technique commonly used for?"
    options:
      - "Solving problems on sorted arrays or sequences by maintaining two indices that move toward each other (or in tandem) to avoid nested loops"
      - "Storing two separate copies of the same array for redundancy"
      - "Pointing to two completely unrelated arrays simultaneously with no coordination between them"
      - "A technique used only for linked lists, never arrays"
    answer: 0
    explanation: "A classic example: finding a pair in a sorted array that sums to a target value using one pointer starting at the beginning and one at the end, moving them inward based on whether the current sum is too high or too low — this solves the problem in O(n) instead of the O(n^2) a naive nested-loop approach would require."
  - type: multiple_choice
    difficulty: 3
    text: "What is the 'sliding window' technique typically used for?"
    options:
      - "Efficiently processing a contiguous subarray/substring of fixed or variable size by incrementally adjusting its boundaries, instead of recomputing from scratch for every possible window"
