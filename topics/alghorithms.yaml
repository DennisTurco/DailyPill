    text: "Write a function (in any language) that implements bubble sort on an array of integers."
    answer: |
      ```python
      def bubble_sort(arr):
          n = len(arr)
          for i in range(n):
              swapped = False
              for j in range(n - i - 1):
                  if arr[j] > arr[j + 1]:
                      arr[j], arr[j + 1] = arr[j + 1], arr[j]
                      swapped = True
              if not swapped:
                  break
          return arr
      ```
    explanation: "Each outer pass 'bubbles' the largest remaining unsorted element to its correct position at the end of the array via repeated adjacent swaps; tracking whether any swap occurred lets the function exit early once the array is already sorted, improving the best case to O(n) instead of always running the full O(n^2)."
