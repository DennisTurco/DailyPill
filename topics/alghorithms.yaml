    text: "Write a function (in any language) that checks whether a string of brackets/parentheses (e.g. '(){}[]') is balanced, using a stack."
    answer: |
      ```python
      def is_balanced(s):
          pairs = {')': '(', ']': '[', '}': '{'}
          stack = []
          for char in s:
              if char in '([{':
                  stack.append(char)
              elif char in ')]}':
                  if not stack or stack.pop() != pairs[char]:
                      return False
          return not stack
      ```
    explanation: "A stack naturally models nested structure: every opening bracket is pushed, and every closing bracket must match the most recently pushed (and not-yet-matched) opening bracket, which is exactly what popping from a stack checks; if the stack is empty when a closing bracket needs a match, or anything is left unmatched on the stack at the end, the string isn't balanced."
