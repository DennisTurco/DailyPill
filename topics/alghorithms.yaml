  - type: open_answer
    difficulty: 3
    text: "Explain the difference between best-case, average-case, and worst-case time complexity, using linear search as an example for each."
    answer: "Best-case describes the most favorable possible input: for linear search, this is when the target element happens to be the very first one checked, giving O(1). Worst-case describes the least favorable possible input: for linear search, this is when the target is the last element checked, or isn't present in the array at all, requiring every element to be checked, giving O(n). Average-case describes the expected performance over a typical/random distribution of inputs: for linear search over an array where the target is equally likely to be at any position, this works out to roughly n/2 comparisons on average, which is still O(n) asymptotically, just with a different constant factor than the worst case."
    explanation: "Big-O notation is most commonly quoted for worst-case complexity (since it provides a guarantee that performance will never be worse than that bound), but average-case analysis matters too, especially for algorithms like quicksort whose worst case is much worse than its typical, average-case behavior."
  - type: open_answer
    difficulty: 3
    text: "Explain why a dynamic array's (e.g. Python list, Java ArrayList) append operation is described as O(1) amortized, even though some individual append calls actually take O(n) time."
    answer: "Most appends simply place the new element in the next available slot of the underlying pre-allocated array, which is O(1). Occasionally, the array is completely full, and appending requires allocating a new, larger underlying array (commonly double the previous size) and copying every existing element over to it, which is an O(n) operation for that specific append. However, because the array's capacity doubles each time this happens, these expensive resize operations become exponentially rarer as the array grows — summing the total cost of all the cheap O(1) appends plus the occasional expensive O(n) resizes across a long sequence of n appends works out to O(n) total cost, which averages to O(1) per append when amortized (spread evenly) across the whole sequence."
    explanation: "This is a classic example of amortized analysis: even though the worst-case cost of any single operation can be O(n), the total cost over many operations, divided by the number of operations, still comes out to a small constant — which is a meaningfully different (and often more useful) guarantee than a naive worst-case-per-operation bound would suggest."
  - type: open_answer
    difficulty: 3
    text: "Explain why an unbalanced binary search tree can degrade to O(n) search time, and describe what self-balancing trees like AVL or red-black trees do to prevent this."
    answer: "If elements are inserted into a plain (non-self-balancing) BST in an already-sorted order, each new node ends up as the only child of the previously-inserted node, producing a tree that's really just a disguised linked list, with height equal to the number of nodes, n. Since BST search time is proportional to the tree's height, this degenerate shape gives O(n) search instead of the O(log n) a properly balanced tree would provide for the same number of elements. Self-balancing trees like AVL and red-black trees actively maintain balance during insertion and deletion (via rotations, triggered whenever a balance-violating condition is detected), guaranteeing the tree's height stays O(log n) regardless of the order elements are inserted in, which in turn guarantees O(log n) search, insert, and delete."
    explanation: "This is precisely why production-quality ordered map/set implementations in most standard libraries use a self-balancing tree variant rather than a plain BST — without rebalancing, an adversarial or simply unlucky insertion order can silently degrade performance from logarithmic to linear."
  - type: open_answer
    difficulty: 4
    text: "Explain the difference between Dijkstra's algorithm and Bellman-Ford for finding shortest paths, and describe a specific situation where you would need to use Bellman-Ford instead of Dijkstra."
    answer: "Dijkstra's algorithm greedily finalizes each node's shortest distance as soon as it's reached, based on the assumption that no later-discovered path could ever make an already-finalized distance shorter — an assumption that only holds if all edge weights are non-negative. Bellman-Ford instead repeatedly relaxes every edge in the graph across V-1 iterations, never assuming any distance is truly final until all iterations complete, which correctly handles negative edge weights (as long as there's no negative-weight cycle reachable from the source, which would make 'shortest path' undefined/infinitely negative). You would need Bellman-Ford instead of Dijkstra specifically when the graph can contain negative edge weights — for example, a graph modeling currency exchange rates as edge weights (where some conversions might represent an actual 'gain', modeled as a negative cost) could not be safely solved with Dijkstra, since a later-discovered negative-weight path could invalidate an already-finalized 'shortest' distance."
    explanation: "Bellman-Ford's extra robustness comes at the cost of being asymptotically slower (O(V*E) versus Dijkstra's O((V+E) log V) with an efficient priority queue), which is why Dijkstra is preferred whenever it's known in advance that all edge weights are non-negative."
  - type: open_answer
    difficulty: 3
    text: "Explain the difference between memoization (top-down dynamic programming) and tabulation (bottom-up dynamic programming), using the Fibonacci sequence as an example for each."
    answer: "Memoization keeps the natural recursive structure of the problem: a function fib(n) still calls fib(n-1) and fib(n-2) recursively as it normally would, but before returning, it stores its result in a cache keyed by n; on any future call (including from a different branch of the recursion) with the same n, the cached value is returned immediately instead of recomputing it. Tabulation instead builds an iterative table from the bottom up: starting with the known base cases fib(0)=0 and fib(1)=1, a loop computes fib(2), then fib(3), and so on up to fib(n), each time using only the two previously computed table entries, with no recursion involved at all."
    explanation: "Both approaches achieve the same O(n) time complexity for Fibonacci by eliminating redundant recomputation, but tabulation avoids recursive call-stack overhead entirely (and can sometimes be optimized to use only O(1) extra space, by keeping just the last two values instead of a full table), while memoization more directly mirrors the problem's natural recursive definition, which can make it easier to derive from a naive recursive solution."
  - type: open_answer
    difficulty: 3
    text: "Explain what the two-pointer technique is and how it can solve the problem of finding whether a sorted array contains two numbers that sum to a given target, in O(n) time instead of O(n^2)."
    answer: "A naive approach checks every possible pair of numbers (nested loops), taking O(n^2) time. The two-pointer technique instead uses one pointer starting at the beginning of the sorted array (the smallest value) and another starting at the end (the largest value). At each step, it checks the sum of the two pointed-to values: if the sum equals the target, a matching pair has been found; if the sum is too small, the left pointer moves right (increasing the sum, since the array is sorted); if the sum is too large, the right pointer moves left (decreasing the sum). Because each step moves one of the two pointers strictly inward, and they can only move toward each other a total of n times combined before meeting, this process examines at most O(n) pairs total, rather than every possible O(n^2) pair."
    explanation: "This technique specifically relies on the array being sorted — the direction to move a pointer (which pointer to adjust, and which way) is only a valid, correct decision because sortedness guarantees moving a pointer inward predictably increases or decreases the current sum in the expected direction."
