    difficulty: 2
    text: "Explain why choosing the pivot randomly in quicksort (rather than always picking, say, the first element) helps avoid its worst-case O(n^2) behavior in practice."
    answer: "Quicksort's O(n^2) worst case happens when the chosen pivot repeatedly produces maximally unbalanced partitions — for example, if the pivot is always the smallest (or largest) remaining element, one partition ends up empty and the other contains everything else, giving no real reduction in problem size per recursive call. If the pivot is always chosen as a fixed position (like the first element), an adversary (or simply already-sorted input) can reliably trigger this worst case every single time, since the pivot choice is entirely predictable. Choosing the pivot randomly makes it extremely unlikely that a long, unbalanced-partition sequence would occur by chance across many recursive calls, so in practice (and in expectation, mathematically), random pivot selection makes quicksort's expected running time O(n log n) regardless of the specific input's initial ordering."
    explanation: "This doesn't change quicksort's theoretical worst-case complexity (a pathologically unlucky sequence of random choices could still, in principle, hit the bad case) — it changes the practical likelihood of hitting that worst case, converting an input-dependent guaranteed worst case into an input-independent, vanishingly unlikely one."
