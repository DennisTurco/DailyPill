      class Node:
          def __init__(self, value, next=None):
              self.value = value
              self.next = next

      def reverse_list(head):
          prev = None
          current = head
          while current is not None:
              next_node = current.next
              current.next = prev
              prev = current
              current = next_node
          return prev
      ```
