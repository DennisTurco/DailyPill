    difficulty: 3
    text: "Explain, at a conceptual level, how OAuth2's Authorization Code flow lets a third-party application access a user's data on another service without ever seeing that user's actual password for the other service."
    answer: "The user is redirected to the resource-owning service's own login page (not the third-party application's), where they authenticate directly with that service and approve the specific access the third-party app is requesting. The resource service then redirects back to the third-party app with a short-lived authorization code (not the actual credentials, and not yet the access token). The third-party app's backend then exchanges that authorization code, directly and privately (server-to-server, not through the user's browser), for an actual access token from the resource service. At no point does the third-party application ever see or handle the user's actual password for the resource service — it only ever receives a limited-scope access token after the user has explicitly approved that specific access on the resource service's own trusted login page."
    explanation: "This design specifically protects the user's real credentials from ever being exposed to (or even seen by) the third-party application, while still letting that application act on the user's behalf within whatever scope of access the user explicitly approved."
  - type: open_answer
    difficulty: 2
    text: "Explain what CORS is protecting against, and describe what happens (from the browser's perspective) when a page's JavaScript tries to call a different-origin API that hasn't configured CORS to allow it."
    answer: "CORS exists because, by default, browsers block a web page's JavaScript from making requests to a different origin (different domain, scheme, or port) than the one the page itself was loaded from, as a security measure preventing a malicious page from silently making authenticated requests to other sites on a visitor's behalf using their existing cookies/session. If a page's script tries to call a different-origin API that hasn't returned the appropriate CORS headers (like Access-Control-Allow-Origin) permitting that specific origin, the browser blocks the response from being accessible to the calling script (the request may still technically reach the server, but the browser refuses to hand the response back to the JavaScript that made the call), typically surfacing as a CORS-related error in the browser's developer console."
    explanation: "This is enforced entirely by the browser as a client-side protection for the end user — it is not something the requesting server or its network traffic is prevented from sending; a non-browser client (like a backend service, or a tool like curl) making the exact same cross-origin request is not subject to CORS restrictions at all, since CORS is specifically a browser security mechanism protecting the person browsing the web page."
  - type: open_answer
    difficulty: 4
    text: "Explain why GraphQL's flexible, client-defined queries make traditional HTTP/CDN caching (which keys on URL) less straightforward than it is for a typical REST API, and describe one common workaround used in practice."
    answer: "A REST API typically exposes many distinct URLs, each corresponding to a specific, predictable shape of data (GET /users/42 always returns the same kind of representation for that resource), which maps naturally onto standard HTTP caching that keys entries by URL (and method). GraphQL instead usually exposes a single endpoint (often reached via POST), where the actual query — describing exactly which fields and related data the client wants — lives in the request body rather than the URL, so two very different GraphQL requests can hit the exact same URL, making simple URL-based caching unable to distinguish between them. A common workaround is normalized client-side caching (as used by libraries like Apollo Client or Relay), which caches individual entities by their own ID (independent of which specific query fetched them) and intelligently merges/reuses cached entity data across different queries that happen to reference the same underlying objects."
    explanation: "Some GraphQL setups also move to using GET with a hashed/persisted query ID in the URL specifically to regain some of that URL-based cacheability, trading away some of GraphQL's per-request query flexibility in exchange for more traditional HTTP caching behavior."
  - type: open_answer
    difficulty: 3
    text: "Design (in words) a simple rate-limiting strategy for a public API that allows each API key up to 100 requests per minute, and describe what response the API should return once a client exceeds that limit."
    answer: "For each API key, maintain a counter of requests made within the current rolling (or fixed) one-minute window — commonly implemented with a fast in-memory store like Redis, incrementing a per-key counter and setting it to expire after 60 seconds. Each incoming request first checks and increments this counter; if it exceeds 100 for that key within the current window, the API rejects the request with HTTP status 429 Too Many Requests, and should include a 'Retry-After' header (or similar rate-limit headers indicating the limit, remaining requests, and reset time) telling the client how long to wait before its next request is likely to succeed."
    explanation: "Many production APIs also expose the current rate-limit state proactively via response headers on every request (not just when the limit is exceeded) — e.g. X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset — so well-behaved clients can throttle themselves proactively rather than needing to hit 429 first to discover the limit."
  - type: open_answer
    difficulty: 3
    text: "Explain why a webhook endpoint needs to verify a signature on incoming requests, and describe at a high level how HMAC-based signature verification typically works for this purpose."
    answer: "A webhook endpoint is, by necessity, a publicly reachable URL, since the external event source needs to be able to reach it over the internet; without any verification, anyone who discovers or guesses that URL could send a fabricated request pretending to be a legitimate event, potentially tricking the receiving application into acting on fake data. HMAC-based signature verification typically works by both the event source and the receiver sharing a secret key established in advance (out of band, e.g. during webhook registration); the sender computes a cryptographic hash (HMAC) of the request payload using that shared secret and includes it in a request header (e.g. X-Signature). The receiver independently computes the same HMAC over the payload it received, using its own copy of the shared secret, and compares the two — if they match, the receiver can be confident the payload genuinely came from the expected sender and hasn't been tampered with in transit, since producing a matching signature without knowing the shared secret is computationally infeasible."
    explanation: "This is a practical, widely-used application of HMAC as a message authentication code: it doesn't hide the payload's contents (the payload itself may well be sent in plaintext alongside the signature), but it does let the receiver verify both the authenticity (it came from someone who knows the shared secret) and integrity (it wasn't altered after signing) of the message."
  - type: open_answer
    difficulty: 2
    text: "Explain the difference between an HTTP API being 'stateless' versus one that relies on server-side session state, and describe one practical benefit statelessness provides for scaling an API across multiple server instances."
    answer: "A stateless API requires every request to carry all the information the server needs to process it (e.g. an auth token identifying the caller), with the server not relying on anything remembered from previous requests from that same client. A session-based (stateful) approach instead has the server store context about a client (e.g. in an in-memory session store) after an initial login, which subsequent requests implicitly rely on being available. The practical scaling benefit of statelessness: since no server-side memory of a specific client is required, any request from any client can be handled by any available server instance behind a load balancer, with no need to route a given client's requests back to the exact same server instance that handled their previous request, or to replicate session state across every server in a cluster."
    explanation: "This is precisely why token-based (e.g. JWT) authentication is popular in horizontally-scaled systems: since the token itself carries what's needed to identify/authorize the caller on every request, any server instance can validate it independently, without needing shared, synchronized session storage across the whole server fleet."
  - type: open_answer
    difficulty: 2
    text: "Explain why returning HTTP status 200 with an 'error' field embedded in the JSON body (instead of an actual 4xx/5xx status code) is generally considered a design mistake for an API's error handling."
    answer: "HTTP status codes are the standard, protocol-level signal that clients, proxies, load balancers, monitoring tools, and generic HTTP client libraries already understand and act on automatically (e.g. treating 2xx as success and 4xx/5xx as failure) without needing to know anything about a specific API's custom JSON shape. If an API always returns 200 regardless of whether the operation actually succeeded, all of that generic tooling incorrectly treats every response as successful, and every single client integration must manually inspect the response body on every call just to find out whether it actually worked — duplicating logic that proper status codes would have handled automatically, and breaking generic error-handling/retry/alerting logic that reasonably assumes status codes reflect actual outcomes."
    explanation: "This is a common real-world anti-pattern, sometimes seen in older or poorly-designed APIs; using status codes as intended (2xx for success, 4xx for client errors, 5xx for server errors) lets an enormous amount of existing HTTP-aware infrastructure and tooling work correctly with zero extra effort."
  - type: open_answer
    difficulty: 3
    text: "Explain the difference between HTTP status codes 301 and 302, and describe a concrete situation where using the wrong one could cause a problem (e.g. for search engine indexing)."
    answer: "301 (Moved Permanently) tells the client (and search engines) that a resource has permanently relocated to a new URL, and that references/bookmarks/search index entries should be updated to point to the new location going forward. 302 (Found) signals only a temporary redirect, implying the original URL is still the canonical one and should continue to be used/indexed going forward. If a permanent URL change is mistakenly implemented with a 302 instead of a 301, search engines may continue indexing and ranking the old URL as canonical rather than transferring that ranking/authority to the new URL, since a 302 explicitly signals 'this is temporary, don't treat the new location as the permanent replacement'."
    explanation: "This 301-vs-302 distinction is a classic real-world SEO pitfall: using the semantically wrong redirect type for a permanent move can measurably hurt a site's search ranking during a URL migration, even though both redirect types work identically from a purely functional 'does the browser end up at the right page' perspective."
  - type: open_answer
    difficulty: 2
    text: "Explain the difference between 401 and 405 status codes, using an example of a client sending a DELETE request to an endpoint that only supports GET, without any authentication provided."
    answer: "401 Unauthorized would be the correct response if the endpoint requires authentication and the client didn't provide valid credentials at all — the server can't yet determine who is making the request. 405 Method Not Allowed would be the correct response if the endpoint recognizes the resource but simply doesn't support the DELETE method on it (only GET is implemented), regardless of whether the caller is authenticated. In the specific example given (DELETE sent to a GET-only endpoint, with no authentication provided), a well-designed API would likely need to decide which check to perform first — some APIs check authentication before method support (returning 401), others check method support first regardless of auth status (returning 405) — but conceptually the two status codes represent genuinely different problems: 'who are you' (401) versus 'that action isn't supported on this resource' (405)."
    explanation: "This highlights that HTTP status codes aren't just arbitrary labels — each is meant to communicate a specific, distinct category of problem, and conflating them (e.g. always returning 401 for any request problem) loses information that would otherwise help a client (or a developer debugging an integration) understand exactly what went wrong and how to fix it."
  - type: open_answer
    difficulty: 3
    text: "Explain why a well-designed REST API should generally avoid encoding actions as verbs in the URL path (e.g. POST /createOrder) in favor of resource-oriented URLs with the HTTP method conveying the action (e.g. POST /orders)."
    answer: "Encoding the action directly in the URL path duplicates information that the HTTP method already conveys, and tends to lead to an ever-growing, inconsistent list of ad-hoc endpoint names (createOrder, cancelOrder, getOrderDetails, updateOrderStatus...) that don't follow any predictable pattern, making the API harder to learn and to keep consistent as it grows. A resource-oriented design instead treats /orders as a consistent noun, with the small, fixed set of HTTP methods (GET to retrieve, POST to create, PUT/PATCH to update, DELETE to remove) expressing the action — so once a client understands this pattern for one resource, the same pattern predictably applies to every other resource in the API, without needing to learn a new, uniquely-named endpoint for every possible action."
    explanation: "Not every action fits neatly into CRUD-style HTTP verbs (e.g. 'cancel an order' isn't cleanly a DELETE, since the order record itself isn't being removed) — a common resolution is modeling the action itself as a sub-resource or state transition, e.g. POST /orders/42/cancellations, keeping the resource-oriented, noun-based pattern rather than falling back to a bare verb in the path."
  - type: open_answer
    difficulty: 4
    text: "Explain why an idempotency key needs to be generated by the client (not the server) and sent with the original request, rather than being something the server assigns after the fact."
    answer: "The entire purpose of an idempotency key is to let the server recognize that a retried request is the same logical attempt as a previous one, specifically in the ambiguous case where the client never received a response to the original request (e.g. due to a network timeout) and therefore doesn't know whether it succeeded or not. If the server were the one to generate this key (e.g. only after successfully processing a request), the client would have no way to include that same key on a retry, since it never received the original response containing it — the client needs to decide on and send the identifying key upfront, before knowing the outcome, precisely so that if the same request is sent again (with the same key) after a failure to receive a response, the server can recognize it as a retry of the exact same logical operation rather than as a brand-new one."
    explanation: "In practice, this is usually implemented by having the client generate a unique key (e.g. a UUID) once per logical operation attempt, sending it as a header (like 'Idempotency-Key') on both the original request and any retries of that same operation, letting the server store the outcome keyed by that value and return the cached result for any subsequent request bearing the same key rather than re-executing the action."
  - type: open_answer
    difficulty: 3
    text: "Explain the difference between authentication and authorization, using a concrete API example that illustrates both."
    answer: "Authentication is the process of verifying who is making a request — for example, checking that a submitted username/password combination, or a bearer token, is valid and corresponds to a real, known user account; this answers 'who are you'. Authorization is the separate process of determining what that now-identified user is actually allowed to do — for example, checking whether that specific authenticated user has permission to delete a particular order, or view another user's private data; this answers 'are you allowed to do this'. A concrete example: a logged-in regular user (successfully authenticated) tries to access an admin-only endpoint to view all users' data — the request correctly identifies who they are, but authorization correctly denies the request (typically with 403 Forbidden) because that identity, while valid, doesn't have permission for this particular action."
    explanation: "This distinction is exactly why 401 (an authentication failure — the server doesn't know who you are) and 403 (an authorization failure — the server knows who you are, but denies the specific action) are separate, meaningfully different status codes rather than being interchangeable."
  - type: open_answer
    difficulty: 3
    text: "Explain why placing an API's version number in the URL path (e.g. /v1/users, /v2/users) makes it easier to introduce breaking changes without disrupting existing clients."
    answer: "By keeping the old version's routes (e.g. /v1/users) fully intact and unchanged while introducing a new version's routes (e.g. /v2/users) alongside them, existing clients that were built against v1 continue working exactly as before, completely unaffected by whatever breaking changes were introduced in v2 (different field names, removed fields, different validation rules, etc.). New clients (or existing clients that have been updated to handle the changes) can opt into the new version by simply changing which URL prefix they call, at their own pace, rather than every client being forced to adapt to breaking changes simultaneously the moment they're deployed."
    explanation: "The tradeoff is that the API provider now needs to maintain (and eventually deprecate/sunset) multiple versions of the API simultaneously for some transition period, which is real ongoing maintenance cost — but it's often considered worthwhile compared to the alternative of breaking every existing client's integration all at once with no migration window."
  - type: open_answer
    difficulty: 2
    text: "Explain why an API returning validation errors as a structured list of {field, message} objects is more useful to a client building a web form than a single string error message."
    answer: "A single string message (e.g. 'Invalid input: email and age are both wrong') gives the client nothing to work with programmatically — it would have to try to parse or guess which specific form fields the message refers to, which is fragile and error-prone if the message wording ever changes. A structured list like [{'field': 'email', 'message': 'must be a valid email'}, {'field': 'age', 'message': 'must be positive'}] lets the client directly map each error to the specific input field it concerns, highlighting exactly that field in the UI and showing the specific, relevant message right next to it, rather than showing one vague, combined error banner that doesn't clearly indicate which of possibly several problems apply to which input."
    explanation: "This structured approach also scales cleanly to forms with many fields and multiple simultaneous validation failures, where a single combined string message would quickly become unwieldy and hard for a user to act on."
  - type: open_answer
    difficulty: 3
    text: "Explain the tradeoff between designing an API to expose fine-grained resources (many small endpoints) versus coarser-grained resources (fewer, larger endpoints returning more embedded/nested data), in terms of the number of requests a typical client needs to make."
    answer: "Fine-grained resources (e.g. separate endpoints for /orders/42, /orders/42/items, /orders/42/customer) keep each response small and focused, but a client that needs the full picture of an order — its items and its customer's details — may need to make several separate requests and assemble the result itself, increasing total round-trip latency, especially over a slow or high-latency connection. Coarser-grained resources (e.g. a single /orders/42 endpoint that embeds the items and customer details directly in one response) reduce the number of round trips needed for that specific use case, but risk over-fetching data that isn't always needed (increasing response size for cases where the caller only wanted the order's basic details) and can make the embedded data structure less flexible to reuse for other different use cases that want a different combination of related data."
    explanation: "This exact tradeoff (many small round trips versus fewer, larger, less flexible responses) is one of the core motivations behind GraphQL, which lets each client specify exactly the fields and nested relations it wants in a single request, rather than the API provider having to pick one fixed granularity that can't perfectly satisfy every possible client use case."
  - type: open_answer
    difficulty: 3
    text: "Explain what a 'breaking change' means in the context of API versioning, and give two concrete examples of changes to an existing endpoint's response that would be considered breaking versus non-breaking."
    answer: "A breaking change is any modification to an API's existing contract that could cause an existing, unmodified client to malfunction when calling it, as opposed to a change a well-behaved existing client can simply ignore without any problem. A breaking example: renaming or removing an existing JSON field that clients were already reading (e.g. renaming 'user_id' to 'userId', or removing a field entirely) — any client code expecting the old field name would suddenly get null/undefined instead of the value it relied on. A non-breaking example: adding a brand-new, optional field to a response that wasn't there before — existing clients that don't know about (and don't look for) that new field simply continue working exactly as they did before, unaffected by its presence."
    explanation: "This distinction is exactly why API versioning strategies (URL path versioning, header versioning) exist specifically for the breaking case: purely additive, non-breaking changes can generally be rolled out to an existing API version without needing a whole new version, while genuinely breaking changes (renaming/removing fields, changing a field's data type, changing required parameters) typically warrant introducing a new version so existing clients aren't disrupted."
  - type: open_answer
    difficulty: 3
    text: "Write an example HTTP request (method, path, and one relevant header) that a client would send to conditionally check whether a cached resource has changed, using an ETag it previously received, and explain what response it should expect if the resource is unchanged."
    answer: |
      ```http
      GET /articles/42 HTTP/1.1
      Host: api.example.com
      If-None-Match: "a1b2c3d4"
      ```
      If the resource identified by /articles/42 still has the ETag "a1b2c3d4" (i.e. it hasn't changed since the client last fetched it), the server should respond with status 304 Not Modified and no response body, telling the client its existing cached copy is still valid and can be reused. If the resource has changed (and now has a different ETag), the server instead responds normally with status 200 and the full, updated resource body along with its new ETag.
    explanation: "This conditional GET pattern lets a client avoid re-downloading a resource's full body when nothing has actually changed, saving bandwidth and server processing time compared to always fetching and re-transmitting the complete representation on every request."
  - type: open_answer
    difficulty: 2
    text: "Explain what 'over-fetching' and 'under-fetching' mean in the context of REST API design, giving a brief example of each."
    answer: "Over-fetching happens when a response includes more data than the client actually needs for its current use case — for example, a mobile app's list screen only needs each user's name and avatar, but the /users endpoint always returns every field (address, phone number, account settings, etc.), wasting bandwidth transferring data that will just be discarded. Under-fetching happens when a single endpoint doesn't return enough related data, forcing the client to make additional follow-up requests to assemble what it actually needs — for example, fetching /orders/42 returns only basic order fields, requiring a second request to /orders/42/customer just to display the customer's name alongside the order."
    explanation: "Both are natural consequences of REST's fixed, server-defined response shapes per endpoint — a single shape can rarely be perfectly right for every client and every use case simultaneously, which is part of the motivation behind GraphQL's client-specified field selection, letting each query request exactly what it needs, no more and no less."
