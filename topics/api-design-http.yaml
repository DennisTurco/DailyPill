    answer: "With offset-based pagination (e.g. ?offset=20&limit=20), if a new item is inserted into the dataset (at a position before the current offset) while a client is midway through paging, everything after that insertion point shifts by one position; the client's next request for offset=40 would now return a dataset that has shifted, causing it to either skip an item it hadn't seen yet, or see an item again that it already saw on a previous page — the fixed numeric offset no longer lines up with a stable position in the now-changed dataset. Cursor-based pagination avoids this by anchoring each page's request to an actual value from the data itself (e.g. 'items with an ID greater than 517, limit 20') rather than a raw positional count; inserting a new item elsewhere in the dataset doesn't change what 'the next 20 items after ID 517' means, since that boundary is defined in terms of real data rather than a shifting numeric position."
    explanation: "This makes cursor-based pagination particularly well suited to frequently-changing datasets (like a live feed or an actively-updated table), at the cost of losing the ability to jump directly to an arbitrary page number the way offset-based pagination allows."
