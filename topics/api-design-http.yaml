name: API Design & HTTP
category: Computer Science
difficulty: medium
ai_generate: true
content: |
  HTTP fundamentals (methods, status codes, headers, caching, statelessness),
  REST API design principles (resources, versioning, pagination, filtering),
  authentication and authorization (API keys, Basic, Bearer/JWT, OAuth2),
  content negotiation, idempotency, rate limiting, CORS, and how REST compares
  to alternatives like GraphQL, gRPC, and webhooks.
manual_questions:
  - type: multiple_choice
    difficulty: 1
    text: "What does the HTTP GET method conventionally indicate?"
    options:
      - "A request to retrieve a resource's current representation, without modifying server state"
      - "A request to create a new resource on the server"
      - "A request to permanently delete a resource"
      - "A request to partially update an existing resource"
    answer: 0
    explanation: "GET is defined as a 'safe' method — it should not change server state — which is also why GET requests are commonly cached by browsers/proxies and why sensitive actions (like deleting data) should never be triggered by a plain GET."
  - type: multiple_choice
    difficulty: 1
    text: "What does the HTTP POST method conventionally indicate?"
    options:
      - "Submitting data to be processed, often resulting in the creation of a new resource"
      - "Retrieving a resource without any side effects"
      - "Requesting only the headers of a response, not the body"
      - "Removing a resource from the server"
    answer: 0
    explanation: "POST is the traditional method for creating a new resource (e.g. POST /orders creating a new order) or for actions that don't map cleanly onto GET/PUT/PATCH/DELETE — unlike GET, POST is neither safe nor guaranteed idempotent by default."
  - type: multiple_choice
    difficulty: 2
    text: "What is the key semantic difference between PUT and PATCH?"
    options:
      - "PUT conventionally replaces a resource entirely with the provided representation; PATCH applies a partial modification to an existing resource"
      - "PATCH can only be used to create new resources, never modify existing ones"
      - "PUT is only valid for images and binary files"
      - "They are exact synonyms with no distinction"
    answer: 0
    explanation: "A PUT request is expected to supply the full desired state of the resource (fields not included are conventionally treated as removed/reset), while PATCH is meant for sending only the specific fields that should change, leaving the rest of the resource untouched."
  - type: multiple_choice
    difficulty: 2
    text: "What does it mean for an HTTP method to be 'idempotent'?"
    options:
      - "Making the same request multiple times has the same effect on server state as making it once"
      - "The request can never fail under any circumstances"
      - "The request must always be encrypted"
      - "The response body must always be identical byte-for-byte across every call"
    answer: 0
    explanation: "PUT and DELETE are defined as idempotent: PUT-ing the same representation twice leaves the resource in the same final state as doing it once, and DELETE-ing an already-deleted resource still results in it being gone; POST is generally NOT idempotent, since repeating it typically creates a second, separate resource."
  - type: multiple_choice
    difficulty: 3
    text: "Is the HTTP GET method idempotent, and is it 'safe'?"
    options:
      - "It is both safe (no server state change) and idempotent (repeating it produces the same result)"
      - "It is idempotent but not safe"
      - "It is safe but not idempotent"
      - "It is neither safe nor idempotent"
    answer: 0
    explanation: "GET is defined as both safe (it shouldn't modify server-side state) and idempotent (repeated identical GETs return the same resource state, assuming nothing else changed it in the meantime) — these are related but distinct properties: safety is about side effects, idempotency is about the effect of repetition."
  - type: multiple_choice
    difficulty: 2
    text: "What does the HTTP status code 200 mean?"
    options:
      - "OK — the request succeeded"
      - "The requested resource was not found"
      - "The server encountered an unexpected error"
      - "The request requires authentication"
    answer: 0
    explanation: "200 is the general-purpose success status for most methods; more specific 2xx codes exist for particular situations, such as 201 for successful creation and 204 for success with no response body."
  - type: multiple_choice
    difficulty: 2
    text: "What does HTTP status code 201 conventionally indicate, and when is it typically returned?"
    options:
      - "Created — the request succeeded and resulted in a new resource being created, commonly returned by a successful POST"
      - "The client must authenticate before proceeding"
      - "The resource was permanently moved to a new URL"
      - "The server refuses to process the request due to something perceived as a client error"
    answer: 0
    explanation: "201 is more specific than a generic 200, explicitly signaling that a new resource now exists; a well-designed API returning 201 typically also includes a 'Location' header pointing to the newly created resource's URL."
  - type: multiple_choice
    difficulty: 2
    text: "What does HTTP status code 204 mean, and what is notable about its response body?"
    options:
      - "No Content — the request succeeded, but there is deliberately no response body"
      - "The resource has been permanently deleted and can never be recreated"
      - "The request was accepted but will be processed asynchronously later"
      - "The server is temporarily unavailable"
    answer: 0
    explanation: "204 is commonly returned by successful DELETE requests, or updates where there's nothing meaningful to return — a response with status 204 should not include a body, since the status code itself communicates that there is intentionally nothing further to return."
  - type: multiple_choice
    difficulty: 1
    text: "What does HTTP status code 404 mean?"
    options:
      - "Not Found — the server cannot find the requested resource"
      - "The request was successful"
      - "The client is not authorized to view the resource"
      - "The server encountered an internal error"
    answer: 0
    explanation: "404 indicates the requested URL doesn't correspond to any resource the server recognizes — it's distinct from 401/403 (which imply the resource might exist but access is denied) and from 500 (which implies a server-side failure processing an otherwise valid request)."
  - type: multiple_choice
    difficulty: 2
    text: "What is the difference between HTTP status codes 401 and 403?"
    options:
      - "401 means the client isn't authenticated at all; 403 means the client is authenticated but not authorized to access this specific resource"
      - "401 is used only for GET requests, 403 only for POST requests"
      - "They are exact synonyms with no distinction"
      - "403 always implies a server-side bug, 401 never does"
    answer: 0
    explanation: "401 Unauthorized (a somewhat confusingly named status) actually means 'you need to authenticate' — typically returned when credentials are missing or invalid; 403 Forbidden means the server recognizes who you are but you still don't have permission to perform this particular action or access this particular resource."
  - type: multiple_choice
    difficulty: 3
    text: "What does HTTP status code 422 conventionally indicate, as distinct from 400?"
    options:
      - "Unprocessable Entity — the request is syntactically well-formed, but semantically invalid (e.g. fails validation rules)"
      - "The requested resource has been permanently deleted"
      - "The client must retry the request over a different protocol"
      - "The server does not support the requested HTTP method at all"
    answer: 0
    explanation: "400 Bad Request typically signals the request itself is malformed (e.g. invalid JSON syntax); 422 is used when the request is well-formed and parseable, but the data it contains fails validation rules (e.g. a required field is missing, or an email field doesn't look like an email) — some APIs use 400 for both cases, but 422 gives clients a more specific signal when this distinction is made deliberately."
  - type: multiple_choice
    difficulty: 3
    text: "What does HTTP status code 429 mean?"
    options:
      - "Too Many Requests — the client has sent too many requests in a given time frame (rate limiting)"
      - "The request timed out waiting for the server"
      - "The requested resource requires payment before access"
      - "The server is currently undergoing scheduled maintenance"
    answer: 0
    explanation: "429 is the standard status for signaling that rate limiting has been triggered; APIs commonly pair it with a 'Retry-After' header telling the client how long to wait before making another attempt."
  - type: multiple_choice
    difficulty: 2
    text: "What is the general difference between a 4xx and a 5xx HTTP status code?"
    options:
      - "4xx indicates a problem with the client's request; 5xx indicates the server failed to fulfill an otherwise valid request"
      - "4xx is used only for GET requests, 5xx only for POST requests"
      - "5xx always means the request succeeded but slowly"
      - "There is no meaningful distinction between the two ranges"
    answer: 0
    explanation: "The HTTP status code ranges broadly categorize the outcome: 4xx puts the responsibility on the client (bad input, missing auth, requesting something that doesn't exist), while 5xx signals that something went wrong on the server's side even though the client's request was reasonable."
  - type: multiple_choice
    difficulty: 3
    text: "What is the difference between HTTP status codes 502 and 503?"
    options:
      - "502 (Bad Gateway) means an upstream server returned an invalid response to a gateway/proxy; 503 (Service Unavailable) means the server is temporarily unable to handle requests, often due to overload or maintenance"
      - "They are exact synonyms with no distinction"
      - "502 is a client error and 503 is a server error"
      - "503 means the request succeeded, just slowly"
    answer: 0
    explanation: "502 typically appears when a reverse proxy or load balancer couldn't get a valid response from a backend server it forwarded the request to; 503 signals the server itself is deliberately or temporarily not accepting requests (e.g. it's overloaded, or down for maintenance), often paired with a 'Retry-After' header."
  - type: multiple_choice
    difficulty: 2
    text: "What does the 'Content-Type' HTTP header specify?"
    options:
      - "The media type (format) of the request or response body, such as application/json or text/html"
      - "The total number of bytes allowed in the response"
      - "The specific HTTP version being used"
      - "The exact server software handling the request"
    answer: 0
    explanation: "Content-Type tells the receiving end how to interpret the body — e.g. 'application/json' means the body should be parsed as JSON — and mismatches between the declared Content-Type and the actual body format are a common source of parsing errors."
  - type: multiple_choice
    difficulty: 2
    text: "What does the 'Authorization' HTTP header typically carry?"
    options:
      - "Credentials proving the client's identity, such as a Bearer token or Basic auth credentials"
      - "The list of HTTP methods the server supports"
      - "The exact expiration date of the requested resource"
      - "A list of every intermediate proxy the request passed through"
    answer: 0
    explanation: "The Authorization header is where most authentication schemes place their credentials — e.g. 'Authorization: Bearer <token>' for token-based auth, or 'Authorization: Basic <base64(username:password)>' for Basic authentication."
  - type: multiple_choice
    difficulty: 3
    text: "What does the HTTP 'Accept' header let a client do?"
    options:
      - "Indicate which media type(s) it prefers the response to be in, letting the server choose an appropriate representation (content negotiation)"
      - "Force the server to always respond in plain text regardless of what's requested"
      - "Specify the maximum number of redirects the client will follow"
      - "Grant the server permission to cache the request indefinitely"
    answer: 0
    explanation: "A client sending 'Accept: application/json' is telling the server it prefers a JSON response; if a resource is available in multiple formats (JSON, XML, HTML), the server can use this header to decide which representation to return — this mechanism is called content negotiation."
  - type: multiple_choice
    difficulty: 3
    text: "What is the purpose of the 'ETag' response header combined with the 'If-None-Match' request header?"
    options:
      - "They enable conditional caching: the server sends a version identifier (ETag) for a resource, and the client can send it back to ask the server to only send a full response if the resource has actually changed"
      - "ETag encrypts the response body so only the intended client can decrypt it"
      - "If-None-Match forces the server to always send a fresh response, bypassing any cache"
      - "They are used exclusively for authentication, not caching"
    answer: 0
    explanation: "A client that already has a cached copy of a resource (along with its previous ETag) can send 'If-None-Match: <etag>'; if the resource hasn't changed, the server responds with 304 Not Modified (no body), letting the client reuse its cached copy and saving bandwidth compared to re-sending the full response every time."
  - type: multiple_choice
    difficulty: 2
    text: "What does HTTP status code 304 mean, in the context of conditional requests?"
    options:
      - "Not Modified — the resource hasn't changed since the client's cached version, so the client should reuse its cache instead of receiving a new body"
      - "The resource has been permanently deleted"
      - "The request method is not supported for this resource"
      - "The server requires additional authentication before responding"
    answer: 0
    explanation: "304 is returned in response to a conditional request (using If-None-Match or If-Modified-Since) when the resource is confirmed unchanged, deliberately omitting the response body since the client already has an up-to-date copy cached locally."
  - type: multiple_choice
    difficulty: 3
    text: "What do the 'Cache-Control: max-age=3600' directive tell a client or intermediate cache?"
    options:
      - "The response can be considered fresh and reused from cache for up to 3600 seconds without re-checking with the server"
      - "The server will delete the resource in exactly 3600 seconds"
      - "The response must never be cached under any circumstances"
      - "The client must wait 3600 seconds before making its next request"
    answer: 0
    explanation: "max-age specifies, in seconds, how long a response may be considered fresh and served from cache without revalidating with the origin server; after that time expires, a cache should revalidate (e.g. via a conditional request) or fetch a fresh copy before serving it again."
  - type: multiple_choice
    difficulty: 2
    text: "What does 'Cache-Control: no-store' instruct caches to do?"
    options:
      - "Do not store any part of the request or response in any cache at all, even temporarily"
      - "Cache the response forever, with no expiration"
      - "Store the response, but only on the client, never on any intermediate proxy"
      - "It has no actual effect and is purely advisory documentation"
    answer: 0
    explanation: "no-store is the strictest caching directive, appropriate for genuinely sensitive responses (e.g. containing personal or financial data) that should never persist in any cache anywhere along the path, unlike 'no-cache' (which still allows storage, but requires revalidation before reuse)."
  - type: multiple_choice
    difficulty: 1
    text: "What does it mean for an HTTP API to be 'stateless'?"
    options:
      - "Each request from a client must contain all the information the server needs to process it, without relying on stored server-side session state from previous requests"
      - "The API never returns any data in its responses"
      - "The API can only be called exactly once per client"
      - "The server must restart after every single request"
    answer: 0
    explanation: "Statelessness (a core REST constraint) means the server doesn't need to remember anything about a client between requests — any needed context (like an auth token) is included in each request itself, which simplifies scaling since any server instance can handle any request without needing shared session state."
  - type: multiple_choice
    difficulty: 2
    text: "In REST terminology, what is a 'resource'?"
    options:
      - "Any object or concept that can be named and addressed via a URL, such as a user, an order, or a collection of orders"
      - "A synonym specifically for a database table"
      - "Only files stored on the server's disk"
      - "A term exclusively for authentication tokens"
    answer: 0
    explanation: "REST models an API as a set of addressable resources (e.g. /users/42, /orders) manipulated through a uniform set of operations (the HTTP methods); the resource concept is deliberately abstract — it doesn't have to map directly onto any specific database structure."
  - type: multiple_choice
    difficulty: 2
    text: "Which URL is more consistent with typical REST API naming conventions for retrieving a specific user?"
    options:
      - "GET /users/42"
      - "GET /getUser?id=42"
      - "POST /user/retrieve/42"
      - "GET /api/do-get-user-action/42"
    answer: 0
    explanation: "REST convention favors nouns (resources) in the URL path with the HTTP method conveying the action, so '/users/42' (GET to retrieve, DELETE to remove, PUT/PATCH to update) is preferred over embedding a verb like 'getUser' into the path, which duplicates what the HTTP method itself already expresses."
  - type: multiple_choice
    difficulty: 2
    text: "Why do REST APIs conventionally use plural nouns for collection endpoints (e.g. /users rather than /user)?"
    options:
      - "It reads naturally as 'the collection of users', with individual resources addressed by appending an identifier (e.g. /users/42), keeping the naming pattern consistent"
      - "Plural nouns are required by the HTTP specification itself"
      - "Singular nouns cause a measurable performance penalty"
      - "There is no actual convention around this in practice"
    answer: 0
    explanation: "This is purely a widely-adopted convention (not an HTTP requirement) that keeps naming predictable: GET /users lists the collection, GET /users/42 retrieves one member of it, POST /users creates a new member — consistently pluralizing collection names avoids inconsistent, harder-to-guess endpoint naming."
  - type: multiple_choice
    difficulty: 3
    text: "What is a common approach for versioning a REST API by embedding the version in the URL path?"
    options:
      - "Prefixing routes with a version segment, e.g. /api/v1/users, /api/v2/users"
      - "Changing the server's IP address for each new version"
      - "Requiring clients to recompile their entire application for every API change"
      - "Renaming every resource randomly with each release"
    answer: 0
    explanation: "URL-path versioning (e.g. /v1/, /v2/) is simple and highly visible, letting multiple API versions be served simultaneously so existing clients aren't broken by changes made for a newer version; the alternative is versioning via a request header (e.g. a custom 'Accept' media type or a dedicated version header), which keeps URLs version-agnostic but is less immediately visible."
  - type: multiple_choice
    difficulty: 3
    text: "What is 'offset-based' pagination, and what is a common drawback of it for frequently-changing data?"
    options:
      - "Clients request a page via a numeric offset and limit (e.g. ?offset=100&limit=20); if items are added or removed while paginating, the offset can skip or duplicate items across pages"
      - "Offset-based pagination guarantees perfectly consistent results even if the underlying data changes constantly"
      - "It is the only pagination approach that works with SQL databases"
      - "It requires the client to download the entire dataset before displaying any of it"
    answer: 0
    explanation: "Offset-based pagination is simple to implement and understand, but if a row is inserted or deleted before the current offset while a client is paging through results, the fixed numeric offset can cause the next page to skip an item or repeat one already seen, since the offset no longer lines up with a stable position in the underlying, now-changed dataset."
  - type: multiple_choice
    difficulty: 4
    text: "What is 'cursor-based' (or 'keyset') pagination, and how does it avoid offset-based pagination's consistency problem?"
    options:
      - "Each page's response includes an opaque cursor (typically derived from the last item's own sort key/ID) that the client passes back to fetch the next page, anchoring position to actual data rather than a shifting numeric offset"
      - "It requires downloading and caching the entire dataset locally before paging through it"
      - "It is functionally identical to offset-based pagination, just using a different parameter name"
      - "It only works for data that never changes at all"
    answer: 0
    explanation: "Because the cursor is derived from an actual item in the data (e.g. 'give me items after ID 517') rather than a raw positional count, inserting or deleting items elsewhere in the dataset doesn't shift what 'the next page' means relative to where the client already left off, avoiding the skip/duplicate problem that a numeric offset is prone to."
  - type: multiple_choice
    difficulty: 2
    text: "What is a common convention for letting API clients filter a collection endpoint's results using query parameters?"
    options:
      - "Query parameters matching field names, e.g. GET /orders?status=shipped&customer_id=42"
      - "Requiring a completely separate URL path for every possible combination of filters"
      - "Filtering can only be expressed by changing the HTTP method used"
      - "APIs cannot support filtering; it must always be done entirely on the client"
    answer: 0
    explanation: "Using query parameters named after the fields being filtered (status, customer_id, etc.) is a widely understood, simple convention that keeps the URL path itself focused on identifying the resource/collection, with query parameters expressing how to narrow down or shape the results."
  - type: multiple_choice
    difficulty: 2
    text: "What is 'Basic' HTTP authentication, and what is its main practical weakness?"
    options:
      - "Credentials (username:password) are base64-encoded and sent in the Authorization header on every request; base64 is trivially reversible, so Basic auth is only safe over HTTPS"
      - "It requires a multi-step handshake involving a separate authorization server"
      - "It cannot be used over HTTPS under any circumstances"
      - "It encrypts credentials strongly enough to be safe even over plain HTTP"
    answer: 0
    explanation: "Base64 encoding is not encryption — it's trivially decodable by anyone who intercepts the header — so Basic auth relies entirely on the transport layer (HTTPS/TLS) to keep credentials confidential in transit; using Basic auth over plain HTTP would expose the username and password to anyone able to observe the traffic."
  - type: multiple_choice
    difficulty: 2
    text: "What does 'Bearer' authentication (e.g. 'Authorization: Bearer <token>') mean, conceptually?"
    options:
      - "Whoever presents ('bears') the token is granted access, without needing to separately prove their identity beyond possessing the valid token"
      - "The token must always be a username and password combined together"
      - "It requires a new token to be generated for every single request"
      - "It only works for requests originating from a web browser"
    answer: 0
    explanation: "A bearer token (such as a JWT or an opaque API token) is presented as proof of authorization; the server trusts whoever holds a valid token, which is why bearer tokens must be protected carefully in transit (HTTPS) and at rest (not logged or exposed), since possession alone is sufficient to use them."
  - type: multiple_choice
    difficulty: 3
    text: "What is a JWT (JSON Web Token), structurally?"
    options:
      - "A compact, URL-safe token consisting of a header, a payload (claims), and a signature, all base64url-encoded and concatenated with dots"
      - "A binary file format used exclusively for image compression"
      - "A synonym for an HTTP cookie with no structural distinction"
      - "A token that always requires a database lookup on the server to validate"
    answer: 0
    explanation: "A JWT's three parts (header.payload.signature) let a server issue a token containing claims (like a user ID and expiration) that can be verified using the signature, often without needing a server-side lookup for every request — the payload itself is only base64-encoded (readable by anyone), not encrypted, which is why sensitive data generally shouldn't be placed directly in a JWT's claims."
  - type: multiple_choice
    difficulty: 3
    text: "Why is it important that a JWT's payload is only encoded, not encrypted, by default?"
    options:
      - "Anyone who obtains the token (even without knowing the signing key) can decode and read its contents, so sensitive information should not be placed directly in the claims"
      - "This means a JWT can never be tampered with under any circumstances"
      - "It means JWTs cannot be used for authentication at all"
      - "It has no practical implication for how JWTs should be used"
    answer: 0
    explanation: "The signature protects the token's integrity (detecting tampering) but does not hide its contents — base64url is trivially decodable, so a JWT should be treated as readable by anyone who has it, meaning things like plaintext passwords or highly sensitive personal data should not be embedded directly in its claims."
  - type: multiple_choice
    difficulty: 3
    text: "What problem does OAuth2 primarily solve?"
    options:
      - "Letting a user grant a third-party application limited access to their resources on another service, without sharing their actual password with that third-party application"
      - "Encrypting all HTTP traffic between a client and server"
      - "Guaranteeing a web page loads within a specific time limit"
      - "Replacing HTTP entirely with a new protocol"
    answer: 0
    explanation: "OAuth2 lets a user authorize, say, a photo-printing app to access their photos stored on a separate photo-hosting service, without ever giving the printing app the user's actual photo-service password — instead, the user authenticates directly with the photo service, which then issues a limited-scope access token to the printing app."
  - type: multiple_choice
    difficulty: 4
    text: "In OAuth2's Authorization Code flow, why does the client typically receive a short-lived 'authorization code' first, rather than the access token directly?"
    options:
      - "The authorization code is exchanged for the actual access token in a separate, server-to-server step, keeping the long-lived access token from ever passing through the user's browser (a less trusted, more exposed channel)"
      - "It has no real security benefit; it exists purely for historical/legacy reasons"
      - "Authorization codes are required only when using HTTP, never HTTPS"
      - "It allows the access token to be issued without the user ever needing to authenticate at all"
    answer: 0
    explanation: "Redirecting the authorization code back through the user's browser is less risky than redirecting the actual access token that way, since a short-lived, single-use code is less valuable if intercepted; the real access token exchange happens directly between the client's backend and the authorization server, over a channel not exposed to the browser or any redirect chain."
  - type: multiple_choice
    difficulty: 2
    text: "What is a common, simple alternative to OAuth2/JWT for authenticating machine-to-machine or internal API calls?"
    options:
      - "A static API key sent in a header (e.g. 'X-API-Key: ...'), validated against a list of known valid keys"
      - "Requiring the caller to solve a CAPTCHA on every request"
      - "Sending credentials as plain text in the URL's query string"
      - "There is no valid alternative; OAuth2 is mandatory for any API"
    answer: 0
    explanation: "API keys are simpler than full OAuth2 flows and are commonly used for server-to-server integrations where there's no interactive user to redirect through an authorization flow; they typically don't expire or carry fine-grained scopes the way OAuth2 tokens can, which is a tradeoff of simplicity versus flexibility/security granularity."
  - type: multiple_choice
    difficulty: 4
    text: "Why is putting sensitive credentials or tokens directly in a URL's query string generally discouraged?"
    options:
      - "URLs are commonly logged by web servers, proxies, and browser history, potentially exposing the sensitive value in multiple places outside the original request"
      - "Query strings have a hard technical limit of exactly 10 characters"
      - "Query strings are always transmitted completely unencrypted, even over HTTPS"
      - "This is purely a stylistic preference with no real security implication"
    answer: 0
    explanation: "Even over HTTPS (which encrypts the URL in transit), URLs frequently end up logged in places like web server access logs, browser history, and proxy logs — placing a sensitive token or credential in the query string risks it being persisted in plaintext in any of these logs, whereas the same value in a header (like Authorization) is less commonly logged by default."
  - type: multiple_choice
    difficulty: 2
    text: "What does 'rate limiting' on an API primarily protect against?"
    options:
      - "A single client (or an attacker) overwhelming the server with an excessive volume of requests in a short time"
      - "Users typing invalid JSON in a request body"
      - "The server running out of disk space"
      - "Clients using an outdated version of the API"
    answer: 0
    explanation: "Rate limiting caps how many requests a given client (identified by API key, IP, or user account) can make in a given time window, protecting the service from being overwhelmed — whether by a genuine traffic spike, a buggy client retrying too aggressively, or a deliberate denial-of-service attempt."
  - type: multiple_choice
    difficulty: 3
    text: "What is the purpose of an 'idempotency key' that some APIs let clients send on POST requests (e.g. for payment processing)?"
    options:
      - "It lets the server recognize and safely ignore a retried request that already succeeded, preventing the same non-idempotent action (like charging a payment) from being performed twice"
      - "It permanently identifies which user created the resource"
      - "It replaces the need for any authentication on the request"
      - "It is only used to improve the readability of server logs"
    answer: 0
    explanation: "POST is not idempotent by default, which is a real problem for actions like charging a credit card if a network issue causes a client to retry a request that may have already succeeded server-side; by including a unique idempotency key with the original request (and any retries of it), the server can detect a retry of an already-processed request and return the original result instead of performing the action again."
  - type: multiple_choice
    difficulty: 2
    text: "What does CORS (Cross-Origin Resource Sharing) exist to control?"
    options:
      - "Whether a web page's JavaScript, running on one origin, is allowed by the browser to make requests to a server on a different origin"
      - "Whether two different servers are allowed to physically share the same data center"
      - "The maximum number of cookies a website can set"
      - "Whether HTTP or HTTPS is used for a given request"
    answer: 0
    explanation: "By default, browsers block a web page's script from making requests to a different origin (different scheme, domain, or port) than the one the page was loaded from, as a security measure; CORS is the mechanism by which a server can explicitly opt in and tell the browser 'requests from this other origin are allowed', via response headers like Access-Control-Allow-Origin."
  - type: multiple_choice
    difficulty: 3
    text: "What is a CORS 'preflight' request?"
    options:
