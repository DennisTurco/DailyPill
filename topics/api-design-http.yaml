    explanation: "This is a common real-world API design bug: implementing an endpoint that behaves like PATCH (partial update) but naming/documenting it as PUT, which sets an incorrect expectation and can cause serious, unintended data loss for clients that (correctly, per HTTP semantics) assume PUT-ing a partial body means everything else is being explicitly cleared."
