    text: "Write a C# method called TryParseAge that takes a string input and an out int age parameter, returning true and setting age if input parses as a non-negative integer, and false otherwise (mirroring int.TryParse's style but also rejecting negative numbers)."
    answer: |
      ```csharp
      public bool TryParseAge(string input, out int age)
      {
          if (int.TryParse(input, out var parsed) && parsed >= 0)
          {
              age = parsed;
              return true;
          }
          age = 0;
          return false;
      }
      ```
    explanation: "The method first delegates the actual numeric parsing to int.TryParse, then adds the extra business rule (non-negative) on top; 'age' is always assigned on every path, satisfying the compiler's definite-assignment rule for 'out' parameters, whether the method returns true or false."
