    text: "Write a generic C# class Stack<T> that uses a List<T> internally, with a method Push(T item) to add an item, a method T Pop() to remove and return the most recently pushed item, and a property bool IsEmpty."
    answer: |
      ```csharp
      public class Stack<T>
      {
          private readonly List<T> _items = new();

          public bool IsEmpty => _items.Count == 0;

          public void Push(T item)
          {
              _items.Add(item);
          }

          public T Pop()
          {
              var last = _items[^1];
              _items.RemoveAt(_items.Count - 1);
              return last;
          }
      }
      ```
    explanation: "Push always appends to the end of the internal list; Pop reads and removes that same last element (using the C# 8 index-from-end operator '^1'), which is what gives the structure its LIFO (last-in, first-out) behavior, and IsEmpty is a simple computed property checking the count."
