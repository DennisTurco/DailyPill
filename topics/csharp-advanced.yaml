    text: "Write a C# operator overload for the '+' operator on a struct Vector2 (with public float X and Y) so that adding two Vector2 values adds their components."
    answer: |
      ```csharp
      public struct Vector2
      {
          public float X;
          public float Y;

          public static Vector2 operator +(Vector2 a, Vector2 b)
          {
              return new Vector2 { X = a.X + b.X, Y = a.Y + b.Y };
          }
      }
      ```
    explanation: "Operator overloads must be public static methods on the type; here the '+' overload takes both operands as parameters (there's no implicit 'this') and returns a brand-new Vector2 whose components are the sums of the inputs' components, leaving both original values unmodified."
