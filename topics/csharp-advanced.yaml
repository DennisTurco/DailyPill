      - "IComparable"
      - "IDisposable"
      - "ICloneable"
    answer: 0
    explanation: "foreach compiles to calls against GetEnumerator(), which IEnumerable (or IEnumerable<T>) provides; the other interfaces are for comparison, resource cleanup, and cloning respectively."
  - type: multiple_choice
    difficulty: 3
    text: "What is boxing in C#?"
