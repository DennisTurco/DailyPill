      - "internal"
      - "protected"
      - "private"
      - "public"
    answer: 0
    explanation: "'internal' members are visible anywhere within the declaring assembly but not from other assemblies; protected restricts to subclasses, private to the declaring type, and public has no restriction."
  - type: multiple_choice
    difficulty: 4
    text: "What does the 'in' parameter modifier do?"
    options:
      - "Passes the argument by reference as read-only"
      - "Passes the argument by value"
      - "Marks a covariant generic parameter"
      - "Marks the parameter as optional"
    answer: 0
    explanation: "'in' passes an argument by reference to avoid copying large structs, but the compiler prevents the method from modifying it, unlike 'ref' which allows mutation."
  - type: multiple_choice
    difficulty: 5
    text: "Which modifier marks a generic type parameter as covariant?"
    options:
      - "out"
      - "in"
      - "ref"
      - "params"
    answer: 0
    explanation: "'out' on a generic type parameter marks it covariant, meaning it can only appear in output positions and allows IFoo<Derived> to be used where IFoo<Base> is expected; 'in' marks contravariance instead."
  - type: multiple_choice
    difficulty: 4
    text: "What is a 'closure' in C#?"
    options:
      - "A lambda expression that captures variables from its enclosing scope"
      - "A sealed class"
      - "A static constructor"
      - "A finalizer"
    answer: 0
    explanation: "A closure is a lambda or anonymous method that keeps a live reference to variables from the scope in which it was created, letting it read and modify them even after that scope has returned."
  - type: multiple_choice
    difficulty: 5
    text: "What does the 'volatile' keyword guarantee for a field?"
    options:
      - "Reads and writes are not reordered or cached across threads"
      - "Compound operations on the field are atomic"
      - "The field can never be changed"
      - "The field is collected immediately by the garbage collector"
    answer: 0
    explanation: "'volatile' prevents the compiler and CPU from reordering or caching accesses to the field, ensuring other threads see the latest write; it does not make multi-step operations like increment atomic."
  - type: completion
    difficulty: 2
    text: "The C# keyword used to catch exceptions is ____."
    answer: "catch"
    explanation: "A 'catch' block follows a 'try' block and handles exceptions thrown within it, optionally filtering by exception type."
  - type: completion
    difficulty: 3
    text: "To prevent a class from being inherited, mark it with the ____ keyword."
    answer: "sealed"
    explanation: "'sealed' on a class stops any other class from deriving from it, which can also let the JIT compiler apply certain optimizations since no override is possible."
  - type: completion
    difficulty: 3
    text: "The keyword used together with 'try' to guarantee cleanup code always runs is ____."
    answer: "finally"
    explanation: "A 'finally' block executes whether or not an exception was thrown or caught, making it the standard place for guaranteed cleanup like releasing resources."
  - type: single_word
    difficulty: 2
    text: "What keyword declares a field that can only be assigned at declaration or in the constructor?"
    answer: "readonly"
    explanation: "'readonly' fields can be set only inline or within a constructor of the declaring class; after construction, any further assignment is a compile error."
  - type: single_word
    difficulty: 3
    text: "What is the C# term for wrapping a value type inside an object reference?"
    answer: "boxing"
    explanation: "Boxing allocates a heap object to hold a copy of a value type so it can be used wherever a reference type or object is expected."
  - type: single_word
    difficulty: 4
    text: "What is the mechanism called that lets code inspect types and members at runtime?"
    answer: "reflection"
    explanation: "Reflection is the .NET API (System.Reflection) that lets code examine assemblies, types, and members, and even invoke them dynamically, at runtime rather than compile time."
  - type: open_answer
    difficulty: 4
    text: "Explain the difference between Task and Task<T> in C# async programming."
    answer: "Task represents an asynchronous operation that does not return a value, while Task<T> represents an asynchronous operation that returns a value of type T."
    explanation: "Task is the async equivalent of a void-returning method — it represents the operation's completion but carries no result; Task<T> additionally exposes a Result property (or awaited value) of type T once the operation finishes."
  - type: open_answer
    difficulty: 5
    text: "Explain why 'async void' methods should generally be avoided in C#, except for event handlers."
    answer: "async void methods cannot be awaited, so exceptions thrown inside them cannot be caught by the caller and can crash the application; they should only be used for event handlers, where the framework requires a void signature."
    explanation: "Because there's no Task to await, the caller has no way to observe completion or catch exceptions from an async void method — unhandled exceptions instead propagate to the SynchronizationContext and can crash the process; event handlers are the sole exception because their delegate signature is fixed to void."
  - type: multiple_choice
    difficulty: 3
    text: "What does 'await' do at the point it is called?"
    options:
      - "Suspends the method logically without blocking the calling thread"
      - "Blocks the calling thread until the task completes"
      - "Spawns a new dedicated thread"
      - "Cancels the awaited task"
    answer: 0
    explanation: "'await' yields control back to the caller and schedules a continuation for when the awaited task completes, freeing the current thread rather than blocking it — unlike calling .Result or .Wait()."
  - type: multiple_choice
    difficulty: 2
    text: "Which async return type is generally discouraged except in event handlers?"
    options:
      - "Task"
      - "Task<T>"
      - "async void"
      - "ValueTask"
    answer: 2
    explanation: "async void methods can't be awaited or have their exceptions observed by the caller, so they're discouraged everywhere except event handlers, which require a void-returning delegate signature."
  - type: multiple_choice
    difficulty: 3
    text: "What does 'await Task.WhenAll(t1, t2, t3)' produce when each task is a Task<T>?"
    options:
      - "An array containing each task's result, in argument order"
      - "A single merged Task with no result"
      - "Only the result of whichever task finishes first"
      - "Nothing; WhenAll returns void"
    answer: 0
    explanation: "Task.WhenAll on Task<T> arguments returns a Task<T[]> whose result array preserves the order the tasks were passed in, not the order they completed; WhenAny would instead give just the first-completed task."
  - type: multiple_choice
    difficulty: 3
    text: "What is the purpose of a CancellationToken?"
    options:
      - "To cooperatively signal that an ongoing operation should stop"
      - "To forcibly kill a thread immediately"
      - "To pause a task indefinitely"
      - "To set a task's scheduling priority"
    answer: 0
    explanation: "A CancellationToken carries a cooperative cancellation signal that running code must check (or that throws OperationCanceledException) — it requests cancellation rather than forcibly terminating a thread."
  - type: multiple_choice
    difficulty: 4
    text: "Why is ConfigureAwait(false) commonly used in library code?"
    options:
      - "To avoid capturing and resuming on the original synchronization context"
      - "To make the awaited task run in parallel"
      - "To increase the operation's timeout"
      - "To disable cancellation support"
    answer: 0
    explanation: "ConfigureAwait(false) tells the awaiter not to resume the continuation on the captured SynchronizationContext (e.g. a UI thread), avoiding unnecessary context switches and a common source of deadlocks in library code."
  - type: multiple_choice
    difficulty: 4
    text: "What commonly causes the classic UI-thread deadlock when mixing blocking calls with async code?"
    options:
      - "Blocking on .Result or .Wait() while the continuation needs to resume on that same captured UI thread"
      - "Using await inside a loop"
      - "Using Task.WhenAll instead of Task.WhenAny"
      - "Passing a CancellationToken to an async method"
    answer: 0
    explanation: "The UI thread blocks waiting on .Result/.Wait(), but the async method's continuation needs that same thread's SynchronizationContext to resume — since the thread is blocked, the continuation can never run, producing a deadlock."
  - type: multiple_choice
    difficulty: 2
    text: "What does the += operator do on a multicast delegate?"
    options:
      - "Adds a method to the delegate's invocation list"
      - "Sums the return values of two delegates"
      - "Removes a method from the invocation list"
      - "Creates an entirely new delegate type"
    answer: 0
    explanation: "Delegate += combines delegates by appending the right-hand method(s) to the invocation list, producing a multicast delegate; -= is what removes a method from that list."
  - type: multiple_choice
    difficulty: 3
    text: "In a multicast delegate with a return value, what does invoking it return?"
    options:
      - "Only the return value of the last method invoked"
      - "The sum of all return values"
      - "A list containing every return value"
      - "Only the return value of the first method invoked"
    answer: 0
    explanation: "When a multicast delegate is invoked, all methods in its invocation list run in order, but the caller only receives the return value of the last one invoked — earlier results are discarded."
  - type: multiple_choice
    difficulty: 2
    text: "Which built-in delegate type represents a method that returns no value?"
    options:
      - "Action"
      - "Func"
      - "Predicate"
      - "Delegate"
    answer: 0
    explanation: "Action and its generic variants represent methods with a void return type; Func always returns a value (its last type parameter), and Predicate<T> is a Func<T, bool> specifically for boolean tests."
  - type: multiple_choice
    difficulty: 3
    text: "What is the classic 'captured variable' pitfall when a lambda inside a loop captures the loop variable itself instead of a per-iteration copy?"
    options:
      - "All the lambdas end up observing the same final value of that variable"
      - "The loop throws a runtime exception"
      - "Lambdas cannot be created inside loops at all"
      - "The compiler rejects the code"
    answer: 0
    explanation: "A closure captures the variable itself, not a snapshot of its value; if all lambdas share the same captured loop variable, they all see whatever value it holds when they eventually execute, typically the loop's final value (this is fixed in modern C# for 'for each' but remains a classic pitfall for indexed loops sharing one variable)."
  - type: multiple_choice
    difficulty: 3
    text: "Why do C# events only let external code add or remove handlers, instead of exposing the underlying delegate directly?"
    options:
      - "Because the 'event' keyword generates restricted add/remove accessors around the delegate field"
      - "Because events are read-only fields with no accessors at all"
      - "Because events must always be async"
      - "Because delegates cannot be declared public"
    answer: 0
    explanation: "The 'event' keyword compiles to a private delegate field plus public add/remove accessor methods, so outside code can only subscribe or unsubscribe (+=/-=) and can't reassign, invoke, or clear the delegate directly."
  - type: multiple_choice
    difficulty: 4
    text: "What is the safest way to invoke a multicast event to avoid a race between the null-check and the invocation?"
    options:
      - "Copy the delegate to a local variable first, then use ?.Invoke() on the copy"
      - "Check for null and then invoke directly on the field"
      - "Wrap every invocation in a try/catch"
      - "Mark the event field as volatile"
    answer: 0
    explanation: "Checking the field for null and then invoking it separately leaves a window where another thread could unsubscribe the last handler in between, causing a NullReferenceException; copying to a local first (or using ?.Invoke() on that local) makes the null-check-and-invoke effectively atomic against that race."
  - type: multiple_choice
    difficulty: 2
    text: "What does Dependency Injection let a class do?"
    options:
      - "Receive its dependencies from the outside instead of constructing them itself"
      - "Automatically generate its own interfaces"
      - "Skip using interfaces entirely"
      - "Avoid declaring a constructor"
    answer: 0
    explanation: "Dependency Injection supplies a class's collaborators (typically via constructor parameters) from an external source instead of the class creating them itself, decoupling it from concrete implementations."
  - type: multiple_choice
    difficulty: 3
    text: "Why is the Service Locator pattern generally considered an anti-pattern compared to constructor injection?"
    options:
      - "It hides a class's real dependencies instead of declaring them explicitly"
      - "It is always slower at runtime"
      - "It cannot be used together with interfaces"
      - "It requires significantly more memory"
    answer: 0
    explanation: "With Service Locator, a class pulls dependencies from a global registry internally, so its public API doesn't reveal what it actually needs, making the code harder to test and understand compared to declaring dependencies explicitly in the constructor."
  - type: multiple_choice
    difficulty: 2
    text: "In ASP.NET Core's built-in DI container, how long does a Scoped service live by default?"
    options:
      - "For the duration of a single request or scope"
      - "For the entire lifetime of the application"
      - "Only for a single method call"
      - "Until it is manually disposed by application code"
    answer: 0
    explanation: "A Scoped service gets one instance per created scope, which in ASP.NET Core typically corresponds to a single HTTP request; Singleton lives for the app's lifetime and Transient creates a new instance every time it's requested."
  - type: multiple_choice
    difficulty: 4
    text: "What is a 'captive dependency'?"
    options:
      - "A singleton service that holds a reference to a scoped service, keeping it alive too long"
      - "A service the container cannot resolve at all"
      - "A circular dependency between two services"
      - "A service that has been registered more than once"
    answer: 0
    explanation: "Because a singleton is constructed once and lives for the app's lifetime, injecting a scoped (or transient) service into it captures that instance and keeps it alive far beyond its intended scope, breaking the scoping model."
  - type: multiple_choice
    difficulty: 3
    text: "Dependency Injection is the practical mechanism most closely associated with which SOLID principle?"
    options:
      - "Dependency Inversion Principle"
      - "Single Responsibility Principle"
      - "Open/Closed Principle"
      - "Liskov Substitution Principle"
    answer: 0
    explanation: "The Dependency Inversion Principle states that high-level modules should depend on abstractions, not concrete implementations; DI is the common technique for supplying those abstractions from outside, putting the principle into practice."
  - type: multiple_choice
    difficulty: 3
    text: "What is the key structural difference between IQueryable<T> and IEnumerable<T>?"
    options:
      - "IQueryable exposes an Expression Tree plus a provider that can translate the query, e.g. into SQL"
      - "IQueryable can only ever be used with in-memory arrays"
      - "IEnumerable supports remote query translation and IQueryable does not"
      - "There is no real difference between the two"
    answer: 0
    explanation: "IQueryable<T> carries an Expression tree and an IQueryProvider that can translate LINQ operators into another query language (like SQL) for execution at the source, whereas IEnumerable<T> just enumerates items already in memory using LINQ to Objects."
  - type: multiple_choice
    difficulty: 2
    text: "Where does a filter typically execute when applied through IEnumerable<T> against data already loaded from a database?"
    options:
      - "In memory, on the client, after all rows have already been loaded"
      - "On the database, via generated SQL"
      - "On a separate background worker thread"
      - "It never actually executes"
    answer: 0
    explanation: "Once data is materialized into an IEnumerable<T> (e.g. after ToList()), any further LINQ filtering runs as compiled delegates over the in-memory collection, not as SQL against the database."
  - type: multiple_choice
    difficulty: 2
    text: "Which of these forces immediate execution of a LINQ query?"
    options:
      - "ToList()"
      - "Where()"
      - "Select()"
      - "OrderBy()"
    answer: 0
    explanation: "ToList() enumerates the whole query right away and materializes the results into a list; Where/Select/OrderBy just build up the deferred query without executing it."
  - type: multiple_choice
    difficulty: 3
    text: "What is 'deferred execution' in LINQ?"
    options:
      - "The query only runs when its results are actually iterated, not when it is defined"
      - "The query runs immediately as soon as it is defined"
      - "The query runs on a fixed timer"
      - "The query never actually runs"
    answer: 0
    explanation: "Most LINQ operators build a query object describing the operation but don't execute it until something enumerates the results (a foreach, ToList(), etc.), which is what 'deferred execution' means."
  - type: multiple_choice
    difficulty: 4
    text: "What is the N+1 query problem?"
    options:
      - "Running one query for the main entities, then N extra queries to load a related entity for each of them"
      - "Running exactly two queries regardless of data size"
      - "A query that returns N+1 duplicate rows"
      - "A deadlock that occurs between N separate queries"
    answer: 0
    explanation: "The N+1 problem happens when code loads a list of N entities with one query, then lazily triggers a separate query per entity to fetch a related object, resulting in N+1 total round trips instead of one query with a join or Include()."
  - type: multiple_choice
    difficulty: 1
    text: "What does ORM stand for?"
    options:
      - "Object-Relational Mapper"
      - "Object Runtime Manager"
      - "Output Record Model"
      - "Online Repository Manager"
    answer: 0
    explanation: "ORM stands for Object-Relational Mapper, a tool (like EF Core) that maps between object-oriented code and relational database tables."
  - type: multiple_choice
    difficulty: 2
    text: "In EF Core's Code First approach, what drives the database schema?"
    options:
      - "The C# entity classes and their configuration"
      - "An existing database that gets scaffolded into classes"
      - "Hand-written SQL scripts only"
      - "XML configuration files"
    answer: 0
    explanation: "In Code First, the developer writes C# entity classes and configuration (data annotations or Fluent API), and EF Core generates migrations/schema from those; Database First works the other way around, scaffolding classes from an existing database."
  - type: multiple_choice
    difficulty: 2
    text: "What is the DbContext in EF Core?"
    options:
      - "The session with the database that holds the model, DbSets and the change tracker"
      - "A single database table"
      - "A static utility class with no state"
      - "A raw connection string"
    answer: 0
    explanation: "DbContext represents a unit-of-work/session with the database: it exposes DbSet<T> properties for querying entities and tracks changes made to loaded entities so they can be persisted with SaveChanges()."
  - type: multiple_choice
    difficulty: 3
    text: "What does .AsNoTracking() do in an EF Core query?"
    options:
      - "Tells EF Core not to add the returned entities to the change tracker"
      - "Deletes the entities from the database"
      - "Forces eager loading of every relation"
      - "Disables SQL translation entirely, forcing client evaluation"
    answer: 0
    explanation: "AsNoTracking() returns entities without registering them in the context's change tracker, which reduces memory and CPU overhead for read-only queries since EF doesn't need to snapshot them for later change detection."
  - type: multiple_choice
    difficulty: 3
    text: "Which EF Core method performs eager loading of a navigation property?"
    options:
      - "Include()"
      - "Attach()"
      - "AsNoTracking()"
      - "FromSqlRaw()"
    answer: 0
    explanation: "Include() tells EF Core to load a related navigation property as part of the same query (typically via a SQL join), avoiding the need for separate lazy-loaded queries per entity."
  - type: multiple_choice
    difficulty: 4
    text: "Which EF Core change-tracker state indicates a tracked entity whose properties have changed since it was loaded?"
    options:
      - "Modified"
      - "Added"
      - "Detached"
      - "Unchanged"
    answer: 0
    explanation: "The change tracker marks an entity as Modified once one of its tracked property values differs from the originally loaded snapshot; Added is for new entities, Detached for untracked ones, and Unchanged for entities matching their original values."
  - type: multiple_choice
    difficulty: 2
    text: "What does the 'internal' access modifier restrict a type or member to?"
    options:
      - "The same assembly"
      - "The same namespace only"
      - "The same class only"
      - "Subclasses only, regardless of assembly"
    answer: 0
    explanation: "'internal' makes a type or member visible to any code in the same compiled assembly, regardless of namespace, but invisible to code in other assemblies."
  - type: multiple_choice
    difficulty: 3
    text: "What is the correct distinction between an assembly and a namespace in C#?"
    options:
      - "An assembly is the compiled unit (.dll/.exe) and the real boundary for 'internal'; a namespace is just a logical grouping of names"
      - "They are effectively synonyms"
      - "A namespace is the compiled unit, and an assembly is only a logical grouping"
      - "'internal' is scoped to the namespace, not the assembly"
    answer: 0
    explanation: "An assembly is the physical compiled output (.dll or .exe) and defines the true visibility boundary for 'internal'; a namespace is purely a naming/organizational construct that can span multiple assemblies or coexist with other namespaces in one assembly."
  - type: multiple_choice
    difficulty: 3
    text: "What does 'protected internal' mean?"
    options:
      - "Accessible from the same assembly, OR from a subclass in any assembly"
      - "Accessible only from subclasses in the same assembly"
      - "Accessible only within the declaring class"
      - "Accessible from nowhere outside the declaring assembly, even for subclasses"
    answer: 0
    explanation: "'protected internal' is a union of the two modifiers: any code in the same assembly can access the member, and so can any subclass regardless of which assembly it's in — it's less restrictive than either modifier alone."
  - type: multiple_choice
    difficulty: 3
    text: "What does 'private protected' mean?"
    options:
      - "Accessible only from a subclass, and only if that subclass is in the same assembly"
      - "Accessible from any code in the same assembly"
      - "Accessible from any subclass in any assembly"
      - "Identical in meaning to 'private'"
    answer: 0
    explanation: "'private protected' is an intersection, not a union: access requires being both a subclass and in the same assembly as the declaring type, making it more restrictive than 'protected internal'."
  - type: multiple_choice
    difficulty: 2
    text: "What does 'sealed' do when applied to a class?"
    options:
      - "It prevents the class from being inherited"
      - "It prevents the class from being instantiated"
      - "It makes all of the class's members static"
      - "It makes the class abstract"
    answer: 0
    explanation: "'sealed' stops any other class from deriving from it; it says nothing about instantiation, static members, or abstractness (in fact 'abstract' and 'sealed' are mutually exclusive on a class)."
  - type: multiple_choice
    difficulty: 3
    text: "What does 'sealed override' do on a method?"
    options:
      - "It blocks any further override of that method in derived classes"
      - "It makes the method private"
      - "It turns the method into a static method"
      - "It makes the method abstract"
    answer: 0
    explanation: "A method marked 'sealed override' still overrides its base implementation but prevents any class further down the hierarchy from overriding it again, locking in that implementation."
  - type: multiple_choice
    difficulty: 2
    text: "In which scenario is the 'partial' keyword most commonly used?"
    options:
      - "Splitting a class between designer-generated code and hand-written code"
      - "Making a class thread-safe"
      - "Preventing a class from being inherited"
      - "Declaring a class as immutable"
    answer: 0
    explanation: "'partial' lets a single type's definition span multiple files, most commonly used to keep designer/tool-generated code separate from the developer's hand-written code in the same class (e.g. WinForms, EF Core scaffolded entities)."
  - type: multiple_choice
    difficulty: 3
    text: "What must be true for two partial declarations to be merged by the compiler into one type?"
    options:
      - "Same assembly, same namespace, same type name, and both parts marked 'partial'"
      - "They only need to share the same file name"
      - "They only need to share the same access modifier"
      - "Partial types cannot span more than one file, so this never applies"
    answer: 0
    explanation: "The compiler merges partial declarations only when they're compiled into the same assembly, share the same namespace and type name, and each declaration is explicitly marked with the 'partial' keyword."
  - type: multiple_choice
    difficulty: 2
    text: "What is 'Primitive Obsession'?"
    options:
      - "Using primitive types like int or string to represent richer domain concepts, losing type safety"
      - "Using too many private fields inside a class"
      - "Overusing generic type parameters"
      - "Avoiding the use of interfaces altogether"
    answer: 0
    explanation: "Primitive Obsession is a code smell where domain concepts (like an email address or an order ID) are represented as bare primitives (string, int) instead of dedicated types, losing validation and making it easy to mix up unrelated values of the same primitive type."
  - type: multiple_choice
    difficulty: 3
    text: "In Domain-Driven Design, what distinguishes a Value Object from an Entity?"
    options:
      - "A Value Object is defined by its values and has no identity of its own, and is typically immutable"
