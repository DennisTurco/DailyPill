    text: "Write a custom C# exception class called InvalidAgeException that inherits from Exception, includes a public int Age property set via its constructor, and passes a descriptive message to the base Exception constructor."
    answer: |
      ```csharp
      public class InvalidAgeException : Exception
      {
          public int Age { get; }

          public InvalidAgeException(int age)
              : base($"Invalid age: {age}")
          {
              Age = age;
          }
      }
      ```
    explanation: "Calling 'base(message)' forwards a human-readable description up to Exception so str(exception)/.Message still works as expected everywhere exceptions are logged, while the extra Age property lets calling code catch InvalidAgeException specifically and inspect exactly which value was rejected."
