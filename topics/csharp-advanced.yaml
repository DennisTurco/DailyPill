      - "out"
      - "in"
    answer: 0
    explanation: "'params' lets callers pass any number of arguments (including zero) that get collected into an array parameter; ref/out/in modify how a single parameter is passed, not its count."
  - type: multiple_choice
    difficulty: 2
    text: "What does the 'using' statement (not the directive) do?"
    options:
      - "Automatically disposes an IDisposable object"
      - "Imports a namespace"
      - "Declares a type alias"
      - "Enables nullable reference types"
    answer: 0
