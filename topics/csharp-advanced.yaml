      - "Converting a reference type to a value type"
      - "Wrapping a delegate in an event"
      - "Compiling a generic method"
    answer: 0
    explanation: "Boxing wraps a value type (like an int) in an object on the heap so it can be treated as a reference type; the reverse operation, unboxing, extracts the value type back out."
  - type: multiple_choice
    difficulty: 3
    text: "Which keyword lets a method accept a variable number of arguments?"
    options:
      - "params"
