      ```csharp
      public readonly struct Money : IEquatable<Money>
      {
          public decimal Amount { get; }
          public string Currency { get; }

          public Money(decimal amount, string currency)
          {
              Amount = amount;
              Currency = currency;
          }

          public bool Equals(Money other) =>
              Amount == other.Amount && Currency == other.Currency;

          public override bool Equals(object? obj) =>
              obj is Money other && Equals(other);

          public override int GetHashCode() => HashCode.Combine(Amount, Currency);
      }
      ```
    explanation: "readonly struct communicates that Money instances never mutate after construction; implementing IEquatable<Money> gives a strongly-typed Equals that avoids boxing in generic collections, and overriding GetHashCode consistently with Equals (using both fields) keeps the type well-behaved in dictionaries and hash sets."
  - type: open_answer
    difficulty: 4
    text: "Explain the main tradeoff between EF Core's TPH (Table-Per-Hierarchy) and TPT (Table-Per-Type) inheritance mapping strategies."
    answer: "TPH stores the whole class hierarchy in a single table with a discriminator column, which avoids joins and is usually faster to query, but leaves many columns nullable since not every subtype uses every property. TPT stores each type in its own table linked by a shared primary key, giving a more normalized schema with no unused nullable columns, but requires joins across tables to reconstruct a full entity, which is more expensive as the hierarchy grows."
    explanation: "The choice is a classic normalization-versus-query-cost tradeoff: TPH sacrifices schema cleanliness (nullable columns for subtype-specific data) for fewer joins and generally better read performance, while TPT keeps a cleaner relational schema at the cost of join overhead that increases with the number of types involved in a query."
