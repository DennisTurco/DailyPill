manual_questions:
  - type: multiple_choice
    difficulty: 2
    text: "Which keyword declares an asynchronous method in C#?"
    options:
      - "async"
      - "await"
      - "task"
      - "thread"
    answer: 0
    explanation: "The `async` modifier marks a method as asynchronous, enabling the use of `await` inside it; `await` itself is used to suspend on an awaitable, not to declare the method."
  - type: multiple_choice
    difficulty: 2
    text: "Which LINQ method throws an exception if no matching element is found?"
    options:
      - "FirstOrDefault"
      - "First"
      - "Any"
      - "Count"
    answer: 1
    explanation: "First() throws InvalidOperationException when the sequence is empty or no element matches; FirstOrDefault() instead returns the type's default value, and Any/Count don't throw for an empty result."
  - type: multiple_choice
