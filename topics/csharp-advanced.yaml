    text: "Write a C# record called Point3D with three properties X, Y and Z of type double, then write a line of code that creates a modified copy of an existing Point3D called p with Z set to 0, using a 'with' expression."
    answer: |
      ```csharp
      public record Point3D(double X, double Y, double Z);

      var flattened = p with { Z = 0 };
      ```
    explanation: "The positional record syntax generates X, Y and Z as init-only properties plus value-based equality automatically; 'p with { Z = 0 }' copies every property from p except Z, which is overridden, producing a brand-new, independent Point3D instance without mutating p."
