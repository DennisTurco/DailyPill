  - type: open_answer
    difficulty: 3
    text: "Write an async C# method called ProcessAllAsync that takes a List<string> urls and an HttpClient, and downloads all of them concurrently but limits concurrency to at most 3 simultaneous requests using a SemaphoreSlim, awaiting all downloads to complete."
    answer: |
      ```csharp
      public async Task ProcessAllAsync(List<string> urls, HttpClient httpClient)
      {
          using var throttle = new SemaphoreSlim(3);

          var tasks = urls.Select(async url =>
          {
              await throttle.WaitAsync();
              try
              {
                  await httpClient.GetStringAsync(url);
              }
              finally
              {
                  throttle.Release();
              }
          });

          await Task.WhenAll(tasks);
      }
      ```
    explanation: "Each download first awaits the semaphore, which only allows 3 callers past WaitAsync() at once; the finally block guarantees Release() runs even if the download throws, and Task.WhenAll composes all the individual per-URL tasks into one awaitable that completes once every download (or throttle wait) has finished."
