    text: "Write a C# class Person implementing IComparable<Person> so that people are ordered by their int Age property in ascending order."
    answer: |
      ```csharp
      public class Person : IComparable<Person>
      {
          public string Name { get; set; } = string.Empty;
          public int Age { get; set; }

          public int CompareTo(Person? other)
          {
              if (other is null) return 1;
              return Age.CompareTo(other.Age);
          }
      }
      ```
    explanation: "CompareTo must return negative/zero/positive to mean 'this comes before/equal to/after other'; delegating to int's own CompareTo on the Age fields gets that convention for free, and treating a null 'other' as 'this sorts after it' matches the usual convention that any instance is considered greater than null."
