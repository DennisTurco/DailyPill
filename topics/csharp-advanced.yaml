    text: "Write a line of C# using a 'using declaration' (not a using block) that opens a StreamReader for \"data.txt\" and reads its entire content into a string, relying on the enclosing scope to dispose the reader automatically when it ends."
    answer: |
      ```csharp
      using var reader = new StreamReader("data.txt");
      string content = reader.ReadToEnd();
      ```
    explanation: "A 'using declaration' (no braces) introduced in C# 8 disposes the variable automatically at the end of the enclosing block (e.g. the containing method), rather than requiring an explicit 'using (...) { }' block scoped tightly around just the read — useful when the resource needs to stay alive for the rest of the method."
