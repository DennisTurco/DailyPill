    text: "Write a thread-safe C# Singleton class called Logger using the Lazy<T> pattern, exposing a static Instance property that returns the single shared instance."
    answer: |
      ```csharp
      public sealed class Logger
      {
          private static readonly Lazy<Logger> _instance = new(() => new Logger());

          public static Logger Instance => _instance.Value;

          private Logger() { }
      }
      ```
    explanation: "Lazy<T> defers construction until Instance is first accessed and, by default, guarantees only one thread ever actually runs the factory delegate even under concurrent first-access, making this pattern thread-safe without any explicit locking code; the private constructor prevents anyone from bypassing Instance to create additional Logger objects."
