      - "An iterator"
      - "A thread"
      - "A delegate"
      - "A generic constraint"
    answer: 0
    explanation: "'yield return' turns a method into a state-machine-based iterator that produces values lazily on each MoveNext() call, rather than building the entire collection up front."
  - type: multiple_choice
    difficulty: 2
    text: "Which interface must a class implement to support the foreach loop?"
