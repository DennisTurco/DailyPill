  - type: open_answer
    difficulty: 3
    text: "Explain the Null Object pattern and how it can simplify code that would otherwise need to check for null before calling a method on an object."
    answer: "The Null Object pattern provides a concrete implementation of an interface that does nothing meaningful (or returns a safe default), used in place of an actual null reference. Instead of code needing to check 'if (logger != null) logger.Log(message);' everywhere a logger might not be configured, you assign a NullLogger (whose Log() method simply does nothing) as the default, and calling code can unconditionally call logger.Log(message) without ever needing a null check, since there's always a valid (even if inert) object to call it on."
    explanation: "This removes a whole category of defensive null-checking scattered throughout a codebase, at the cost of needing to write and maintain one extra no-op implementation per interface that benefits from it — worthwhile mainly when the 'do nothing' case is genuinely common and the null checks it replaces are numerous."
  - type: open_answer
    difficulty: 3
    text: "Explain how a dependency injection (DI) container relates to the Abstract Factory pattern conceptually, even though most developers don't write explicit factory classes when using one."
    answer: "A DI container is essentially a generalized, configuration-driven factory: instead of writing a specific factory class per product family (as in classic Abstract Factory), you register mappings from abstractions to concrete implementations (e.g. 'whenever ILogger is requested, construct a FileLogger'), and the container looks up the right concrete type and constructs it (recursively resolving its own dependencies too) whenever something asks for that abstraction. The core idea — the calling code depends only on an interface and never directly instantiates a concrete class — is exactly what Abstract Factory (and Factory Method) achieve manually, just automated and centralized in the container's configuration instead of scattered across hand-written factory classes."
    explanation: "This is why many DI-heavy codebases have very few explicit uses of the classic Factory patterns written by hand — the container has effectively absorbed and automated that responsibility."
  - type: open_answer
    difficulty: 3
    text: "Explain the difference between UML 'composition' and 'aggregation' relationships, and give an example of each in the context of a Composite pattern implementation (e.g. a file system of folders and files)."
    answer: "Composition implies the contained object's lifetime is tied to its container — if the container is destroyed, so are its contained parts, and the parts typically aren't shared with other containers. Aggregation implies a weaker relationship where the contained object can exist independently of, or be shared across, multiple containers. In a file system Composite: a Folder's contained Files/Folders are usually composition — deleting the folder deletes everything inside it, and a given File instance conceptually belongs to exactly one Folder. A counter-example of aggregation in a related context: a Playlist 'has' Songs, but deleting the Playlist shouldn't delete the underlying Song files, which can belong to multiple playlists simultaneously."
    explanation: "The distinction matters for lifecycle management: composition relationships are usually where cascading deletes/cleanup logic belongs, while aggregation relationships require the container to reference, not own, the shared objects."
  - type: open_answer
    difficulty: 4
    text: "Explain why the Interpreter pattern is rarely used directly for genuinely complex languages, and what alternative approach is typically favored instead."
    answer: "Interpreter models each grammar rule as a class in an object hierarchy, with a tree of these objects representing a parsed sentence and each node knowing how to interpret/evaluate itself. This works reasonably well for very small, simple grammars, but for anything approaching the complexity of a real programming language, the number of grammar rule classes and the complexity of correctly parsing input into that object tree becomes unwieldy and hard to maintain. For genuinely complex languages, a dedicated parser generator/parsing library (producing an abstract syntax tree via more specialized, higher-performance techniques) combined with a separate evaluator or compiler is typically favored instead, rather than hand-rolling one class per grammar rule using the classic Interpreter pattern."
    explanation: "Interpreter still shows up in scoped-down contexts — simple expression evaluators, rule engines, small configuration or query languages — where the grammar is genuinely small and stable enough that the one-class-per-rule approach stays manageable."
  - type: open_answer
    difficulty: 2
    text: "Explain, with an example, how the Composite pattern lets client code treat a single object and a collection of objects uniformly, and why that's useful."
    answer: "Consider a file system: both an individual File and a Folder (which can contain Files and other Folders) implement the same interface, e.g. GetSize(). Calling GetSize() on a File simply returns its own size; calling GetSize() on a Folder sums the GetSize() of everything it contains (including nested folders, recursively). Client code that wants to know 'how big is this thing' can call GetSize() the exact same way whether 'this thing' is a single file or an entire deeply nested folder structure, without needing an if/else to check which case it's dealing with."
    explanation: "This uniform treatment is what makes recursive operations over tree structures (size calculation, rendering a UI, computing a total price of nested product bundles, etc.) simple to write once, correctly, regardless of how deep or shallow the actual structure happens to be at runtime."
  - type: open_answer
    difficulty: 3
    text: "Explain a scenario where you would choose a protection proxy over simply adding a permission check directly inside the real object's method."
    answer: "A protection proxy is useful when you want to add or change permission logic without touching the real object's class at all — for example, if the real object is in a third-party library you can't modify, or if different callers/contexts need different permission rules applied to the same underlying object, or if you want to keep the real object's code focused purely on its core responsibility rather than mixing in access-control concerns. The proxy implements the same interface, checks permissions first, and only forwards the call to the real object if authorized, keeping the permission logic entirely separate from and layered on top of the real object's own logic."
    explanation: "This is a specific case of the general benefit of Proxy: adding a cross-cutting concern (here, authorization) around an existing object's interface without modifying that object's own implementation, which is especially valuable when the real object's source isn't under your control."
  - type: open_answer
    difficulty: 3
    text: "Compare the Command and Strategy patterns: both wrap behavior behind a common interface, so what is the key difference in what they're typically used for?"
    answer: "Strategy is about interchangeable ways to accomplish the same conceptual task (e.g. different sorting algorithms, all satisfying 'sort this list') — the strategies are typically stateless with respect to any single invocation and don't need to remember anything about a specific call after it returns. Command is about representing a specific request or action as an object, often carrying enough state to describe exactly what should happen (and sometimes how to undo it), and is meant to be storable, queueable, loggable, or reversible as a first-class thing in its own right, rather than just being 'the algorithm currently in use'."
    explanation: "Structurally they can look similar (an interface with one main method, implemented by multiple classes), but the intent differs: Strategy answers 'which algorithm should I use for this kind of task', while Command answers 'what specific action needs to happen, and can I treat that action itself as data'."
  - type: open_answer
    difficulty: 2
    text: "Explain what a fluent interface is and how the Builder pattern commonly uses it to make object construction more readable."
    answer: "A fluent interface is an API design where methods return the object itself (commonly 'return this;'), allowing multiple method calls to be chained together into a single expression. In a Builder, each configuration method (e.g. WithName, WithAge) returns the builder instance, so a caller can write 'new PersonBuilder().WithName(\"Anna\").WithAge(30).Build()' as one continuous, readable chain describing exactly what's being configured, rather than a series of separate statements each reassigning or mutating a variable."
    explanation: "Beyond readability, this style also makes the order of configuration steps explicit and self-documenting in the code itself, and lets a Builder's Build() method sit naturally as the final call in the chain, clearly marking the point where the fully-configured object is actually produced."
  - type: open_answer
    difficulty: 4
    text: "Explain the 'safety versus transparency' tradeoff in the Composite pattern, and describe a concrete consequence of choosing full transparency (putting Add/Remove on the shared component interface)."
    answer: "Transparency means every node (leaf or composite) shares the exact same interface, including child-management operations like Add() and Remove(), so client code never needs to distinguish between them. Safety means only composite nodes expose Add()/Remove(), while leaves don't have those operations at all, meaning the type system itself prevents calling Add() on a leaf. Choosing full transparency has a concrete consequence: since a Leaf class must still implement Add()/Remove() to satisfy the shared interface, it either has to throw an exception (or silently do nothing) when called, turning what could have been a compile-time impossibility (calling Add() on something that structurally can't have children) into a runtime error instead."
    explanation: "Neither choice is strictly 'correct' — it's a genuine tradeoff between uniform, simpler client code (transparency) and stronger compile-time guarantees against misuse (safety), and different Composite implementations in practice lean different ways depending on which property matters more for that specific use case."
  - type: open_answer
    difficulty: 3
    text: "Explain why 'programming to an interface, not an implementation' is considered foundational to most of the GoF patterns, using Strategy as a concrete example."
    answer: "If the context class in a Strategy setup depended directly on a specific concrete strategy class (e.g. QuickSortStrategy) rather than a shared interface (ISortStrategy), it would be impossible to swap in a different concrete strategy (e.g. MergeSortStrategy) without changing the context's own code to reference the new concrete type. By depending only on the interface, the context class works correctly with any current or future implementation of that interface, and swapping strategies becomes a matter of passing in a different object, not modifying the context's source code at all."
    explanation: "This same principle — depending on abstractions rather than concrete types — underlies nearly every GoF pattern that supports substitutability or extension (Strategy, Observer, State, Template Method's hooks, Factory Method's products), which is why it's often cited as the single most important piece of advice behind the whole catalog."
  - type: completion
