name: Design Patterns (GoF)
category: Computer Science
difficulty: medium
ai_generate: true
content: |
  The classic Gang of Four design patterns: creational patterns (Singleton,
  Factory Method, Abstract Factory, Builder, Prototype), structural patterns
  (Adapter, Bridge, Composite, Decorator, Facade, Flyweight, Proxy), and
  behavioral patterns (Strategy, Observer, Command, Template Method, State,
  Iterator, Chain of Responsibility, Mediator, Memento, Visitor), plus the
  design principles behind when and why to use them.
manual_questions:
  - type: multiple_choice
    difficulty: 1
    text: "What is the primary intent of the Singleton pattern?"
    options:
      - "Ensure a class has only one instance and provide a single global point of access to it"
      - "Allow a class to have multiple incompatible interfaces"
      - "Create families of related objects without specifying their concrete classes"
      - "Attach additional responsibilities to an object dynamically"
    answer: 0
    explanation: "Singleton restricts instantiation of a class to exactly one object, typically via a private constructor plus a static accessor method/property that creates the instance on first access and returns the same one thereafter."
  - type: multiple_choice
    difficulty: 2
    text: "What is a commonly cited downside of overusing the Singleton pattern?"
    options:
      - "It introduces global state, making code harder to test in isolation and creating hidden dependencies between unrelated parts of a program"
      - "It requires every class in the program to implement the same interface"
      - "It prevents a program from ever having more than one thread"
      - "It makes object creation slower than any other creational pattern"
    answer: 0
    explanation: "Because a singleton is globally accessible and shared, code that depends on it implicitly (rather than through an injected dependency) becomes hard to unit test — you can't easily substitute a fake/mock instance — and singletons can hide coupling between components that appear unrelated on the surface."
  - type: multiple_choice
    difficulty: 2
    text: "What is the intent of the Factory Method pattern?"
    options:
      - "Define an interface for creating an object, but let subclasses decide which concrete class to instantiate"
      - "Ensure only one instance of a class ever exists"
      - "Provide a simplified interface to a complex subsystem"
      - "Allow incompatible interfaces to work together"
    answer: 0
    explanation: "Factory Method defines a creation method in a base class (often abstract or virtual), letting each subclass override it to decide which concrete product class gets instantiated, without the calling code needing to know the concrete type."
  - type: multiple_choice
    difficulty: 3
    text: "What is the key difference between Factory Method and Abstract Factory?"
    options:
      - "Factory Method creates one kind of product via subclassing a creator; Abstract Factory creates families of related products through a single interface, typically via composition"
      - "Abstract Factory can only be used with Singletons"
      - "Factory Method is a structural pattern, Abstract Factory is a creational pattern"
      - "There is no meaningful difference; they are the same pattern with two names"
    answer: 0
    explanation: "Factory Method is about overriding a single creation method in a subclass; Abstract Factory provides an interface with multiple creation methods for a whole family of related objects (e.g. a UI toolkit factory that creates matching buttons, checkboxes, and windows for one platform), usually composed of several Factory Methods internally."
  - type: multiple_choice
    difficulty: 2
    text: "What problem does the Builder pattern solve?"
    options:
      - "Constructing a complex object step by step, separating the construction process from its final representation"
      - "Guaranteeing a class only ever has one instance"
      - "Converting one interface into another that clients expect"
      - "Reducing memory usage by sharing common object state"
    answer: 0
    explanation: "Builder is useful when an object has many optional parts or configuration steps (avoiding a constructor with a dozen parameters); a builder object accumulates configuration via chained method calls and produces the final object only when explicitly asked to 'build' it."
  - type: multiple_choice
    difficulty: 3
    text: "What is the intent of the Prototype pattern?"
    options:
      - "Create new objects by copying an existing object (a 'prototype') rather than instantiating a class directly"
      - "Provide a way to access elements of a collection sequentially"
      - "Restore an object to a previous state"
      - "Decouple an abstraction from its implementation so the two can vary independently"
    answer: 0
    explanation: "Prototype lets you clone an existing, fully configured object instead of creating a new one from scratch and re-configuring it, which is useful when object creation is expensive or when you want a copy that starts identical to an existing instance."
  - type: multiple_choice
    difficulty: 2
    text: "What is the primary intent of the Adapter pattern?"
    options:
      - "Convert the interface of a class into another interface that clients expect, letting otherwise-incompatible classes work together"
      - "Ensure a class has only one instance"
      - "Add new behavior to an object dynamically without subclassing"
      - "Provide a surrogate for another object to control access to it"
    answer: 0
    explanation: "Adapter wraps an existing class with an interface incompatible with what a client needs, translating calls between the two — a classic real-world analogy is a power plug adapter that lets a device with one plug shape work with a socket of a different shape."
  - type: multiple_choice
    difficulty: 3
    text: "What is the key difference between the Adapter and Facade patterns?"
    options:
      - "Adapter makes one existing interface compatible with what a client expects; Facade provides a new, simplified interface over a complex subsystem, without necessarily matching any specific existing interface"
      - "Facade is used only for legacy code, Adapter is used only for new code"
      - "Adapter always wraps exactly one class, while Facade can never wrap more than one class"
      - "They are two names for the same pattern"
    answer: 0
    explanation: "Adapter is about interface translation/compatibility for a specific mismatch; Facade is about simplification, hiding the complexity of an entire subsystem (potentially many classes) behind one easy-to-use entry point, regardless of whether any single existing interface needs to be matched."
  - type: multiple_choice
    difficulty: 3
    text: "What is the intent of the Bridge pattern?"
    options:
      - "Decouple an abstraction from its implementation so the two can vary and evolve independently"
      - "Give a collection object a way to expose its elements without exposing its internal structure"
      - "Attach additional responsibilities to an object dynamically as an alternative to subclassing"
      - "Compose objects into tree structures to represent part-whole hierarchies"
    answer: 0
    explanation: "Bridge splits a class hierarchy in two: an abstraction hierarchy and a separate implementation hierarchy, connected by composition rather than inheritance, so new abstractions and new implementations can each be added independently without a combinatorial explosion of subclasses."
  - type: multiple_choice
    difficulty: 2
    text: "What is the primary intent of the Composite pattern?"
    options:
      - "Compose objects into tree structures to represent part-whole hierarchies, letting clients treat individual objects and compositions of objects uniformly"
      - "Provide a simplified interface to a complex subsystem"
      - "Add responsibilities to objects dynamically"
      - "Encapsulate a request as an object"
    answer: 0
    explanation: "Composite is the classic pattern behind things like a file system (files and folders) or a UI widget tree: both a single 'leaf' object and a 'composite' of many objects implement the same interface, so client code can call the same operations on either without needing to distinguish them."
  - type: multiple_choice
    difficulty: 2
    text: "What is the intent of the Decorator pattern?"
    options:
      - "Attach additional responsibilities to an object dynamically, providing a flexible alternative to subclassing for extending behavior"
      - "Ensure a class has only one instance"
      - "Provide a placeholder for another object to control access to it"
      - "Convert one class's interface into another expected by clients"
    answer: 0
    explanation: "Decorators wrap an object with the same interface, adding behavior before/after delegating to the wrapped object; multiple decorators can be stacked, letting you mix and match extensions at runtime instead of needing a subclass for every combination of features."
  - type: multiple_choice
    difficulty: 3
    text: "How does the Decorator pattern typically achieve extending behavior without subclassing?"
    options:
      - "By wrapping an object in another object that implements the same interface and delegates to the wrapped object, adding behavior around the delegated call"
      - "By modifying the original class's source code directly at compile time"
      - "By duplicating the entire class and manually copying over all its fields"
      - "By using reflection to inject new methods into an existing compiled class"
    answer: 0
    explanation: "Because the decorator implements the same interface as the object it wraps, it's interchangeable with the original from the client's perspective, while internally forwarding calls to the wrapped instance and layering extra behavior around that call — this composability is what lets decorators be freely combined."
  - type: multiple_choice
    difficulty: 2
    text: "What is the primary intent of the Facade pattern?"
    options:
      - "Provide a single, simplified interface to a larger, more complex subsystem of classes"
      - "Allow an object to alter its behavior when its internal state changes"
      - "Ensure a class has only one instance"
      - "Define a family of interchangeable algorithms"
    answer: 0
    explanation: "A Facade sits in front of a complex subsystem (many classes with many interdependencies) and exposes a small, easy-to-use set of methods for the most common use cases, hiding the subsystem's internal complexity from client code that doesn't need to know about it."
  - type: multiple_choice
    difficulty: 4
    text: "What problem does the Flyweight pattern solve?"
    options:
      - "Reduce memory usage by sharing as much data as possible between many similar objects, instead of duplicating it in each one"
      - "Convert an interface into one a client expects"
      - "Provide a surrogate to control access to another object"
      - "Compose a request into an object so it can be queued, logged, or undone"
    answer: 0
    explanation: "Flyweight separates an object's state into 'intrinsic' (shared, immutable, common across many instances — e.g. a character glyph's shape in a text editor) and 'extrinsic' (unique per instance, passed in from outside — e.g. its position on screen), letting thousands of logical objects share a much smaller number of actual shared instances."
  - type: multiple_choice
    difficulty: 2
    text: "What is the primary intent of the Proxy pattern?"
    options:
      - "Provide a surrogate or placeholder for another object to control access to it"
      - "Compose objects into tree structures"
      - "Define a one-to-many dependency so that when one object changes, dependents are notified automatically"
      - "Encapsulate how a set of objects interact, promoting loose coupling"
    answer: 0
    explanation: "A Proxy implements the same interface as a 'real' object it stands in for, letting it control or augment access — common uses include lazy-loading an expensive object only when first actually used, access control/permissions checks, caching, or adding logging around remote calls."
  - type: multiple_choice
    difficulty: 3
    text: "What is a 'virtual proxy', specifically?"
    options:
      - "A proxy that defers creation of an expensive object until it is actually needed"
      - "A proxy that only exists in a unit test, never in production"
      - "A proxy that always throws an exception when accessed"
      - "A proxy used exclusively for network communication"
    answer: 0
    explanation: "A virtual proxy stands in for an object that's expensive to create (e.g. a large image loaded from disk), only instantiating the real object the first time it's actually needed, which can meaningfully improve startup time or memory usage when many such objects are never actually used."
  - type: multiple_choice
    difficulty: 1
    text: "What is the primary intent of the Strategy pattern?"
    options:
      - "Define a family of interchangeable algorithms, encapsulate each one, and let them be swapped independently of the client that uses them"
      - "Ensure a class has only one instance"
      - "Compose a request into an object so it can be parameterized and queued"
      - "Provide a way to access the elements of a collection sequentially"
    answer: 0
    explanation: "Strategy extracts an algorithm (e.g. a sorting or pricing calculation) behind a common interface, letting the object using it (the 'context') swap which concrete strategy it delegates to at runtime, without changing the context's own code."
  - type: multiple_choice
    difficulty: 2
    text: "What is the key difference between the Strategy and State patterns, given both let an object's behavior change at runtime?"
    options:
      - "Strategy lets the client explicitly choose which algorithm/behavior to use; State lets an object's internal state transitions change its own behavior automatically, often without external code choosing anything"
      - "State is a creational pattern while Strategy is structural"
      - "Strategy can only be used with a single implementation, State supports many"
      - "They are functionally and structurally identical patterns"
    answer: 0
    explanation: "Structurally, Strategy and State often look nearly identical (an interface with interchangeable implementations held by a context object) — the distinction is in intent: with Strategy, the client typically picks and injects the algorithm; with State, the context object itself manages switching between state objects as its internal condition changes (e.g. a document moving from Draft to Review to Published), often with each state object aware of which state comes next."
  - type: multiple_choice
    difficulty: 1
    text: "What is the primary intent of the Observer pattern?"
    options:
      - "Define a one-to-many dependency so that when one object's state changes, all its dependents are notified and updated automatically"
      - "Ensure a class has only one instance"
      - "Convert an interface into one a client expects"
      - "Compose objects into tree structures to represent part-whole hierarchies"
    answer: 0
    explanation: "An Observer (subject/publisher) maintains a list of dependents (observers/subscribers) and notifies them all automatically whenever its own state changes, without needing to know any concrete details about the observers — this is the foundation of most event/callback systems and reactive UI frameworks."
  - type: multiple_choice
    difficulty: 3
    text: "What is a common risk when using the Observer pattern extensively throughout a large system?"
    options:
      - "It can become difficult to trace the flow of control, since a single state change can trigger a cascading, hard-to-follow chain of notifications across many observers"
      - "It guarantees a memory leak in every implementation, with no way to avoid it"
      - "It only works correctly in single-threaded programs"
      - "It requires every observer to be a Singleton"
    answer: 0
    explanation: "Because a subject doesn't need to know what its observers do in response to a notification, and observers can themselves trigger further changes that notify yet more observers, systems with heavy Observer usage can become hard to reason about and debug, even though each individual publish/subscribe relationship is simple."
  - type: multiple_choice
    difficulty: 3
    text: "What is the primary intent of the Command pattern?"
    options:
      - "Encapsulate a request (and everything needed to execute it) as a standalone object, allowing it to be parameterized, queued, logged, or undone"
      - "Provide a simplified interface to a complex subsystem"
      - "Allow an object to alter its behavior when its internal state changes"
      - "Define a family of interchangeable algorithms"
    answer: 0
    explanation: "By wrapping a request (an action, its receiver, and its parameters) as a full object rather than a direct method call, Command enables features that a plain method call can't easily support on its own, like queuing commands, logging them for auditing, or storing them to support an undo/redo stack."
  - type: multiple_choice
    difficulty: 2
    text: "Which pattern is most naturally used to implement an undo/redo feature?"
    options:
      - "Command"
      - "Singleton"
      - "Adapter"
      - "Facade"
    answer: 0
    explanation: "Since each Command object encapsulates a full request (and can also record what's needed to reverse it), an application can keep a history stack of executed commands and call each one's 'undo' operation in reverse order to implement undo/redo."
  - type: multiple_choice
    difficulty: 2
    text: "What is the primary intent of the Template Method pattern?"
    options:
      - "Define the skeleton of an algorithm in a base class, deferring specific steps to subclasses without letting them change the algorithm's overall structure"
      - "Encapsulate a request as an object"
      - "Provide an interface for creating families of related objects"
      - "Reduce memory usage by sharing state between similar objects"
    answer: 0
    explanation: "Template Method puts the invariant parts of an algorithm in a (often non-overridable) base class method, calling out to abstract/virtual 'hook' methods that subclasses implement for the parts that vary — the overall sequence of steps is fixed, but individual steps can be customized."
  - type: multiple_choice
    difficulty: 3
    text: "How does the Template Method pattern differ from the Strategy pattern in how variation is achieved?"
    options:
      - "Template Method uses inheritance (subclasses override specific steps of a fixed algorithm); Strategy uses composition (a whole interchangeable algorithm object is plugged in)"
      - "Strategy uses inheritance, Template Method uses composition"
      - "Both patterns are only usable with static/class methods, never instance methods"
      - "There is no meaningful difference between the two"
    answer: 0
    explanation: "Template Method customizes behavior at the level of individual steps within a fixed algorithm shape, via subclassing; Strategy instead swaps out an entire algorithm as a single interchangeable object via composition — a common piece of design advice ('favor composition over inheritance') often favors Strategy when the same flexibility is achievable either way."
  - type: multiple_choice
    difficulty: 2
    text: "What is the primary intent of the Iterator pattern?"
    options:
      - "Provide a way to access the elements of a collection sequentially, without exposing its underlying representation"
      - "Ensure a class has only one instance"
      - "Attach additional responsibilities to an object dynamically"
      - "Define a one-to-many dependency between objects"
    answer: 0
    explanation: "An Iterator exposes a uniform way (e.g. 'has next / get next') to walk through a collection's elements one at a time, letting client code iterate without needing to know whether the underlying structure is an array, linked list, tree, or something else entirely."
  - type: multiple_choice
    difficulty: 3
    text: "What is the primary intent of the Chain of Responsibility pattern?"
    options:
      - "Pass a request along a chain of potential handlers until one of them handles it, decoupling the sender from knowing which handler will ultimately process it"
      - "Ensure a class has only one instance"
      - "Compose objects into tree structures to represent part-whole hierarchies"
      - "Provide a simplified interface to a complex subsystem"
    answer: 0
    explanation: "Each handler in the chain either processes the request itself or passes it to the next handler, without the original sender needing to know the chain's structure or which specific handler will end up dealing with it — a common real-world example is middleware pipelines in web frameworks, where each middleware can handle a request or pass it further along."
  - type: multiple_choice
    difficulty: 3
    text: "What is the primary intent of the Mediator pattern?"
    options:
      - "Encapsulate how a set of objects interact, promoting loose coupling by preventing them from referring to each other directly"
      - "Provide a placeholder for another object to control access to it"
      - "Attach responsibilities to an object dynamically"
      - "Define a family of interchangeable algorithms"
    answer: 0
    explanation: "Instead of many objects holding direct references to each other (an every-object-knows-every-other-object mess), each object communicates only with a central mediator, which coordinates the interactions — reducing the number of direct dependencies between the participating objects."
  - type: multiple_choice
    difficulty: 4
    text: "What is the primary intent of the Memento pattern?"
    options:
      - "Capture and externalize an object's internal state so it can be restored to that state later, without violating encapsulation"
      - "Convert one interface into another that clients expect"
      - "Compose a request into an object"
      - "Define a one-to-many notification dependency"
    answer: 0
    explanation: "Memento lets an object (the 'originator') save a snapshot of its own internal state into a separate memento object, which is stored by a caretaker without inspecting or modifying its contents; later, the originator can restore itself from that memento — the classic building block behind undo functionality that involves restoring full state rather than reversing individual commands."
  - type: multiple_choice
    difficulty: 4
    text: "What is the primary intent of the Visitor pattern?"
    options:
      - "Represent an operation to be performed on the elements of an object structure, letting you define a new operation without changing the classes of the elements it operates on"
      - "Ensure a class has only one instance"
      - "Provide a simplified interface to a complex subsystem"
      - "Reduce memory usage by sharing state across similar objects"
    answer: 0
    explanation: "Visitor separates an algorithm from the object structure it operates on: each element accepts a visitor object and calls back into it (double dispatch), letting you add entirely new operations over a fixed set of element types without modifying those element classes at all — at the cost of making it harder to add brand-new element types later."
  - type: multiple_choice
    difficulty: 3
    text: "What design principle is most directly embodied by the Strategy, Observer, and Template Method patterns' emphasis on interfaces?"
    options:
      - "\"Program to an interface, not an implementation\" — depend on abstract contracts rather than concrete classes"
      - "\"Premature optimization is the root of all evil\""
      - "\"Don't repeat yourself\" (DRY)"
      - "\"You aren't gonna need it\" (YAGNI)"
    answer: 0
    explanation: "All three patterns work by having client code depend on an interface/abstract type (a Strategy, an Observer, a template method's abstract hooks) rather than on a specific concrete class, which is precisely the classic GoF advice to program to an interface — it's what makes swapping implementations possible without changing the client code."
  - type: multiple_choice
    difficulty: 2
    text: "What does the design principle 'favor composition over inheritance' recommend, and which pattern is a direct application of it?"
    options:
      - "Prefer building behavior by combining smaller objects at runtime (e.g. Strategy, Decorator) rather than relying on rigid, compile-time class hierarchies"
      - "Always use as many levels of inheritance as possible for maximum code reuse"
      - "Never use interfaces, only abstract classes"
      - "Prefer Singleton over every other creational pattern"
    answer: 0
    explanation: "Inheritance hierarchies are fixed at compile time and can become rigid/fragile as they grow deep; composition (holding a reference to another object and delegating to it) can be reconfigured at runtime and avoids many of inheritance's pitfalls — Strategy and Decorator are textbook examples of achieving flexible behavior through composition instead of subclassing."
  - type: multiple_choice
    difficulty: 4
    text: "Which pattern would best decouple a notification system (e.g. sending order-confirmation messages by email, SMS, or push notification) so new channels can be added without modifying existing code?"
    options:
      - "Strategy (or Observer, if multiple channels should all react to the same event)"
      - "Singleton"
      - "Adapter"
      - "Memento"
    answer: 0
    explanation: "Encapsulating each notification channel as an interchangeable strategy behind a common 'send notification' interface lets you add a new channel by writing a new strategy class, with no changes to the code that triggers notifications; if multiple channels should all react to the same event independently, Observer is an equally natural fit."
  - type: multiple_choice
    difficulty: 3
    text: "In the classic GoF categorization, which of these is NOT one of the three main pattern categories?"
    options:
      - "Concurrency patterns"
      - "Creational patterns"
      - "Structural patterns"
      - "Behavioral patterns"
    answer: 0
    explanation: "The original Gang of Four book organizes its 23 patterns into Creational (object creation), Structural (object composition), and Behavioral (object collaboration/communication) categories; concurrency-specific patterns are a separate, later body of pattern literature (e.g. from 'Pattern-Oriented Software Architecture'), not part of the original GoF catalog."
  - type: multiple_choice
    difficulty: 2
    text: "What is a common criticism of applying design patterns indiscriminately to simple problems?"
    options:
      - "It can add unnecessary layers of abstraction and indirection, making simple code harder to understand for no real benefit"
      - "Design patterns are illegal to use in commercial software without a license"
      - "Patterns can only be implemented in strictly object-oriented languages"
      - "Using more than one pattern in the same codebase is always a bug"
    answer: 0
    explanation: "Patterns solve recurring structural problems, but applying one where the underlying problem doesn't actually exist (e.g. wrapping a single, never-changing algorithm in a full Strategy hierarchy) adds indirection and boilerplate without a matching benefit — patterns are a means to flexibility and clarity, not a goal in themselves."
  - type: multiple_choice
    difficulty: 3
    text: "What is the key structural difference between the Adapter and Decorator patterns, given both wrap another object?"
    options:
      - "Adapter changes the wrapped object's interface to match what the client expects; Decorator keeps the same interface as the wrapped object and adds behavior around it"
      - "Decorator can only wrap exactly one object ever, Adapter can wrap unlimited objects"
      - "Adapter is a behavioral pattern, Decorator is a creational pattern"
      - "They are functionally identical patterns"
    answer: 0
    explanation: "Both use composition/wrapping, but for different purposes: Adapter exists specifically to translate between two incompatible interfaces so they can work together; Decorator deliberately preserves the exact same interface as what it wraps, so it's transparent to callers, while adding extra behavior around the delegated calls."
  - type: multiple_choice
    difficulty: 4
    text: "What is the intent behind the 'double dispatch' technique used by the Visitor pattern?"
    options:
      - "Select which operation to run based on both the concrete type of the element being visited AND the concrete type of the visitor, rather than just one of the two"
      - "Run the same method twice in a row, always"
      - "Dispatch a method call to two completely unrelated objects simultaneously"
      - "Guarantee thread-safety by locking twice before executing"
    answer: 0
    explanation: "A single virtual method call only dispatches based on the runtime type of the receiver (single dispatch); Visitor achieves double dispatch by first calling 'accept(visitor)' on the element (dispatching on the element's type), which then calls back 'visitor.visit(this)' passing itself (dispatching again on the visitor's type), letting the correct combination of element type and operation be selected without a chain of type-checking conditionals."
  - type: multiple_choice
    difficulty: 2
    text: "Which pattern is most directly responsible for how many dependency injection frameworks construct complex object graphs?"
    options:
      - "A combination of Factory (deciding what concrete type to create) and Builder-like configuration (assembling dependencies step by step)"
      - "Memento"
      - "Visitor"
      - "Flyweight"
    answer: 0
    explanation: "DI containers largely automate what Factory and Builder patterns do manually: given a requested type, the container figures out (via configuration/registration) what concrete implementation to create and how to assemble its dependencies, rather than the calling code constructing objects with 'new' directly."
  - type: multiple_choice
    difficulty: 3
    text: "Which pattern is a natural fit for representing a document's lifecycle (Draft, InReview, Published, Archived) where the set of valid actions changes depending on the current stage?"
    options:
      - "State"
      - "Prototype"
      - "Flyweight"
      - "Facade"
    answer: 0
    explanation: "The State pattern models exactly this: an object (the document) delegates behavior to a current 'state' object, and transitioning between DraftState, InReviewState, PublishedState, etc. changes what operations are valid and how they behave, without a tangle of conditional logic scattered throughout the document class itself."
  - type: multiple_choice
    difficulty: 2
    text: "What is a 'God object' anti-pattern, often cited as the opposite of good design pattern usage?"
    options:
      - "A single class that knows about or does far too much, becoming a tangled hub of responsibilities that should have been split apart"
      - "A Singleton that has been correctly implemented"
      - "A class that implements every GoF pattern simultaneously"
      - "A term for the very first class ever written in a codebase"
    answer: 0
    explanation: "A God object accumulates responsibilities that should be distributed across multiple smaller, focused classes (violating the Single Responsibility Principle), often becoming a bottleneck for changes and a magnet for further unrelated additions — the pattern-based decomposition (Strategy, Command, Mediator, etc.) is precisely what helps avoid or break up such objects."
  - type: multiple_choice
    difficulty: 3
    text: "Why is a naive Singleton implementation often considered problematic in multi-threaded code?"
    options:
      - "Without proper synchronization, two threads could both see the instance as uninitialized at the same time and each create a separate instance, breaking the 'only one instance' guarantee"
      - "Singletons cannot be compiled in a multi-threaded application at all"
      - "Multi-threaded programs are not allowed to call static methods"
      - "This is not actually a real concern in any language"
    answer: 0
    explanation: "A naive 'if instance is null, create it' check-then-create sequence is a classic race condition: two threads can both pass the null check before either has finished constructing the instance, resulting in two separate objects; safe implementations use locking, double-checked locking, or a language feature like C#'s Lazy<T> to guarantee only one instance is ever created even under concurrent first access."
  - type: multiple_choice
    difficulty: 2
    text: "Which pattern would you use to make a legacy payment library (with an incompatible method signature) work with a new payment interface your application expects?"
    options:
      - "Adapter"
      - "Observer"
      - "Memento"
      - "Iterator"
    answer: 0
    explanation: "This is the textbook use case for Adapter: wrap the legacy library's incompatible interface in a new class that implements the interface your application expects, translating calls (and possibly data formats) between the two."
  - type: multiple_choice
    difficulty: 3
    text: "In the Composite pattern, what must be true of both 'leaf' and 'composite' node classes for the pattern to work as intended?"
    options:
      - "Both must implement the same common component interface, so client code can treat them uniformly"
      - "Only the composite class needs any interface at all"
      - "Leaf nodes must always be Singletons"
      - "Composite nodes cannot contain other composite nodes, only leaves"
    answer: 0
    explanation: "The whole point of Composite is that a client shouldn't need to distinguish between a single leaf object and a composite containing many objects; this only works if both leaf and composite classes implement the same interface, and a composite is free to contain other composites, forming an arbitrarily deep tree."
  - type: multiple_choice
    difficulty: 4
    text: "Why does adding a new concrete Element type to a class hierarchy tend to be costly when using the Visitor pattern?"
    options:
      - "Every existing Visitor implementation must be updated to add a new 'visit' method (or case) for the new element type"
