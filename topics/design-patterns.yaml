  - type: single_word
    difficulty: 2
    text: "What one-word pattern name describes an object created by copying an existing instance rather than instantiating a class directly?"
    answer: "Prototype"
    explanation: "Prototype clones an existing, already-configured object to produce a new one, which is useful when creating an object from scratch is expensive or when you specifically want a copy that starts out identical to an existing instance."
  - type: open_answer
    difficulty: 2
    text: "Explain the difference in intent between the Factory Method and Abstract Factory patterns, using an example of a cross-platform UI toolkit."
    answer: "Factory Method is about a single creation method being overridden by subclasses to decide which one concrete product gets created — e.g. a WindowsButtonCreator overriding CreateButton() to return a WindowsButton. Abstract Factory is about creating an entire family of related products through one interface — e.g. a WindowsUIFactory that has methods to create a matching Button, Checkbox, and Window all styled consistently for Windows, versus a MacUIFactory producing the Mac-styled equivalents — ensuring the products created together are always compatible with each other."
    explanation: "Abstract Factory is often implemented internally using several Factory Methods (one per product type in the family), which is why the two are frequently confused; the key distinguishing idea is 'one product' (Factory Method) versus 'a whole compatible family of products' (Abstract Factory)."
  - type: open_answer
    difficulty: 3
    text: "Explain why the Strategy pattern is often described as an application of the 'favor composition over inheritance' principle, contrasting it with a hypothetical inheritance-based alternative."
    answer: "With Strategy, varying behavior (e.g. different pricing algorithms) is extracted into separate, interchangeable objects held by composition (a reference field) inside the context class, and can be swapped at runtime by simply assigning a different strategy object. The inheritance-based alternative would require a subclass per behavior variant (e.g. RegularPricingCalculator, DiscountPricingCalculator), fixed at compile time, with no way to change an object's pricing behavior after it's been constructed, and requiring a new subclass for every new combination of behaviors if there is more than one axis of variation."
    explanation: "Composition-based designs like Strategy are more flexible specifically because the relationship (which behavior object is currently held) can be changed at runtime and doesn't require creating a new class for every possible combination, unlike an inheritance hierarchy which is fixed once the class is compiled."
  - type: open_answer
    difficulty: 3
    text: "Explain the tradeoff of the Visitor pattern: what becomes easy, and what becomes hard, when you use it to add operations over a fixed object structure."
    answer: "Visitor makes it easy to add new operations over an existing set of element types: you just write a new Visitor implementation with a visit method for each element type, without touching any of the element classes themselves. The tradeoff is that adding a brand-new element type becomes hard: every existing Visitor implementation must be updated to add a visit method/case for that new type, or the code won't compile (or the new type simply won't be handled)."
    explanation: "This is effectively the inverse tradeoff of a typical object-oriented hierarchy: normally adding a new subclass is cheap (implement the existing interface) but adding a new operation is expensive (touch every subclass); Visitor flips that so adding operations is cheap but adding element types is expensive — making it a good fit specifically when the element hierarchy is stable but new operations are added often."
  - type: open_answer
    difficulty: 4
    text: "Explain what problem a naive, non-thread-safe Singleton implementation has in a multi-threaded application, and describe (in words, not code) one common way to fix it."
    answer: "A naive implementation checks 'if the stored instance is null, create and store a new one' without synchronization. Two threads can both read the instance as null at nearly the same time, before either has finished constructing and assigning it, resulting in each thread creating its own separate instance — silently breaking the single-instance guarantee the pattern is supposed to provide. A common fix is to use a thread-safe lazy-initialization primitive provided by the language/runtime (such as C#'s Lazy<T>, which guarantees the factory delegate runs at most once even under concurrent access), or to add explicit locking around the check-and-create sequence so only one thread can perform the creation."
    explanation: "This is a classic check-then-act race condition; the fix works by making the 'check if it exists, and if not, create it' sequence atomic with respect to other threads, either through a language-provided lazy-initialization guarantee or manual mutual exclusion around that critical section."
  - type: open_answer
    difficulty: 3
    text: "Explain how the Decorator pattern could be used to add optional features (e.g. logging, caching, retry logic) to a data-fetching service, without modifying the original service class or creating a subclass for every combination of features."
    answer: "Define a common interface (e.g. IDataFetcher) that both the original service and each decorator implement. A LoggingDataFetcher decorator wraps any IDataFetcher and logs before/after delegating to it; a CachingDataFetcher decorator wraps any IDataFetcher and checks a cache before delegating to it. Since decorators share the same interface as what they wrap, they can be layered in any combination (e.g. wrap the original service in a CachingDataFetcher, then wrap that in a LoggingDataFetcher) at runtime, giving every combination of features without needing a dedicated subclass for each one."
    explanation: "This avoids the combinatorial explosion of subclasses you'd get from inheritance (LoggingCachingDataFetcher, CachingLoggingDataFetcher, LoggingOnlyDataFetcher, etc.) by instead composing small, independent decorator objects, each responsible for exactly one added behavior."
  - type: open_answer
    difficulty: 2
    text: "Explain the risk of overusing the Singleton pattern for shared state, specifically in terms of unit testing."
    answer: "Code that depends directly on a singleton (by calling its static accessor rather than receiving it as an injected dependency) is hard to test in isolation, because you can't easily substitute a fake or mock instance for the test — the singleton's global, shared state persists across tests unless carefully reset, and tests that run in parallel or in different orders can interfere with each other through that shared state, producing flaky or order-dependent test failures."
    explanation: "This is why dependency injection is often preferred over the classic Singleton pattern in testable codebases: injecting an interface as a constructor parameter lets tests substitute a mock/fake implementation freely, while still allowing the production code to register a single shared instance if that's actually needed."
  - type: open_answer
    difficulty: 4
    text: "Explain the intent of the Bridge pattern and give an example of when you would use it instead of a straightforward inheritance hierarchy."
    answer: "Bridge decouples an abstraction (what a client interacts with) from its implementation (how it's actually carried out), connecting them via composition instead of inheritance, so each side can vary independently. A concrete example: a 'Shape' abstraction (Circle, Square) that needs to be rendered using different rendering APIs (Vector rendering, Raster rendering). A naive inheritance approach would need a subclass for every combination (VectorCircle, RasterCircle, VectorSquare, RasterSquare), growing combinatorially as either dimension grows. Bridge instead gives Shape a reference to a separate Renderer interface (implemented by VectorRenderer, RasterRenderer), so any Shape can be combined with any Renderer without a subclass explosion, and new shapes or new renderers can each be added independently."
    explanation: "The signal that Bridge is the right fit is exactly this: two independent dimensions of variation that would otherwise multiply into a combinatorial number of subclasses under plain inheritance — Bridge turns that multiplication into simple addition by composing the two hierarchies together instead of merging them into one."
  - type: open_answer
    difficulty: 3
    text: "Design (in words, not code) a Command-based undo system for a simple text editor that supports typing and deleting text. Describe what the Command interface would look like and how undo would work."
    answer: "Define a Command interface with an Execute() method and an Undo() method. A TypeCommand stores the text that was typed and the position it was inserted at; Execute() inserts that text at that position, and Undo() removes exactly that range of text again. A DeleteCommand stores the text that was deleted and its original position; Execute() removes it, and Undo() re-inserts the stored text at the stored position. Every time the user performs an action, the corresponding Command object is created, executed, and pushed onto a history stack. To undo, pop the most recent Command off the stack and call its Undo() method; to redo, keep a separate 'redone' stack (or move popped commands to a redo stack) so they can be re-executed."
    explanation: "The key design idea is that each Command stores exactly the information it needs to reverse its own effect — this is what makes a simple stack-based undo/redo mechanism possible, since the editor itself never needs to know how to undo an arbitrary action, only how to call Undo() on whatever Command is on top of the stack."
  - type: open_answer
    difficulty: 4
    text: "Explain why the State pattern is often preferred over a large switch/if-else statement on an enum representing an object's current state, as the number of states and transitions grows."
    answer: "A switch/if-else on an enum concentrates every state-dependent branch of every method into the same few large conditional blocks, scattered across the class; as more states and transitions are added, these conditionals grow larger and more tangled, and adding a new state requires finding and updating every switch statement across the class (easy to miss one). The State pattern instead gives each state its own class implementing a common interface, so state-specific behavior lives in one focused place per state; adding a new state means adding a new class implementing the interface, without touching the logic of existing states at all, and the object's overall behavior is simply determined by which state object it currently delegates to."
    explanation: "This mirrors the general benefit of polymorphism over conditional branching: it turns 'branch on type/state everywhere this behavior is needed' into 'each type/state knows its own behavior', trading a few extra small classes for eliminating scattered, growing conditional logic."
  - type: open_answer
    difficulty: 3
    text: "Write pseudocode (or actual code in any language) for a minimal thread-safe Singleton using lazy initialization, and briefly explain what makes it thread-safe."
    answer: |
      ```csharp
      public sealed class Logger
      {
          private static readonly Lazy<Logger> _instance = new(() => new Logger());
          public static Logger Instance => _instance.Value;
          private Logger() { }
      }
      ```
      This is thread-safe because Lazy<T> guarantees, by default, that its factory delegate is invoked at most once even if multiple threads access .Value concurrently before initialization completes — internally it synchronizes the first access so only one thread actually constructs the Logger, and every thread (including the ones that arrived during construction) ends up with the exact same instance.
    explanation: "This sidesteps writing manual double-checked locking by relying on a language/runtime primitive (Lazy<T>) that already solves the exact 'construct exactly once under concurrent access' problem correctly and efficiently."
  - type: multiple_choice
    difficulty: 2
    text: "Which pattern is most naturally suited to representing a multi-step wizard UI (e.g. a checkout process with Cart, Shipping, Payment, Confirmation screens), where the current screen determines what the 'Next'/'Back' buttons do?"
    options:
      - "State"
      - "Prototype"
      - "Flyweight"
      - "Visitor"
    answer: 0
    explanation: "Each wizard screen can be modeled as a State object that knows which state comes next/previous and what validation applies; the wizard's container simply delegates 'Next'/'Back' handling to whichever state object is current, rather than maintaining a large conditional keyed on 'which step number are we on'."
  - type: open_answer
    difficulty: 2
    text: "Give a concrete real-world (non-code) example of the Observer pattern that most people are already familiar with, and identify which part plays the 'subject' and which parts play the 'observers'."
    answer: "A YouTube channel subscription is a real-world Observer pattern: the channel is the subject, and every subscriber is an observer. When the channel (subject) uploads a new video (its state changes), every subscriber (observer) who registered interest gets notified automatically, without the channel needing to know anything about who its subscribers are individually or what they'll do with the notification (watch immediately, ignore it, etc.)."
    explanation: "This example highlights the loose coupling at the heart of Observer: the subject (channel) only needs a generic way to notify 'whoever is subscribed', and has no dependency on the concrete identity or behavior of any specific observer."
  - type: open_answer
    difficulty: 3
    text: "Explain what a Repository pattern is, and why it's commonly compared to a Facade specialized for data access."
    answer: "A Repository presents a simplified, collection-like interface (e.g. GetById, Add, Remove, Find) over whatever the actual data access mechanism happens to be — raw SQL, an ORM, an external API, or even an in-memory store — so the rest of the application interacts with 'a collection of Customers' conceptually, without knowing or caring how that data is actually persisted or fetched. It's compared to a Facade because, like a Facade, it hides the complexity of a larger subsystem (the data access layer, connection handling, query construction) behind a small, easy-to-use surface, though a Repository is specifically scoped to persistence concerns rather than being a general-purpose subsystem simplifier."
    explanation: "A key practical benefit is testability and swappability: code that depends on an IRepository interface can be tested against an in-memory fake implementation, and the real implementation (SQL, a different ORM, a remote API) can be swapped later without touching any of the code that only ever talked to the Repository's interface."
