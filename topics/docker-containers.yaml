  - type: open_answer
    difficulty: 2
    text: "Explain the difference between a Docker image and a Docker container, using an analogy to a class and an object in object-oriented programming."
    answer: "A Docker image is like a class: an immutable template/blueprint describing what the thing should look like and contain, but not a running instance itself. A Docker container is like an object (an instance of that class): a live, running instantiation of the image, with its own writable state layered on top, and just as many objects can be instantiated from one class, many independent containers can be started from the same image simultaneously."
    explanation: "This analogy also explains why changes made inside a running container (its 'instance state') don't affect the original image, or other containers started from it, the same way modifying one object's fields doesn't change the class definition or other instances of it."
  - type: open_answer
    difficulty: 3
    text: "Explain why Docker's layer caching means the order of instructions in a Dockerfile can significantly affect build speed, using a typical Node.js application (package.json + source code) as an example."
    answer: "Docker invalidates the build cache starting from the first Dockerfile instruction whose input has changed, and every instruction after that point must also be re-run, even if their own inputs are unchanged. If a Dockerfile copies the entire source code first and then runs the dependency install step, any single source code change invalidates the cache for the COPY instruction, forcing the (often much slower) dependency install to also re-run every time, even though the actual dependencies (package.json) didn't change. Instead, copying only package.json first, running the install step, and only then copying the rest of the source code means editing source files no longer invalidates the (already cached) install layer, since that layer's only input (package.json) hasn't changed."
    explanation: "This reordering trick is one of the most common and impactful Dockerfile optimizations, since dependency installation is often the slowest step in a typical application build, and it's usually the step that changes least often relative to application source code."
  - type: open_answer
    difficulty: 3
    text: "Explain what a multi-stage Dockerfile build is and why it produces a smaller final image than a single-stage build for a compiled application (e.g. a Go or .NET app)."
    answer: "A multi-stage build uses more than one FROM instruction in the same Dockerfile, each starting a new, independent stage. An early stage uses a full SDK/build-tooling base image (containing compilers, build dependencies, etc.) to compile the application. A later, final stage starts from a much smaller runtime-only base image and uses 'COPY --from=<earlier stage>' to copy over just the compiled output (e.g. a single executable or a small set of published files), discarding the entire build toolchain, source code, and intermediate build artifacts. The final image therefore only contains what's actually needed to run the application, not everything that was needed to build it."
    explanation: "Without multi-stage builds, you'd either need a single, bloated image containing the full SDK just so it could compile the app once at build time (and then carry that SDK's weight around forever afterward), or a separate manual process to build outside Docker and copy artifacts in — multi-stage builds let both steps happen cleanly within one Dockerfile."
  - type: open_answer
    difficulty: 3
    text: "Explain the difference between a Docker volume and a bind mount, and describe a scenario where each would be the more appropriate choice."
    answer: "A volume is fully managed by Docker, stored in a location Docker controls, and is portable across different host environments without depending on a specific host filesystem path — it's the appropriate choice for persistent application data like a database's files, especially in production, since it doesn't tie the setup to a particular host directory structure. A bind mount instead maps a specific, existing path on the host directly into the container, which is ideal during local development — for example, mounting your project's source code directory into a container so code changes on the host are immediately visible inside the running container, without needing to rebuild the image after every edit."
    explanation: "The key distinguishing factor is who 'owns' and manages the storage location: Docker for volumes (abstracted, portable), versus you and your host's actual filesystem for bind mounts (concrete, host-specific) — which is exactly why bind mounts are so convenient for live-editing source code locally but less suited to production data persistence across different deployment environments."
  - type: open_answer
    difficulty: 4
    text: "Explain why running a containerized process as root is considered a security risk, even though the process is 'isolated' inside a container."
    answer: "Containers share the host machine's kernel rather than running their own separate one, and container isolation (via namespaces/cgroups) is a software-enforced boundary, not a hardware-level one like a virtual machine's. If an attacker exploits a vulnerability that lets them break out of the container's isolation (a 'container escape'), the privilege level they end up with on the host is directly related to the privilege level the process had inside the container — a process running as root inside the container is more likely to escalate to meaningful host-level privileges after an escape than one running as an unprivileged user, since root inside the container often maps to genuinely privileged capabilities on the shared kernel."
    explanation: "This is why running as a dedicated non-root user (via a Dockerfile USER instruction) is recommended as defense-in-depth: it doesn't prevent every possible attack, but it meaningfully limits what an attacker can do even if they do find a way to escape or otherwise compromise the containerized process."
