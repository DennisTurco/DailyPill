    difficulty: 2
    text: "Explain why relying on the ':latest' tag for a production deployment is risky, and describe a safer alternative practice."
    answer: "':latest' is just a conventional, movable tag — whoever publishes the image can repoint it to entirely different image content at any time, with no guarantee it always points to a genuinely 'newest' or even compatible version. Deploying 'myapp:latest' today and redeploying the same reference weeks later could silently pull a completely different image than what was originally tested, without any explicit version change being visible in your deployment configuration. A safer practice is pinning to a specific, immutable version tag (e.g. 'myapp:1.4.2') or, for the strongest guarantee, a content digest (e.g. 'myapp@sha256:...'), ensuring the exact same image content is used every single time, regardless of what happens to other tags later."
    explanation: "This matters most for reproducibility and rollback: if a deployment starts failing, being able to say precisely 'we deployed exactly this image, unchanged' (via a pinned version or digest) is essential for debugging and for reliably rolling back to a known-good previous version."
  - type: open_answer
    difficulty: 3
    text: "Explain what a Docker health check is for, and why 'the container's process is running' is not always a sufficient signal that the application inside is actually working correctly."
    answer: "A process being alive only tells you the operating-system-level process hasn't crashed or exited — it says nothing about whether the application inside is actually functioning: it could be stuck in an infinite loop, deadlocked, still initializing (e.g. a database loading data before accepting connections), or failing every request while technically still running. A health check defines an actual application-level probe (commonly hitting a dedicated /health HTTP endpoint or running a specific command) that Docker (or an orchestrator) runs periodically, letting the system distinguish between 'process exists' and 'application is actually ready and responding correctly' — which matters for decisions like whether to route traffic to a container, or whether a dependent service should keep waiting before starting."
    explanation: "This distinction is especially important in orchestrated environments (like Kubernetes) where readiness/liveness probes directly control whether traffic is routed to an instance or whether it gets automatically restarted, decisions that a bare 'is the process running' check can't make reliably on its own."
  - type: open_answer
    difficulty: 3
    text: "Explain why containerized applications are conventionally designed to log to stdout/stderr instead of writing log files inside the container's own filesystem."
    answer: "A container's own writable filesystem layer is ephemeral and tied to that specific container's lifecycle — if the container is removed or recreated (which happens routinely during deployments, scaling, or crashes and restarts), any log file stored only inside it is lost along with the container. Docker automatically captures whatever a container's main process writes to stdout/stderr, making that output retrievable via 'docker logs' and forwardable to external logging/monitoring systems through Docker's logging drivers, entirely independent of the container's own filesystem lifecycle. Logging to stdout/stderr therefore decouples the durability and collection of logs from the transient nature of any individual container instance."
    explanation: "This convention is part of a broader philosophy (sometimes summarized as the 'twelve-factor app' approach) of treating containerized application instances as disposable, with anything meant to persist — logs, data — deliberately routed to systems designed for persistence, rather than relying on the container's own local, ephemeral storage."
  - type: open_answer
    difficulty: 2
    text: "Write the docker-compose.yml snippet (just the relevant service definitions, not a full file) for a simple web application service depending on a Postgres database service, including the dependency relationship and port mapping for the web service."
    answer: |
      ```yaml
      services:
        web:
          build: .
          ports:
            - "8080:80"
          depends_on:
            - db
        db:
          image: postgres:16
          environment:
            POSTGRES_PASSWORD: example
      ```
    explanation: "'depends_on' ensures the db container starts before the web container (though not necessarily that Postgres is fully ready to accept connections yet); the 'ports' mapping makes the web service's internal port 80 reachable on the host's port 8080; within the same compose network, the web service could reach the database simply by hostname 'db', without needing any explicit IP address."
  - type: open_answer
    difficulty: 3
    text: "Explain why PID 1 inside a container needs to handle signals like SIGTERM explicitly, and describe what can go wrong if it doesn't."
    answer: "In Linux, PID 1 does not receive the usual default signal handling behavior that every other process gets automatically — if the process running as PID 1 doesn't install its own explicit handler for a signal like SIGTERM, that signal is effectively ignored by default rather than terminating the process. This means 'docker stop', which sends SIGTERM and waits for a grace period before escalating to SIGKILL, can appear to do nothing at all: the container keeps running the full timeout and is only actually stopped once the forceful SIGKILL arrives, rather than shutting down promptly and cleanly."
    explanation: "This is a common gotcha with shell-form CMD/ENTRYPOINT (where a shell, not the real application, ends up as PID 1) or with applications that were never written with this Linux-specific PID 1 behavior in mind; a small init wrapper like tini is sometimes added specifically to handle signal forwarding correctly on the application's behalf."
  - type: open_answer
    difficulty: 2
    text: "Explain the difference between 'docker stop' and 'docker kill', and describe a situation where using 'docker kill' directly might be appropriate."
    answer: "'docker stop' sends SIGTERM first, giving the container's process a chance to shut down gracefully (closing connections, flushing buffers) before forcing termination with SIGKILL only after a timeout (10 seconds by default) if it hasn't exited on its own. 'docker kill' sends SIGKILL immediately, with no grace period at all. 'docker kill' might be appropriate when a container is completely unresponsive/hung and you don't want to wait out the full stop timeout, or in automated scripts/tests where immediate termination is preferred over waiting for a graceful shutdown that isn't actually needed."
    explanation: "In normal operation, 'docker stop' is almost always preferred since it gives the application a real chance to clean up; 'docker kill' trades that safety for immediacy, which is occasionally the right tradeoff but should be a deliberate choice rather than the default habit."
  - type: open_answer
    difficulty: 3
    text: "Explain what a Docker registry is, and describe the difference between a public registry like Docker Hub and a private, self-hosted registry."
    answer: "A registry is a storage and distribution service for container images, organized into repositories and tags; 'docker push' uploads images to a registry and 'docker pull' downloads them. Docker Hub is a public registry (though it also supports private repositories) hosting official and community images that anyone can pull by default. A private/self-hosted registry restricts access to authorized users or systems (often within an organization's own infrastructure or cloud account), which is common for proprietary application images that shouldn't be publicly accessible, and typically requires authenticating (e.g. via 'docker login') before pulling or pushing."
    explanation: "The underlying mechanics (push/pull, tags, layers) are identical regardless of which registry is used — the difference is purely about access control and where the images are hosted."
  - type: open_answer
    difficulty: 3
    text: "Explain the purpose of resource limits like '--memory' and '--cpus' on a container, and describe what could happen on a shared host if they were never set."
    answer: "These flags cap how much memory and CPU a container is allowed to consume, enforced by the underlying cgroups mechanism. Without any limits, a single misbehaving or unexpectedly resource-hungry container (due to a bug, a memory leak, or a traffic spike) could consume all of the host machine's available memory or CPU, starving every other container (and potentially the host's own processes) running on that same machine — a classic 'noisy neighbor' problem in shared, multi-container environments."
    explanation: "Setting sensible resource limits is a basic but important isolation practice, especially once multiple unrelated containers share the same host, since without limits, containers are only isolated in terms of filesystem/process/network namespaces, not automatically in terms of how much of the host's actual hardware resources they can consume."
  - type: open_answer
    difficulty: 3
    text: "Explain what a custom, user-defined Docker bridge network provides that the default bridge network does not, and why this matters for a typical docker-compose application with a web service and a database service."
    answer: "A user-defined bridge network provides automatic DNS-based name resolution between containers attached to it, letting them reach each other by container/service name (e.g. the web service connecting to 'db:5432') rather than needing to know or hardcode a specific IP address, which the default bridge network does not support. This matters for a compose application because container IP addresses aren't guaranteed to stay the same across restarts, so relying on IP addresses directly would be fragile; docker-compose handles this automatically by creating a dedicated custom network for each project and attaching all its services to it."
    explanation: "This is why compose-based multi-container applications can simply reference services by name in configuration (like a database connection string using 'db' as the hostname) without any manual network configuration — the custom network and its DNS resolution are set up implicitly by compose."
  - type: open_answer
    difficulty: 4
    text: "Explain why storing session data or uploaded files only in a container's local writable layer becomes a problem once an application is scaled to multiple replicas behind a load balancer."
    answer: "With multiple replicas, a load balancer can route different requests from the same user to different container instances over time, each with its own independent local writable layer. If session data or an uploaded file is only saved inside the specific container that handled the first request, a later request routed to a different replica won't have access to that data at all, causing inconsistent or broken behavior (e.g. a user appearing logged out, or an uploaded file 'disappearing') depending purely on which replica happened to handle each request."
    explanation: "The standard fix is moving such state out of any individual container's local storage into a shared, external system all replicas can access equally — a shared database or cache for session data, and object storage or a shared volume for uploaded files — so behavior doesn't depend on which specific replica serves a given request."
  - type: open_answer
    difficulty: 2
    text: "Explain what 'docker system prune' does by default, and why it's worth checking what it will remove before running it with additional flags like -a or --volumes."
    answer: "By default, 'docker system prune' removes stopped containers, dangling (untagged) images, unused networks, and unused build cache — specifically excluding anything still attached to or used by a currently running container. Adding '-a' additionally removes all unused images (not just dangling ones), and adding '--volumes' additionally removes unused volumes, both of which can delete things you didn't intend to lose — for example, an image you plan to reuse later but isn't currently backing a running container, or a volume holding data from a container that's just temporarily stopped."
    explanation: "Because volumes in particular can hold meaningful persistent data (like a database's files), running prune with --volumes without first checking what would actually be removed can lead to genuine, unrecoverable data loss — it's worth listing what's currently unused before broadening the cleanup scope."
  - type: open_answer
    difficulty: 3
    text: "Explain the difference between the 'shell form' and 'exec form' of the ENTRYPOINT instruction, and why exec form is generally preferred for proper signal handling."
    answer: "Shell form (e.g. 'ENTRYPOINT npm start') runs the given command through an intermediate shell (like /bin/sh -c '...'), meaning the shell process itself becomes PID 1 inside the container, with the actual application running as a child process of that shell. Exec form (e.g. 'ENTRYPOINT [\"npm\", \"start\"]', the JSON array syntax) runs the specified process directly as PID 1, with no intermediate shell. Exec form is generally preferred because signals sent to the container (like SIGTERM from 'docker stop') go directly to the real application process rather than to an intermediate shell that may not forward them properly, which can otherwise cause the container to ignore stop requests until the SIGKILL timeout is reached."
    explanation: "This is a subtle but common source of containers that seem to 'hang' on shutdown until force-killed — switching a Dockerfile's ENTRYPOINT/CMD from shell form to exec form is a common, simple fix for that specific symptom."
  - type: open_answer
    difficulty: 3
    text: "Explain why combining 'apt-get update' and 'apt-get install' into a single RUN instruction (rather than two separate RUN instructions) is a recommended Dockerfile practice."
    answer: "If 'apt-get update' and 'apt-get install' are separate RUN instructions, Docker's layer caching can reuse the 'update' layer from a previous build even when the actual package list on the remote repository has changed since then, because from Docker's perspective the instruction's input (the command text itself) hasn't changed, so it doesn't know the underlying package index is now stale. This can silently cause 'apt-get install' to fail (or install unexpectedly old package versions) if it runs against a cached, out-of-date package index. Combining both into a single RUN instruction (with '&&') ensures that whenever this step's cache is invalidated for any reason, both the update and the install always run together, using a fresh package index every time they do run."
    explanation: "This is a specific, well-documented instance of a more general Dockerfile principle: instructions whose correctness depends on each other running together (not just independently) should usually be combined into a single RUN instruction, rather than relying on Docker's layer caching to always re-run them in sync."
  - type: open_answer
    difficulty: 2
    text: "Explain what a Docker health check is for, and give a concrete example of a health check command for a simple web service."
    answer: "A health check periodically runs a command inside the container to verify the application is actually functioning correctly, beyond just 'the process hasn't crashed'. A concrete example for a web service: 'HEALTHCHECK CMD curl -f http://localhost/health || exit 1', which requests a dedicated /health endpoint the application exposes; if the request fails (non-2xx response, or curl itself fails to connect), the health check reports the container as unhealthy, letting tools like 'docker ps' or an orchestrator's readiness checks reflect that the application isn't actually ready to serve traffic, even though its process is still running."
    explanation: "This distinction — process running versus application actually healthy — matters especially in orchestrated environments where traffic routing and restart decisions depend on a more meaningful readiness signal than simply whether the OS-level process still exists."
  - type: open_answer
    difficulty: 3
    text: "Write the Dockerfile instruction that copies a local 'package.json' file into the image, runs 'npm install', and only afterward copies the rest of the application source code — structured to maximize Docker's build cache reuse when only source code (not dependencies) changes."
    answer: |
      ```dockerfile
      FROM node:20-alpine
      WORKDIR /app
      COPY package.json package-lock.json ./
      RUN npm install
      COPY . .
      CMD ["node", "index.js"]
      ```
    explanation: "Because only the dependency manifest files are copied before running 'npm install', that (often slow) layer only gets invalidated and re-run when the dependency files themselves change; copying the rest of the source afterward means everyday source code edits invalidate only the final COPY layer, leaving the cached 'npm install' layer untouched and reused."
  - type: open_answer
    difficulty: 2
    text: "Write the docker run command to start a Postgres container in detached mode, name it 'mydb', set the POSTGRES_PASSWORD environment variable to 'secret', and map container port 5432 to host port 5432."
    answer: |
      ```bash
      docker run -d --name mydb -e POSTGRES_PASSWORD=secret -p 5432:5432 postgres:16
      ```
    explanation: "'-d' runs the container in detached (background) mode; '--name' gives it a predictable name for later reference; '-e' sets an environment variable inside the container (which the official postgres image reads to configure the initial superuser password); '-p host:container' publishes the container's port 5432 to the same port on the host."
  - type: open_answer
    difficulty: 3
    text: "Write the Dockerfile instructions for a minimal multi-stage build of a compiled application: an initial 'build' stage using a full SDK image to build the app, and a final stage that copies just the built output into a minimal runtime image."
    answer: |
      ```dockerfile
      FROM mcr.microsoft.com/dotnet/sdk:8.0 AS build
      WORKDIR /src
      COPY . .
      RUN dotnet publish -c Release -o /app/publish

      FROM mcr.microsoft.com/dotnet/aspnet:8.0 AS final
      WORKDIR /app
      COPY --from=build /app/publish .
      ENTRYPOINT ["dotnet", "MyApp.dll"]
      ```
    explanation: "The 'build' stage (named via 'AS build') has the full SDK needed to compile and publish the application; the final stage starts fresh from a much smaller runtime-only base image and uses 'COPY --from=build' to bring over only the already-compiled output, so the SDK, source code, and any intermediate build artifacts never end up in the final image at all."
