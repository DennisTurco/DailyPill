name: Docker & Container Basics
category: Computer Science
difficulty: medium
ai_generate: true
content: |
  Container fundamentals: how containers differ from virtual machines, images
  and layers, the Dockerfile instruction set, image registries, networking
  modes, volumes vs bind mounts, docker-compose for multi-container setups,
  and basic image/security best practices.
manual_questions:
  - type: multiple_choice
    difficulty: 1
    text: "What is the fundamental difference between a container and a virtual machine?"
    options:
      - "A container shares the host OS kernel and isolates processes at the OS level; a VM virtualizes hardware and runs a full separate guest OS"
      - "A container is always slower to start than a VM"
      - "A VM shares the host OS kernel, while a container runs its own separate kernel"
      - "There is no meaningful technical difference between the two"
    answer: 0
    explanation: "Containers use OS-level isolation features (namespaces, cgroups on Linux) to run processes that share the host's kernel but see an isolated filesystem/process/network view; a VM instead virtualizes hardware and boots an entire independent guest operating system, which is why containers start in milliseconds/seconds and use far less overhead than a VM."
  - type: multiple_choice
    difficulty: 1
    text: "What is a Docker image?"
    options:
      - "A read-only template containing an application and everything needed to run it, used to create containers"
      - "A running instance of an application"
      - "A virtual machine's hard disk file"
      - "A configuration file listing which ports are open on a server"
    answer: 0
    explanation: "An image is an immutable, layered filesystem snapshot plus metadata (default command, exposed ports, environment variables); running that image creates a container, which is a live, running (and writable) instance of it."
  - type: multiple_choice
    difficulty: 2
    text: "What is the relationship between a Docker image and a Docker container?"
    options:
      - "A container is a running instance created from an image; the same image can be used to start many independent containers"
      - "An image is created from a container after it stops running, and never the other way around"
      - "They are exact synonyms with no distinction"
      - "One image can only ever produce exactly one container"
    answer: 0
    explanation: "Images are the static, shareable template; 'docker run' instantiates a container from that image, adding a thin writable layer on top — you can run many containers from the same image simultaneously, each with its own isolated writable state."
  - type: multiple_choice
    difficulty: 2
    text: "What does the 'FROM' instruction in a Dockerfile do?"
    options:
      - "Specifies the base image that the new image is built on top of"
      - "Defines the container's exposed network ports"
      - "Copies files from the host machine into the image"
      - "Sets an environment variable inside the image"
    answer: 0
    explanation: "Every Dockerfile must start with FROM, naming the base image (e.g. 'FROM node:20-alpine') whose filesystem and configuration the new image builds upon by adding further layers on top."
  - type: multiple_choice
    difficulty: 2
    text: "What is the key difference between the 'COPY' and 'ADD' Dockerfile instructions?"
    options:
      - "ADD supports extra features like automatically extracting local tar archives and fetching remote URLs; COPY only does a straightforward file/directory copy"
      - "COPY can only copy a single file, while ADD can copy entire directories"
      - "ADD is deprecated and no longer works in modern Docker"
      - "They are functionally identical in every version of Docker"
    answer: 0
    explanation: "Because ADD's extra 'magic' behaviors (auto-extracting archives, downloading from a URL) can be surprising and are rarely what's actually intended, official Docker guidance generally recommends COPY for simple file copying and reserving ADD only for the specific cases where its extra behavior is genuinely wanted."
  - type: multiple_choice
    difficulty: 2
    text: "What is the difference between the 'CMD' and 'ENTRYPOINT' Dockerfile instructions?"
    options:
      - "ENTRYPOINT defines the fixed executable that always runs when the container starts; CMD supplies default arguments that can be overridden at 'docker run' time"
      - "CMD can only be used once per Dockerfile, ENTRYPOINT can be used unlimited times"
      - "ENTRYPOINT is only valid for Windows containers"
      - "They are exact synonyms and always interchangeable"
    answer: 0
    explanation: "ENTRYPOINT sets the container's main executable, which is much harder to override at runtime; CMD provides default arguments to that entrypoint (or a default command if there's no ENTRYPOINT), which a user can easily replace by passing arguments to 'docker run'. Combining both is a common pattern: a fixed ENTRYPOINT binary with a CMD supplying its default arguments."
  - type: multiple_choice
    difficulty: 3
    text: "Why does Docker layer images, and what practical benefit does this provide?"
    options:
      - "Each Dockerfile instruction typically creates a new layer, and unchanged layers can be cached and reused across builds and shared across images, saving build time and disk space"
      - "Layers exist purely for security isolation between containers"
      - "Layering has no practical effect on build time or storage"
      - "Each layer must always be re-downloaded fully on every build"
    answer: 0
    explanation: "If an early Dockerfile instruction (e.g. installing dependencies) hasn't changed, Docker reuses the cached layer from a previous build instead of re-running it, dramatically speeding up rebuilds; multiple images sharing the same base layers also only need to store/download those shared layers once on a given machine."
  - type: multiple_choice
    difficulty: 3
    text: "Why does the order of instructions in a Dockerfile matter for build caching?"
    options:
      - "Docker invalidates the cache starting from the first changed instruction, so placing rarely-changing instructions (like dependency installation) before frequently-changing ones (like copying source code) maximizes cache reuse"
      - "Instruction order has no effect on caching whatsoever"
      - "Dockerfiles are always executed in reverse order regardless of how they're written"
      - "Only the very last instruction in a Dockerfile is ever cached"
    answer: 0
    explanation: "Since each layer's cache validity depends on the layers before it being unchanged, a common optimization is copying only dependency manifests (e.g. package.json) and running the install step before copying the rest of the source code — so editing application code doesn't invalidate (and force re-running) the potentially slow dependency-installation layer."
  - type: multiple_choice
    difficulty: 3
    text: "What is a 'multi-stage build' in a Dockerfile?"
    options:
      - "Using multiple FROM instructions in one Dockerfile so a later stage can selectively copy only the needed artifacts from an earlier build stage, discarding everything else"
      - "Building the same image on multiple different operating systems simultaneously"
      - "Running a container in multiple network namespaces at once"
      - "A deprecated feature no longer supported in current Docker versions"
    answer: 0
    explanation: "Multi-stage builds let you use a full SDK/build-tooling image in an early stage to compile/build an application, then copy just the compiled output into a much smaller final-stage base image (e.g. a slim runtime image), producing a final image that doesn't carry the entire build toolchain's weight and attack surface."
  - type: multiple_choice
    difficulty: 2
    text: "What is the purpose of the 'WORKDIR' instruction in a Dockerfile?"
    options:
      - "Sets the working directory for any subsequent instructions (RUN, CMD, COPY, etc.) in the Dockerfile"
      - "Permanently deletes a directory inside the image"
      - "Defines which host directory gets mounted as a volume"
      - "Specifies the entrypoint script's file extension"
    answer: 0
    explanation: "WORKDIR changes the current directory context for all following instructions, similar to running 'cd' before them, and also sets the default working directory for the container when it starts, avoiding the need to repeat absolute paths throughout the Dockerfile."
  - type: multiple_choice
    difficulty: 2
    text: "What is the difference between 'ENV' and 'ARG' in a Dockerfile?"
    options:
      - "ENV sets an environment variable available both during the build and inside the running container; ARG defines a build-time-only variable not available after the image is built"
      - "ARG variables persist into the running container, ENV variables do not"
      - "They are identical and interchangeable in every situation"
    answer: 0
    explanation: "ENV values become part of the image and are visible as regular environment variables inside any container started from it; ARG values are only available during the 'docker build' process itself (e.g. to parameterize a version number) and disappear once the image is built, unless explicitly also assigned to an ENV variable."
  - type: multiple_choice
    difficulty: 2
    text: "What does the 'EXPOSE' instruction in a Dockerfile actually do?"
    options:
      - "Documents which port(s) the containerized application listens on; it does not by itself publish/map that port to the host"
      - "Automatically opens the port on the host machine's firewall"
      - "Forces the container to only accept traffic on that port, blocking all others"
      - "Publishes the port publicly on the internet"
    answer: 0
    explanation: "EXPOSE is primarily documentation/metadata (and enables some tooling, like 'docker run -P' to auto-publish exposed ports to random host ports) — actually making a container's port reachable from the host requires the '-p host_port:container_port' flag on 'docker run', or the equivalent 'ports' entry in docker-compose."
  - type: multiple_choice
    difficulty: 1
    text: "What does 'docker run -p 8080:80 myimage' do?"
    options:
      - "Maps port 80 inside the container to port 8080 on the host machine"
      - "Maps port 8080 inside the container to port 80 on the host machine"
      - "Runs the container using exactly 8080 MB of memory"
      - "Restricts the container to run for only 80 seconds"
    answer: 0
    explanation: "The '-p' flag format is 'host_port:container_port', so requests to the host machine's port 8080 get forwarded to port 80 inside the container, letting you access a containerized web server (listening internally on 80) via localhost:8080 on the host."
  - type: multiple_choice
    difficulty: 2
    text: "What is the difference between a Docker volume and a bind mount?"
    options:
      - "A volume is managed entirely by Docker (stored in Docker's own storage area); a bind mount maps a specific existing path on the host filesystem directly into the container"
      - "A bind mount can only be used for read-only data, a volume cannot"
      - "Volumes only work on Linux hosts, bind mounts only work on Windows"
      - "They are exact synonyms with no practical difference"
    answer: 0
    explanation: "Volumes are created and managed by Docker itself (docker volume create, or implicitly), living in a location Docker controls and are portable across environments; bind mounts reference an arbitrary, specific path on the host machine, which is useful for local development (e.g. mounting your source code directory) but ties the setup to that host's specific filesystem layout."
  - type: multiple_choice
    difficulty: 2
    text: "Why would you use a volume for a database container's data directory instead of just letting it live in the container's own writable layer?"
    options:
      - "Data in a volume persists independently of the container's lifecycle, surviving container removal/recreation; data in the writable layer is lost when the container is removed"
      - "Volumes make database queries run faster than any other storage option"
      - "The container's writable layer cannot store any data larger than 10MB"
      - "There is no difference; both persist identically forever"
    answer: 0
    explanation: "Containers are meant to be disposable — recreating one (e.g. after an image update) discards its writable layer entirely; a volume is a separate, persistent piece of storage that a new container can be reattached to, so the actual data (like a database's files) survives container replacement instead of being lost with it."
  - type: multiple_choice
    difficulty: 2
    text: "What is the purpose of a .dockerignore file?"
    options:
      - "It lists files/patterns to exclude from the build context sent to the Docker daemon, keeping images smaller and builds faster"
      - "It lists container images that should never be pulled"
      - "It configures which containers are allowed to communicate over the network"
      - "It is a Docker-specific alias for .gitignore with no independent effect"
    answer: 0
    explanation: ".dockerignore works like .gitignore but for the Docker build context: excluding things like local dependency folders, build artifacts, or .git history keeps the amount of data sent to the Docker build process smaller (faster builds) and prevents accidentally copying unwanted or sensitive files into the image via a broad COPY."
  - type: multiple_choice
    difficulty: 1
    text: "What is the purpose of 'docker-compose' (or the 'docker compose' CLI plugin)?"
    options:
      - "Define and run multi-container applications using a single declarative configuration file"
      - "Compile Dockerfiles into standalone executables"
      - "Convert a container directly into a virtual machine image"
      - "Automatically write Dockerfiles by analyzing existing source code"
    answer: 0
    explanation: "A docker-compose.yml file declares a set of services (each typically one container), their images/build instructions, networking, volumes, and dependencies between them, letting the whole multi-container application be started, stopped, and rebuilt together with simple commands like 'docker compose up'."
  - type: multiple_choice
    difficulty: 2
    text: "In a docker-compose.yml file, what does the 'depends_on' setting between two services control?"
    options:
      - "The startup order — the depended-on service's container is started before the dependent service's container (though not necessarily 'ready' yet)"
      - "Which service is allowed to consume more CPU"
      - "Whether a service's image is rebuilt automatically on every run"
      - "It has no actual effect and is purely documentation"
    answer: 0
    explanation: "depends_on controls only container start order, not full application readiness — a database container being 'started' doesn't mean the database process inside is actually ready to accept connections yet, which is why applications (or a dedicated healthcheck/wait mechanism) often still need their own retry/wait logic even when depends_on is configured correctly."
  - type: multiple_choice
    difficulty: 3
    text: "What is the default Docker network driver used when you run a container without specifying '--network', and what does it provide?"
    options:
      - "The 'bridge' driver, which gives the container its own private IP on an internal virtual network, isolated from the host's network by default"
      - "The 'host' driver, which shares the host machine's network stack directly"
      - "The 'none' driver, meaning the container has no networking at all"
      - "Docker always requires you to manually create a network before running any container"
    answer: 0
    explanation: "The default bridge network gives each container its own network namespace and private IP, communicating with the outside world through Docker's virtual bridge and NAT rules; ports must be explicitly published ('-p') to be reachable from the host, unlike the 'host' network mode which shares the host's networking stack directly (and thus doesn't need explicit port publishing, but also loses network isolation)."
  - type: multiple_choice
    difficulty: 3
    text: "What is the practical benefit of Docker's 'host' network mode compared to the default bridge mode?"
    options:
      - "It removes the network isolation/NAT overhead by sharing the host's network stack directly, which can be useful for performance-sensitive networking, at the cost of losing per-container network isolation"
      - "It automatically encrypts all outgoing traffic"
      - "It allows the container to run without a Docker daemon at all"
      - "It is required for any container that needs to expose a port"
    answer: 0
    explanation: "With host networking, the container listens directly on the host's actual network interfaces (no port mapping/NAT translation needed, and no private container IP), which can reduce networking overhead, but it also means the container can potentially bind to any host port and loses the network isolation that bridge networking provides by default."
  - type: multiple_choice
    difficulty: 2
    text: "Why do many minimal production Docker images use an 'alpine' base image?"
    options:
      - "Alpine Linux is a very small, minimal distribution, resulting in a smaller final image size and reduced attack surface"
      - "Alpine images run measurably faster CPU instructions than any other Linux distribution"
      - "Alpine is the only base image that supports networking"
      - "Alpine images cannot be used in production environments"
    answer: 0
    explanation: "Alpine-based images are often only a few megabytes (versus hundreds of megabytes for a full distribution like Ubuntu), which speeds up image pulls/pushes and reduces the surface exposed to potential vulnerabilities — though Alpine's use of musl libc instead of glibc occasionally causes subtle compatibility issues with some compiled dependencies, worth being aware of."
  - type: multiple_choice
    difficulty: 3
    text: "Why is it considered a security best practice to avoid running a container's main process as the root user?"
    options:
      - "If an attacker manages to escape the containerized process, running as a non-root user limits what they can do both inside the container and, in some escape scenarios, on the host"
      - "Root is not permitted to be used inside any Docker container, so this is enforced automatically"
      - "Non-root processes always run measurably faster than root processes"
      - "This only matters for Windows containers, never for Linux containers"
    answer: 0
    explanation: "Containers share the host's kernel, so certain container-escape vulnerabilities can potentially grant host-level privileges matching whatever privilege the escaping process had inside the container; running as a dedicated non-root user (via a USER instruction in the Dockerfile) is a defense-in-depth measure limiting the blast radius if such an escape or in-container compromise occurs."
  - type: multiple_choice
    difficulty: 2
    text: "What does 'docker ps' show by default?"
    options:
      - "Currently running containers"
      - "All images ever pulled or built, regardless of container state"
      - "The contents of the Docker build cache"
      - "A list of available Docker Hub repositories"
    answer: 0
    explanation: "'docker ps' lists running containers with their ID, image, status, and ports; 'docker ps -a' additionally includes stopped/exited containers, and 'docker images' (a different command) lists images rather than containers."
  - type: multiple_choice
    difficulty: 2
    text: "What does 'docker exec -it <container> bash' let you do?"
    options:
      - "Open an interactive shell session inside an already-running container"
      - "Start a brand-new container from an image and immediately delete it afterward"
      - "Permanently modify the image the container was created from"
      - "Copy files from the container to the host"
    answer: 0
    explanation: "'exec' runs an additional command inside an already-running container's namespace; '-it' allocates an interactive terminal, so 'docker exec -it <container> bash' effectively gives you a shell inside the live container for debugging/inspection, without stopping or restarting it."
  - type: multiple_choice
    difficulty: 3
    text: "What is the key difference between 'docker stop' and 'docker kill'?"
    options:
      - "'docker stop' sends a graceful termination signal (SIGTERM) and waits for a timeout before forcing termination; 'docker kill' immediately force-terminates the container (SIGKILL)"
      - "'docker kill' only works on containers that have already stopped"
      - "'docker stop' permanently deletes the container's image"
      - "They are exact synonyms in every version of Docker"
    answer: 0
    explanation: "'docker stop' gives the container's main process a chance to shut down cleanly (e.g. flush buffers, close connections) via SIGTERM, only sending SIGKILL after a grace period (default 10 seconds) if it hasn't exited; 'docker kill' skips straight to SIGKILL, immediately terminating the process without giving it any chance to clean up."
  - type: multiple_choice
    difficulty: 2
    text: "What happens to a container's writable layer (and any data written there) when the container is removed with 'docker rm'?"
    options:
      - "It is permanently deleted, unless that data lived in a mounted volume or bind mount instead"
      - "It is automatically converted into a new image"
      - "It is preserved indefinitely on disk regardless of any other action"
      - "It is automatically pushed to Docker Hub"
    answer: 0
    explanation: "A container's own writable layer is ephemeral and tied to that specific container's lifecycle; removing the container discards it entirely, which is exactly why any data meant to persist beyond a single container's life (databases, uploaded files) should be stored in a volume or bind mount instead of the container's own filesystem."
  - type: multiple_choice
    difficulty: 3
    text: "What does a container 'restart policy' (e.g. 'unless-stopped', 'always', 'on-failure') control?"
    options:
      - "Whether and under what conditions Docker automatically restarts a container if it stops or the Docker daemon restarts"
      - "How often the container's image is automatically rebuilt"
      - "How frequently the container's logs are rotated"
      - "Which network the container reconnects to after a restart"
    answer: 0
    explanation: "A restart policy tells the Docker daemon how to react to a container exiting: 'on-failure' restarts only on a non-zero exit code, 'always' restarts unconditionally (including after a Docker daemon/host reboot) unless explicitly stopped, and 'unless-stopped' behaves like 'always' but respects an explicit manual stop, not restarting it after the daemon comes back up if it was deliberately stopped before that."
  - type: multiple_choice
    difficulty: 2
    text: "What is a container registry (such as Docker Hub)?"
    options:
      - "A storage and distribution service for Docker images, letting you push images to share and pull them down on other machines"
      - "A tool for monitoring a container's CPU and memory usage"
      - "A built-in Docker feature for encrypting network traffic"
      - "A synonym for a Dockerfile"
    answer: 0
    explanation: "A registry hosts images under repository names and tags; 'docker push' uploads a locally built image to a registry, and 'docker pull' downloads an image from a registry — Docker Hub is the default public registry, though private/self-hosted registries are also common, especially in enterprise settings."
  - type: multiple_choice
    difficulty: 2
    text: "In an image reference like 'myapp:1.2.0', what does the part after the colon represent?"
    options:
      - "The image tag, typically used to identify a specific version or variant of the image"
      - "The exact port the container will listen on"
      - "The size limit of the image in megabytes"
      - "The username of whoever built the image"
    answer: 0
    explanation: "Tags let a single image name have multiple versions/variants available in a registry (e.g. 'node:20', 'node:20-alpine', 'node:latest'); omitting a tag defaults to 'latest', which — despite the name — is just a conventional tag and not guaranteed to always be the most recently published version unless the maintainer keeps it updated that way."
  - type: multiple_choice
    difficulty: 4
    text: "Why is relying on the ':latest' tag considered risky for reproducible deployments?"
    options:
      - "'latest' is just a movable tag that different builds may point to different underlying image content over time, so the same 'myapp:latest' reference can silently resolve to different actual images at different times"
      - "'latest' images are always significantly larger in file size than versioned images"
      - "The 'latest' tag cannot be pulled from private registries"
      - "Using 'latest' is a compile-time error in Docker"
    answer: 0
    explanation: "Because tags are just labels that can be reassigned to point at a new image at any time, deploying 'myapp:latest' today and again next month could pull two genuinely different images without any explicit indication of that change — pinning to a specific, immutable version tag (or content digest) is the standard fix for genuinely reproducible builds/deployments."
  - type: multiple_choice
    difficulty: 3
    text: "What is a health check in Docker (the HEALTHCHECK instruction, or a compose 'healthcheck' entry) used for?"
    options:
      - "Periodically running a command inside the container to determine whether the application is actually functioning correctly, beyond just 'the process is running'"
      - "Checking whether the host machine has enough free disk space before pulling an image"
      - "Automatically fixing bugs found in the application's source code"
      - "Verifying the Dockerfile's syntax before building"
    answer: 0
    explanation: "A running process doesn't necessarily mean the application inside is actually healthy (e.g. a web server process could be running but deadlocked, or a database still initializing); a health check command (like curling a /health endpoint) lets Docker/orchestration tools report and react to a more meaningful notion of 'is this container actually ready and working', which matters especially for things like load balancer readiness or dependent-service startup ordering."
  - type: multiple_choice
    difficulty: 1
    text: "What command builds a Docker image from a Dockerfile in the current directory, tagging it 'myapp:1.0'?"
    options:
      - "docker build -t myapp:1.0 ."
      - "docker run -t myapp:1.0 ."
      - "docker pull myapp:1.0"
      - "docker exec -t myapp:1.0 ."
    answer: 0
    explanation: "'docker build' reads a Dockerfile (by default named 'Dockerfile' in the given build context directory) and executes its instructions to produce a new image; '-t' assigns it a name:tag, and the trailing '.' specifies the current directory as the build context sent to the Docker daemon."
  - type: multiple_choice
    difficulty: 2
    text: "What is the general difference between using Docker alone versus using an orchestrator like Kubernetes on top of it?"
    options:
      - "Docker runs and manages individual containers on a single machine; an orchestrator manages containers across many machines, handling scheduling, scaling, self-healing, and networking between them automatically"
      - "Kubernetes replaces Docker's image format entirely and cannot run any Docker-built image"
      - "Orchestrators are only used for containers that don't expose any network ports"
      - "There is no practical difference; they solve the exact same problem"
    answer: 0
    explanation: "Docker (and the underlying container runtime) is concerned with building and running individual containers; an orchestrator sits a layer above, deciding which of potentially many machines a container should run on, restarting failed containers automatically, scaling the number of replicas up/down, and managing networking/service discovery across the whole cluster — problems that become important once you're running more containers than fit comfortably on one machine."
  - type: multiple_choice
    difficulty: 2
    text: "What does 'docker logs <container>' show?"
    options:
      - "The standard output/error streams captured from the container's main process since it started"
      - "The full history of every Docker command ever run on the host"
      - "The contents of the container's filesystem"
      - "A list of every image ever pulled to the host"
    answer: 0
    explanation: "By default, Docker captures whatever a container's main process writes to stdout/stderr; 'docker logs' surfaces that captured output, which is why containerized applications are typically configured to log to stdout/stderr rather than to a file inside the container, so this captured log stream actually contains something useful."
  - type: multiple_choice
    difficulty: 3
    text: "Why is it generally recommended for a containerized application to log to stdout/stderr rather than to a log file inside the container?"
    options:
      - "Docker automatically captures stdout/stderr for retrieval via 'docker logs' or forwarding to external logging systems, while a log file inside a disposable container's writable layer is lost when the container is removed"
      - "Writing to stdout is measurably faster at the CPU instruction level than writing to any file"
      - "Docker containers are physically incapable of writing files to their own filesystem"
      - "Log files inside a container are automatically encrypted, which is considered undesirable"
    answer: 0
    explanation: "Since containers are meant to be disposable and their writable layer is ephemeral, logs written only to an internal file disappear along with the container unless specifically persisted via a volume; logging to stdout/stderr instead lets Docker's own logging drivers capture and optionally forward that output to external log aggregation systems uniformly, regardless of what's running inside."
  - type: multiple_choice
    difficulty: 4
    text: "What is the general purpose of Linux namespaces and cgroups in how containers achieve isolation, at a conceptual level?"
    options:
      - "Namespaces isolate what a process can see (its own view of processes, network, filesystem mounts, etc.); cgroups limit and account for the resources (CPU, memory) a process or group of processes can use"
      - "Namespaces limit CPU/memory usage; cgroups isolate what a process can see"
      - "They are two different names for the exact same Linux kernel feature"
      - "Neither has anything to do with how containers are implemented"
    answer: 0
    explanation: "These are the two core Linux kernel primitives underlying container isolation: namespaces (PID, network, mount, user, etc.) give a process a restricted, isolated view of the system (it can't see other containers' processes, has its own network stack, etc.), while cgroups (control groups) enforce resource limits and accounting, preventing one container from monopolizing the host's CPU or memory — together they provide the illusion of an isolated machine without the overhead of full hardware virtualization."
  - type: multiple_choice
    difficulty: 2
    text: "What is the effect of the '--rm' flag on 'docker run --rm myimage'?"
    options:
      - "The container is automatically removed (its writable layer discarded) as soon as it exits"
      - "The image is deleted from the local machine after the container starts"
      - "The container runs with no resource limits at all"
      - "The container is prevented from writing to any file"
    answer: 0
    explanation: "'--rm' is convenient for short-lived, one-off containers (e.g. running a quick script or test) where you don't want leftover stopped containers accumulating and cluttering 'docker ps -a' output after every run."
  - type: multiple_choice
    difficulty: 3
    text: "In a docker-compose.yml file, what does defining a custom top-level 'networks' section typically let multiple services do?"
    options:
      - "Communicate with each other using their service names as hostnames, resolved automatically via Docker's built-in DNS on that network"
      - "Share the exact same filesystem automatically"
      - "Bypass the need for any port publishing under any circumstances"
      - "Automatically load-balance traffic across every container on the host"
    answer: 0
    explanation: "Services attached to the same custom Docker network can reach each other simply by service name (e.g. an app service connecting to 'db:5432'), since Docker provides automatic DNS resolution for container/service names within a shared network — this is why compose setups rarely need to hardcode container IP addresses."
  - type: multiple_choice
    difficulty: 3
    text: "What does 'docker inspect <container>' provide that 'docker ps' does not?"
    options:
      - "Detailed, low-level JSON metadata about the container's configuration, network settings, mounts, and state"
      - "A live interactive shell inside the container"
      - "A summary of application-level errors logged by the process inside the container"
      - "A list of every image ever built on the host machine"
    answer: 0
    explanation: "'docker ps' gives a brief, human-scannable summary line per container; 'docker inspect' dumps the full underlying JSON configuration and runtime state Docker maintains for that container — useful for scripting, debugging networking/mount issues, or checking exact environment variable values."
