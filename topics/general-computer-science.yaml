name: General computer science
category: Computer Science
difficulty: medium
ai_generate: true
is_informational: true
content: |
  General computer culture: networking fundamentals (IP, TCP, UDP, DNS, HTTP/HTTPS),
  operating systems concepts (thread vs process, RAM vs storage, caching), how code
  becomes a running program (compilers vs interpreters), data representation
  (binary, hex, ASCII/Unicode), and a few well-known anecdotes from computing history.
manual_facts:
  - title: "Thread vs Process"
    description: "A process is an independent running program with its own private memory space; a thread is a unit of execution that lives inside a process and shares that process's memory with other threads of the same process. Spawning a new process is heavier (separate memory, needs inter-process communication to share data) while spawning a thread is lighter but riskier, since bugs in one thread (like a bad write) can corrupt memory used by other threads in the same process."
    link: "https://en.wikipedia.org/wiki/Thread_(computing)"
  - title: "What is TCP?"
    description: "TCP (Transmission Control Protocol) is a connection-oriented protocol that guarantees reliable, ordered delivery of data between two machines: it establishes a connection (the famous three-way handshake), retransmits lost packets, and reassembles data in the correct order. This reliability comes at the cost of extra overhead and latency, which is why TCP is used for things like web pages, file transfers, and emails where correctness matters more than raw speed."
    link: "https://en.wikipedia.org/wiki/Transmission_Control_Protocol"
  - title: "What is UDP?"
    description: "UDP (User Datagram Protocol) is a connectionless protocol that sends packets ('datagrams') without establishing a connection, acknowledging receipt, or guaranteeing order or delivery. It has far less overhead than TCP, which makes it the protocol of choice for real-time applications like video calls, live streaming, and online games, where a dropped packet is less harmful than the delay caused by waiting for a retransmission."
    link: "https://en.wikipedia.org/wiki/User_Datagram_Protocol"
  - title: "TCP vs UDP: how to choose"
    description: "TCP trades speed for reliability (ordered, guaranteed delivery, connection-based), while UDP trades reliability for speed (no ordering or delivery guarantees, no connection setup). Choose TCP when correctness matters more than latency (file downloads, web browsing, email); choose UDP when low latency matters more than occasional data loss (voice/video calls, multiplayer games, DNS lookups)."
    link: "https://en.wikipedia.org/wiki/Transmission_Control_Protocol#Comparison_of_TCP_and_UDP"
  - title: "What does RAM actually do?"
    description: "RAM (Random Access Memory) is the computer's fast, short-term working memory: the CPU reads and writes data here while a program is running, because RAM is orders of magnitude faster than an SSD or hard disk. Unlike storage, RAM is volatile — its contents are lost when the power goes off, which is why an unsaved document disappears if the computer crashes or shuts down."
    link: "https://en.wikipedia.org/wiki/Random-access_memory"
  - title: "What is an IP address?"
    description: "An IP address is a numeric label assigned to a device on a network so other devices know where to send data to reach it, similar to a postal address. IPv4 addresses (e.g. 192.168.1.1) use 32 bits and are running out of unique combinations, which is why the internet is gradually moving to IPv6, which uses 128 bits and offers an enormously larger address space."
    link: "https://en.wikipedia.org/wiki/IP_address"
  - title: "What does DNS do?"
    description: "DNS (Domain Name System) is often called 'the phone book of the internet': it translates human-friendly domain names like wikipedia.org into the numeric IP address a computer actually needs to connect to. Without DNS, you'd have to memorize IP addresses instead of names to visit any website."
    link: "https://en.wikipedia.org/wiki/Domain_Name_System"
  - title: "HTTP vs HTTPS"
    description: "HTTP (HyperText Transfer Protocol) is the protocol browsers use to request and receive web pages, but it sends data in plain text, so anyone intercepting the connection can read or tamper with it. HTTPS adds a layer of encryption (TLS/SSL) on top of HTTP, so the data exchanged between browser and server is scrambled in transit, protecting passwords, payment details, and other sensitive information from eavesdroppers."
    link: "https://en.wikipedia.org/wiki/HTTPS"
  - title: "Compiler vs interpreter"
    description: "A compiler translates an entire program's source code into machine code (or another lower-level form) ahead of time, producing a standalone executable that can be run directly; an interpreter instead reads and executes source code line by line, without producing a separate executable. Compiled languages (like C or Rust) tend to run faster since translation happens once upfront, while interpreted languages (like Python or JavaScript) tend to be faster to develop and test since there's no separate build step."
    link: "https://en.wikipedia.org/wiki/Interpreter_(computing)"
  - title: "Why computers use binary"
    description: "Computers represent all data — numbers, text, images, sound — as sequences of bits (0s and 1s) because digital circuits are built from transistors that are most reliably operated as simple on/off switches, rather than trying to distinguish many different voltage levels. Every file, no matter how complex it looks, ultimately reduces to a very long sequence of these two states."
    link: "https://en.wikipedia.org/wiki/Binary_number"
  - title: "What is hexadecimal, and why programmers use it"
    description: "Hexadecimal (base 16, digits 0-9 then A-F) is popular in programming because each hex digit maps exactly to 4 binary bits, making it a compact, human-readable shorthand for binary data — a full byte (8 bits) is always exactly 2 hex digits. This is why you'll see hex used for color codes (#FF5733), memory addresses, and MAC addresses."
    link: "https://en.wikipedia.org/wiki/Hexadecimal"
  - title: "ASCII and Unicode"
    description: "ASCII is an early character-encoding standard that maps 128 values to letters, digits, and symbols used in English, using just 7 bits per character. Unicode was created to support virtually every writing system in the world (and emoji), assigning a unique number to over 140,000 characters; UTF-8, the most common Unicode encoding on the web, cleverly stays backward-compatible with ASCII for the first 128 characters while using more bytes for everything else."
    link: "https://en.wikipedia.org/wiki/Unicode"
  - title: "What is caching?"
    description: "A cache is a smaller, faster storage layer that keeps a copy of frequently accessed data close at hand, so future requests for that data can be served quickly instead of recomputing it or fetching it from a slower source. Caches exist at almost every layer of computing: CPU caches (L1/L2/L3) sit between the processor and RAM, browsers cache web pages and images, and databases and CDNs cache query results and files closer to the end user."
    link: "https://en.wikipedia.org/wiki/Cache_(computing)"
  - title: "CPU vs GPU"
    description: "A CPU (Central Processing Unit) has a small number of powerful cores optimized for executing a wide variety of sequential tasks quickly, one after another. A GPU (Graphics Processing Unit) has thousands of much simpler cores optimized for doing the same simple operation on massive amounts of data simultaneously, which is why GPUs excel at rendering graphics and, more recently, at training AI models — both are fundamentally the same kind of massively repeated, parallel arithmetic."
    link: "https://en.wikipedia.org/wiki/Graphics_processing_unit"
  - title: "What is version control (and why Git specifically)"
    description: "Version control systems track every change made to a codebase over time, letting developers see history, revert mistakes, and work on the same project in parallel without overwriting each other's work. Git, created by Linus Torvalds in 2005 (originally to manage the Linux kernel's own source code after a licensing dispute with the tool they were using), became the dominant version control system because it's distributed — every developer has a full copy of the project's history locally, not just a pointer to a central server."
    link: "https://en.wikipedia.org/wiki/Git"
  - title: "Moore's Law"
    description: "Moore's Law is the 1965 observation by Intel co-founder Gordon Moore that the number of transistors on a computer chip roughly doubles every two years, driving exponential growth in computing power at falling cost. It was never a law of physics, just an industry trend — and in recent years it has visibly slowed down as transistors approach physical limits at the atomic scale, pushing the industry toward other ways of gaining performance (multiple cores, specialized chips like GPUs)."
    link: "https://en.wikipedia.org/wiki/Moore%27s_law"
  - title: "The first computer 'bug' was a real insect"
    description: "In 1947, engineers working on the Harvard Mark II computer found a moth trapped in one of its electromechanical relays, causing a malfunction; they taped the moth into the logbook with the note 'first actual case of bug being found.' The word 'bug' for a technical fault already existed in engineering slang before this (attributed even to Edison), but this incident is the most famous and literal origin story tied to computing."
    link: "https://en.wikipedia.org/wiki/Software_bug#Etymology"
  - title: "The Y2K bug"
    description: "Many older programs stored years using only two digits (e.g. '99' for 1999) to save scarce memory and storage space, which meant the year 2000 risked being misread as 1900, potentially breaking date calculations across banking, government, and infrastructure systems. The anticipated 'Y2K bug' triggered a massive, largely successful global remediation effort in the late 1990s — and because the feared disasters mostly didn't happen, some people later wrongly concluded the whole thing had been overblown hype rather than the result of genuine preventive work."
    link: "https://en.wikipedia.org/wiki/Year_2000_problem"
  - title: "Where the internet actually started"
    description: "The direct ancestor of the internet is ARPANET, a US Department of Defense research network that sent its first message between two computers in 1969. The internet as we use it today only became widely accessible to the public in the early-to-mid 1990s, once the World Wide Web (invented by Tim Berners-Lee in 1989 at CERN) gave it a friendly, browsable interface of pages and hyperlinks on top of the existing network infrastructure."
    link: "https://en.wikipedia.org/wiki/ARPANET"
  - title: "What hashing is (and isn't)"
    description: "A hash function takes an input of any size and produces a fixed-length output (a 'hash' or 'digest'), designed so the same input always produces the same hash, small changes to the input produce a very different hash, and — for a good cryptographic hash function — it's practically impossible to reverse the hash back into the original input. This is why hashing, not encryption, is used to store passwords: the system only ever needs to compare hashes, and never needs to recover the original password at all."
    link: "https://en.wikipedia.org/wiki/Hash_function"
  - title: "Latency vs bandwidth"
    description: "Bandwidth is how much data can be transferred per unit of time (the 'width of the pipe'), while latency is how long a single piece of data takes to make the trip from sender to receiver (the 'delay before the pipe starts flowing'). A connection can have huge bandwidth but still feel sluggish if latency is high — this is why online games and video calls care enormously about low latency, while large file downloads mostly care about high bandwidth."
    link: "https://en.wikipedia.org/wiki/Network_delay"
