  - type: single_word
    difficulty: 2
    text: "What is the one-word term for downloading a repository's history and files to your local machine for the first time?"
    answer: "clone"
    explanation: "'git clone' is a one-time operation that creates a full local copy of a remote repository, including its history and a configured 'origin' remote; subsequent updates use 'fetch'/'pull' instead of cloning again."
  - type: open_answer
    difficulty: 2
    text: "Explain the difference between 'git fetch' and 'git pull', and describe a situation where you would prefer to fetch rather than pull."
    answer: "'git fetch' downloads new commits and updates remote-tracking branches (like origin/main) without touching your current branch or working tree; 'git pull' does a fetch and then immediately merges (or rebases) those changes into your current branch. You'd prefer fetch when you want to inspect incoming changes first (e.g. with 'git log main..origin/main' or 'git diff') before deciding how to integrate them, rather than merging blindly."
    explanation: "Fetch is the safe, inspect-first option since it never modifies your working branch; pull is the convenient one-step option but can surprise you with an automatic merge (and possibly a conflict) you weren't expecting, especially if your local branch has diverged."
  - type: open_answer
    difficulty: 3
    text: "Explain what a 'fast-forward' merge is, and why Git can sometimes avoid creating a merge commit entirely."
    answer: "A fast-forward merge happens when the branch being merged in is a direct descendant of the current branch, meaning the current branch has no commits of its own since they diverged. In that case, merging doesn't require combining two divergent histories — Git can simply move the current branch's pointer forward to the other branch's tip, since all of its commits already come after the current tip in a straight line, so no separate merge commit is needed."
    explanation: "A merge commit (with two parents) is only necessary to represent the joining of two lines of history that actually diverged; if one side is simply 'ahead' with no competing changes, moving the pointer preserves a perfectly accurate, and simpler, linear history."
  - type: open_answer
    difficulty: 3
    text: "Explain the practical risk of running 'git push --force' on a branch that other people are also working from, and describe a safer alternative command."
    answer: "Force-pushing overwrites the remote branch's history with your local history, discarding any commits that were pushed by others in the meantime (or that exist on the remote but not locally), causing them to silently disappear from the branch for anyone who pulls afterward. A safer alternative is 'git push --force-with-lease', which checks that the remote branch still matches what you last fetched before overwriting it, and refuses the push if someone else has pushed new commits you haven't seen — preventing an accidental overwrite of their work."
    explanation: "--force-with-lease adds a check that plain --force skips entirely: it verifies your local knowledge of the remote branch is up to date before allowing the destructive rewrite, turning a blind overwrite into a conditional one."
  - type: open_answer
    difficulty: 4
    text: "Explain why rewriting history that has already been pushed and pulled by teammates (via rebase or amend) is generally discouraged, and what the immediate symptom is for someone who already has the old commits."
    answer: "Rebasing or amending replaces old commits with new ones that have different hashes, even if the actual code changes are identical. Anyone who already pulled the original commits still has those old commits in their local history; when they fetch/pull again, Git sees the rewritten commits as unrelated to (or diverging from) what they already have, since they don't share the same hashes as an ancestor. This typically shows up as their branch appearing to have 'diverged', forcing them to either merge the two diverging histories (creating a messy duplicate merge) or manually reset/rebase onto the new history themselves."
    explanation: "This is exactly why the common rule is 'never rewrite history that's already shared' — locally, before pushing, rewriting is completely safe and often desirable for cleanliness; once others have built on top of a commit, that commit's identity effectively becomes fixed."
  - type: open_answer
    difficulty: 3
    text: "Explain what the Git staging area (index) is for, and why committing directly from the working directory without staging would be more limiting."
    answer: "The staging area is an intermediate snapshot between the working directory and the repository's history: 'git add' copies specific changes into it, and only what's staged becomes part of the next commit. Without a staging area, every commit would have to include every current change in the working directory as one all-or-nothing unit, making it impossible to split unrelated changes (e.g. a bugfix and an unrelated typo fix) into separate, focused commits without first manually reverting one of them."
    explanation: "The staging area is what makes commands like 'git add -p' (staging only specific hunks) possible, letting you shape exactly what goes into each commit, independent of what other uncommitted changes might also be sitting in your working directory at the same time."
  - type: open_answer
    difficulty: 4
    text: "Explain what the reflog is and describe, at a high level, how you could use it to recover commits that were lost after an accidental 'git reset --hard' to an earlier commit."
    answer: "The reflog is a local, chronological record of every position HEAD (and branches) have pointed to, including commits that later became unreachable from any branch. After an accidental hard reset, the commits you were on before are no longer reachable from any branch, but they still exist in the object database and are still referenced by an entry in the reflog. Running 'git reflog' lists these historical HEAD positions with their commit hashes; you can then run 'git reset --hard <hash>' (or create a new branch at that hash) using the hash shown for the point right before the accidental reset, restoring your branch to that state."
    explanation: "This works because Git doesn't immediately delete unreachable objects — they're only garbage-collected after an expiration period (commonly 90 days for unreachable objects), specifically to give this reflog-based recovery a real window to work in."
  - type: open_answer
    difficulty: 2
    text: "Explain the difference between 'git merge' and 'git rebase' in terms of the resulting commit history, and describe one advantage of each approach."
    answer: "Merge combines two branches by creating a new merge commit with two parents, preserving the exact history of both branches including when and how they diverged; its advantage is that it's non-destructive and safe even on already-shared history. Rebase replays your branch's commits one by one on top of another branch's tip, producing a clean, linear history with no merge commits; its advantage is a simpler, easier-to-read history, at the cost of generating new commit hashes and being unsafe to use on commits already shared with others."
    explanation: "Neither approach is universally 'correct' — many teams merge feature branches into a shared branch (safe, preserves context) while rebasing local, not-yet-shared work before pushing (keeps history clean before it becomes permanent for others)."
  - type: open_answer
    difficulty: 3
    text: "Explain the purpose of a pre-commit hook and give one concrete example of what it might check before allowing a commit to proceed."
    answer: "A pre-commit hook is a script Git runs automatically right before a commit is finalized, and if the script exits with a non-zero status, the commit is aborted. It's commonly used to enforce quality checks automatically rather than relying on developers to remember to run them manually. A concrete example: running a code formatter/linter on the staged files and rejecting the commit if there are formatting violations or lint errors, so badly-formatted code never enters the repository's history in the first place."
    explanation: "Because the hook runs locally before the commit exists, it's the earliest possible point to catch a problem — much cheaper than catching the same issue later in CI after the commit (and possibly a push) has already happened."
  - type: open_answer
    difficulty: 4
    text: "Explain, at a conceptual level, why two completely unrelated files with identical content in a Git repository only take up the storage of one blob."
    answer: "Git identifies objects (including blobs) by the SHA hash of their content, not by filename or path. Since the hash is computed purely from the file's bytes, two files with byte-for-byte identical content produce the exact same hash and are therefore represented by the exact same blob object in Git's object database. The tree objects for each directory simply reference that one blob by hash alongside the respective filename, so the content is effectively stored once and referenced twice, rather than being duplicated."
    explanation: "This content-addressable design is also why renaming a file 'for free' doesn't change any object — the blob's hash is unaffected by its name, only the tree entry (which records the name-to-hash mapping) changes, and why Git's storage is efficient even with many near-duplicate files across history."
  - type: open_answer
    difficulty: 2
    text: "Explain what a merge conflict marker (the '<<<<<<<', '=======', '>>>>>>>' lines) means when it appears in a file, and what you must do before the merge can be completed."
    answer: "These markers delimit the two competing versions of the same region of a file: the section between '<<<<<<<' and '=======' shows your current branch's version, and the section between '=======' and '>>>>>>>' shows the incoming branch's version, since Git couldn't automatically decide which one (or what combination) is correct. To complete the merge, you must manually edit the file to the version you actually want (removing the marker lines entirely), then stage the resolved file with 'git add', and finally run 'git commit' (or 'git merge --continue') to finish the merge."
    explanation: "Until every conflicted file is staged, Git considers the merge unfinished and will refuse to let you commit normally (or will remind you a merge is in progress), which is a deliberate safeguard against accidentally finalizing a merge with unresolved conflict markers still in the code."
  - type: open_answer
    difficulty: 3
    text: "Explain why 'git commit --amend' should generally not be used on a commit that has already been pushed to a shared remote branch."
    answer: "--amend replaces the previous commit entirely with a new one (new hash, potentially new message and/or content), rather than adding on top of it. If that commit was already pushed, anyone who pulled it now has the old version in their history; once you amend and push again, the remote branch's history diverges from what they have, and a normal push will be rejected (requiring a force-push), while their next pull will see the old and new versions as unrelated/conflicting rather than a simple continuation."
    explanation: "The underlying reason is the same as for rebasing shared history: amend rewrites rather than appends, so it's only safe when nobody else could possibly already depend on the specific commit being replaced."
  - type: open_answer
    difficulty: 4
    text: "Explain the tradeoff between GitFlow-style long-lived feature branches and trunk-based development with feature flags, in terms of merge complexity and deployability."
    answer: "Long-lived feature branches let developers work in isolation for extended periods, but the longer a branch lives without merging, the more it diverges from the main line, making the eventual merge larger, more conflict-prone, and riskier to review and test all at once. Trunk-based development instead requires developers to integrate small, frequent changes directly into a single shared branch, keeping merges trivial and history simple, but incomplete features must be hidden behind feature flags so that a broken or half-finished feature doesn't affect what's deployed, and the codebase must be robust enough to always be in a deployable state."
    explanation: "The core tradeoff is where the complexity is paid: GitFlow defers integration pain to occasional, large merge events, while trunk-based development front-loads a small amount of discipline (frequent small commits, feature flags, robust main branch) in exchange for avoiding those large, risky merges altogether."
  - type: open_answer
    difficulty: 2
    text: "Explain what happens to the commits made while in a 'detached HEAD' state if you check out a branch without first saving them, and how you could have prevented losing easy access to them."
    answer: "Commits made in detached HEAD have no branch pointing to them; once you check out a branch, HEAD moves away and those commits become unreachable from any branch, tag, or other reference (though not immediately deleted — they linger until eventually garbage-collected, and can still be found via the reflog for a while). To prevent this, you should create a new branch pointing at those commits (e.g. 'git switch -c new-branch-name') before checking out something else, which gives them a permanent reference so they remain part of normal, easily accessible history."
    explanation: "This is a very common beginner trap: checking out a specific commit (e.g. from 'git log' output) to look at old code, making changes there without realizing it's a detached state, and then losing easy access to those commits by switching branches without first creating one."
  - type: open_answer
    difficulty: 3
    text: "Explain the purpose of Git tags, and the difference between a lightweight tag and an annotated tag."
    answer: "Tags mark a specific commit with a memorable, permanent name, most commonly used to mark released versions (e.g. v1.0.0) so that specific point in history is easy to find and check out later, independent of whichever branch happens to still contain that commit. A lightweight tag is just a simple named pointer to a commit, with no extra data. An annotated tag is a full object in its own right, storing the tagger's name, email, date, and a message, and can optionally be GPG-signed — which is why annotated tags are generally recommended for actual releases."
    explanation: "Unlike branches, tags are not meant to move — once created, a tag should keep pointing at the same commit forever, which is what makes them reliable markers for 'this exact code is what we released as v1.0.0'."
  - type: open_answer
    difficulty: 3
    text: "Write the Git commands (in order) to create a new branch called 'feature/login' from the current branch, switch to it, and push it to the remote 'origin' while setting up tracking so future plain 'git push'/'git pull' work on that branch."
    answer: |
      ```bash
      git checkout -b feature/login
      git push -u origin feature/login
      ```
    explanation: "'checkout -b' creates and switches to the new branch in one step; 'push -u origin feature/login' (short for --set-upstream) pushes the branch and simultaneously configures it to track 'origin/feature/login', so subsequent 'git push'/'git pull' on this branch no longer need the remote and branch name spelled out explicitly."
  - type: open_answer
