name: Git & Version Control
category: Computer Science
difficulty: medium
ai_generate: true
content: |
  Git fundamentals: the repository model (working tree, staging area, commits),
  branching and merging, rebasing and history rewriting, remotes and
  collaboration workflows, conflict resolution, stashing, tags, hooks, and
  the underlying object model (blobs, trees, commits, the reflog).
manual_questions:
  - type: multiple_choice
    difficulty: 1
    text: "What does 'git init' do?"
    options:
      - "Creates a new, empty Git repository in the current directory"
      - "Uploads the current directory to a remote server"
      - "Downloads an existing repository from a URL"
      - "Deletes all commit history in the current repository"
    answer: 0
    explanation: "'git init' creates a new .git subdirectory containing all the metadata Git needs to track history, turning the current directory into a repository; it does not touch any remote or existing history."
  - type: multiple_choice
    difficulty: 1
    text: "What is the staging area (also called the index) in Git?"
    options:
      - "An intermediate area where changes are collected before being committed"
      - "A remote server that stores backup copies of commits"
      - "The folder where deleted files are moved before permanent removal"
      - "A cache of the last five commits for faster access"
    answer: 0
    explanation: "The staging area lets you build up a commit incrementally: 'git add' moves specific changes there, and only what's staged becomes part of the next 'git commit', letting you commit a subset of your working tree's changes."
  - type: multiple_choice
    difficulty: 1
    text: "Which command shows which files have been modified, staged, or are untracked?"
    options:
      - "git status"
      - "git log"
      - "git diff"
      - "git show"
    answer: 0
    explanation: "'git status' summarizes the state of the working tree and staging area relative to the last commit; 'git diff' shows the actual line-by-line changes, and 'git log' shows commit history instead."
  - type: multiple_choice
    difficulty: 2
    text: "What is the key difference between 'git fetch' and 'git pull'?"
    options:
      - "'git fetch' downloads new history without merging it; 'git pull' fetches and then merges (or rebases) into the current branch"
      - "'git fetch' only works on the first clone, 'git pull' works afterward"
      - "'git pull' downloads without merging, 'git fetch' merges automatically"
      - "They are exact synonyms"
    answer: 0
    explanation: "'git fetch' updates your local copies of remote-tracking branches (e.g. origin/main) without touching your current branch; 'git pull' is effectively 'git fetch' followed by a merge (or rebase, with --rebase) into the branch you're on."
  - type: multiple_choice
    difficulty: 2
    text: "What does 'HEAD' refer to in Git?"
    options:
      - "A pointer to the commit that the currently checked-out branch (or commit) is at"
      - "The very first commit ever made in the repository"
      - "The remote repository's default branch"
      - "A list of all branches in the repository"
    answer: 0
    explanation: "HEAD is a reference that normally points to the tip of the current branch; when you check out a specific commit directly rather than a branch, HEAD points straight at that commit instead, which is called a 'detached HEAD' state."
  - type: multiple_choice
    difficulty: 3
    text: "What happens when you're in a 'detached HEAD' state and make new commits, then check out a branch without first creating a new branch to save them?"
    options:
      - "The new commits become unreachable from any branch and are eventually garbage-collected unless referenced (e.g. via a new branch or the reflog)"
      - "The new commits are automatically merged into the branch you check out"
      - "Git refuses to let you check out another branch until you commit"
      - "The commits are automatically pushed to the remote for safekeeping"
    answer: 0
    explanation: "Commits made in detached HEAD aren't on any branch, so once you move HEAD elsewhere they have no reference pointing to them; they aren't deleted immediately, but they become unreachable and are eventually cleaned up by garbage collection unless you create a branch or tag pointing at them first (or recover them via the reflog in the meantime)."
  - type: multiple_choice
    difficulty: 2
    text: "Which command creates a new branch AND switches to it in one step?"
    options:
      - "git checkout -b <branch-name>"
      - "git branch <branch-name>"
      - "git merge <branch-name>"
      - "git commit -b <branch-name>"
    answer: 0
    explanation: "'git checkout -b <name>' (or the newer 'git switch -c <name>') creates the branch and checks it out immediately; 'git branch <name>' alone only creates it, leaving you on your current branch."
  - type: multiple_choice
    difficulty: 2
    text: "What is a 'fast-forward' merge?"
    options:
      - "A merge where the target branch's pointer is simply moved forward, since it has no divergent commits of its own"
      - "A merge that skips running any commit hooks"
      - "A merge that automatically resolves every conflict without user input"
      - "A merge performed by rebasing instead of the merge command"
    answer: 0
    explanation: "If the branch being merged in is a direct descendant of the current branch (no new commits were made on the current branch since they diverged), Git can just move the current branch's pointer forward to that commit, with no merge commit or conflict resolution needed."
  - type: multiple_choice
    difficulty: 3
    text: "What is the main structural difference between using 'git merge' and 'git rebase' to bring another branch's commits into yours?"
    options:
      - "Merge preserves the original commits and adds a merge commit tying histories together; rebase rewrites your commits to appear as if made on top of the other branch, producing a linear history"
      - "Rebase always creates a merge commit, while merge never does"
      - "Merge deletes the source branch automatically, rebase does not"
      - "There is no practical difference; they produce identical commit histories"
    answer: 0
    explanation: "Merge keeps both branches' history exactly as it happened and joins them with a new merge commit that has two parents; rebase instead replays your commits one by one on top of the target branch, giving new commit hashes and a straight-line history, at the cost of rewriting commits that may already be shared elsewhere."
  - type: multiple_choice
    difficulty: 4
    text: "Why is rebasing commits that have already been pushed and pulled by others generally discouraged?"
    options:
      - "Rebase creates new commits with different hashes, so anyone who already based work on the old commits will get diverging, duplicated, or conflicting history"
      - "Rebase permanently deletes the remote repository"
      - "Rebase is not supported once a branch has been pushed"
      - "Rebase automatically force-pushes to every remote configured"
    answer: 0
    explanation: "Because rebase rewrites commit history (new commit hashes replace the old ones), anyone else who has already pulled the original commits will find their local history has diverged from the rewritten one, typically requiring a forced sync or producing duplicated commits — hence the common rule 'never rebase shared/public history'."
  - type: multiple_choice
    difficulty: 2
    text: "What does 'git cherry-pick <commit>' do?"
    options:
      - "Applies the changes introduced by a specific commit from another branch onto the current branch, as a new commit"
      - "Deletes a specific commit from history everywhere"
      - "Picks a random commit to display in the log"
      - "Merges an entire branch, ignoring only the first commit"
    answer: 0
    explanation: "Cherry-pick takes just the diff introduced by one specific commit (not the whole branch it came from) and replays it as a new commit on your current branch, useful for pulling in a single bugfix without merging unrelated history."
  - type: multiple_choice
    difficulty: 3
    text: "What is the difference between 'git reset --soft', '--mixed', and '--hard' relative to a previous commit?"
    options:
      - "--soft keeps changes staged, --mixed keeps changes but unstages them, --hard discards the changes entirely"
      - "--soft discards everything, --mixed keeps only staged changes, --hard keeps only the working tree"
      - "They are three names for the exact same operation"
      - "--hard only affects remote branches, not the local one"
    answer: 0
    explanation: "All three move the current branch pointer to the target commit, but differ in what happens to the changes since then: --soft leaves them staged (ready to commit again), --mixed (the default) unstages them but keeps them in the working tree, and --hard discards them entirely, resetting the working tree to match the target commit exactly."
  - type: multiple_choice
    difficulty: 2
    text: "What is the key difference between 'git revert' and 'git reset' for undoing a commit?"
    options:
      - "'git revert' creates a new commit that undoes the changes, preserving history; 'git reset' moves the branch pointer, rewriting what the branch points to"
      - "'git reset' is always safe to use on shared/pushed branches, 'git revert' is not"
      - "'git revert' deletes the commit from history entirely, exactly like 'git reset --hard'"
      - "They are interchangeable in every situation"
    answer: 0
    explanation: "'git revert' adds a brand-new commit that applies the inverse of a previous commit's changes, which is safe on shared history since nothing is rewritten; 'git reset' instead moves the branch pointer (and optionally the working tree) to a different commit, which can rewrite what a shared branch points to if pushed."
  - type: multiple_choice
    difficulty: 2
    text: "What does 'git stash' do?"
    options:
      - "Temporarily saves uncommitted changes (staged and/or unstaged) so you can switch context, then restore them later"
      - "Permanently deletes uncommitted changes"
      - "Commits all changes immediately with an automatic message"
      - "Pushes uncommitted changes directly to the remote"
    answer: 0
    explanation: "'git stash' records the current state of the working directory and index and reverts them to match HEAD, letting you switch branches or pull cleanly; 'git stash pop' (or 'apply') later restores those changes."
  - type: multiple_choice
    difficulty: 3
    text: "What is the difference between 'git stash pop' and 'git stash apply'?"
    options:
      - "'pop' applies the stashed changes and removes that stash entry; 'apply' applies them but keeps the stash entry for later reuse"
      - "'apply' deletes the stash, 'pop' keeps it forever"
      - "They only differ in which branch they apply to"
      - "'pop' works on remote stashes, 'apply' only works locally"
    answer: 0
    explanation: "Both restore the stashed changes into your working tree, but 'pop' additionally removes that entry from the stash list once applied successfully, while 'apply' leaves the stash entry in place in case you want to apply the same changes again elsewhere."
  - type: multiple_choice
    difficulty: 1
    text: "What is the purpose of a .gitignore file?"
    options:
      - "It lists file patterns that Git should not track or show as untracked"
      - "It lists commits that should never be pushed"
      - "It stores the repository's commit history"
      - "It configures which branches can be merged into main"
    answer: 0
    explanation: ".gitignore lists file/folder patterns (e.g. build output, dependency folders, local secrets) that Git should ignore, so they never show up as untracked files or get accidentally committed."
  - type: multiple_choice
    difficulty: 2
    text: "What does 'git log --oneline' show compared to plain 'git log'?"
    options:
      - "A condensed one-line-per-commit summary (short hash + first line of the commit message)"
      - "Only the very first commit in the repository"
      - "The full diff for every commit"
      - "Only commits made in the last 24 hours"
    answer: 0
    explanation: "--oneline compresses each commit's log entry to a single line with its abbreviated hash and subject line, which is much easier to scan than the full author/date/message block plain 'git log' prints for every commit."
  - type: multiple_choice
    difficulty: 3
    text: "What does 'git bisect' help you do?"
    options:
      - "Binary-search through commit history to find the specific commit that introduced a bug"
      - "Split a single commit into two smaller commits"
      - "Merge two unrelated repositories together"
      - "Compare two remote repositories for differences"
    answer: 0
    explanation: "'git bisect' automates a binary search: you mark a known-good and a known-bad commit, and it checks out commits in between, letting you mark each as good or bad, narrowing down the exact commit that introduced a regression in roughly log2(n) steps instead of checking every commit."
  - type: multiple_choice
    difficulty: 4
    text: "What is the 'reflog' in Git, and what is it useful for?"
    options:
      - "A local log of where HEAD and branch tips have pointed over time, useful for recovering commits that seem 'lost' (e.g. after a hard reset)"
      - "A public log visible to everyone with access to the remote repository"
      - "A log of every line changed across all files in history"
      - "A record of all merge conflicts ever resolved"
    answer: 0
    explanation: "The reflog records every change to HEAD and branch references locally (commits, resets, checkouts, rebases...), even ones that are no longer reachable from any branch; since Git doesn't immediately garbage-collect unreachable commits, the reflog often lets you recover work you thought was lost after a 'git reset --hard' or a bad rebase."
  - type: multiple_choice
    difficulty: 2
    text: "What is the difference between a lightweight tag and an annotated tag in Git?"
    options:
      - "An annotated tag is a full object with its own message, author, and date; a lightweight tag is just a named pointer to a commit"
      - "A lightweight tag can point to multiple commits at once"
      - "An annotated tag automatically triggers a deployment"
      - "There is no functional difference between the two"
    answer: 0
    explanation: "A lightweight tag is essentially just a branch that never moves — a simple pointer to a commit. An annotated tag ('git tag -a') is a full Git object storing a tagger name, email, date, and message, and can be GPG-signed, which is why it's recommended for marking releases."
  - type: multiple_choice
    difficulty: 3
    text: "What does 'git commit --amend' do?"
    options:
      - "Modifies the most recent commit (message and/or staged changes) instead of creating a new one"
      - "Modifies any arbitrary commit in history by its hash"
      - "Un-commits and un-stages all changes since the last push"
      - "Creates an entirely new branch from the amended commit"
    answer: 0
    explanation: "--amend replaces the tip commit with a new one that combines the previous commit's changes with anything currently staged, and lets you edit the commit message; like rebase, it rewrites history, so amending a commit that's already been pushed and pulled by others is risky."
  - type: multiple_choice
    difficulty: 4
    text: "What does an interactive rebase ('git rebase -i') let you do that a normal rebase does not?"
    options:
      - "Reorder, squash, edit, drop, or reword individual commits as they're replayed"
      - "Rebase onto a remote branch instead of a local one"
      - "Skip conflict resolution entirely"
      - "Rebase multiple branches simultaneously in one command"
    answer: 0
    explanation: "Interactive rebase opens an editable list of the commits about to be replayed, where each line can be changed from 'pick' to actions like 'squash' (combine with the previous commit), 'reword' (edit the message), 'edit' (pause to amend), or 'drop' (remove it entirely) — giving fine-grained control over cleaning up commit history before sharing it."
  - type: multiple_choice
    difficulty: 2
    text: "What does 'squashing' commits mean, in the context of a pull request?"
    options:
      - "Combining multiple commits into a single commit, usually to keep the target branch's history clean"
      - "Deleting a branch without merging it"
      - "Automatically resolving every merge conflict"
      - "Splitting one large commit into several smaller ones"
    answer: 0
    explanation: "Squashing collapses a series of (often messy, work-in-progress) commits from a feature branch into one clean commit before or during merge, which many teams prefer for a tidier main-branch history, at the cost of losing the fine-grained intermediate history."
  - type: multiple_choice
    difficulty: 3
    text: "In a typical Git remote setup, what does 'origin' conventionally refer to?"
    options:
      - "The default name given to the remote repository a project was cloned from"
      - "The very first commit in the repository"
      - "A required, hardcoded name that cannot be changed"
      - "The name of the default local branch"
    answer: 0
    explanation: "'origin' is just a convention (the default remote name Git assigns on 'git clone') for the remote repository — it's a human-friendly alias for a URL, and can be renamed or you can add additional remotes (e.g. 'upstream') with different names."
  - type: multiple_choice
    difficulty: 3
    text: "In a fork-based workflow, what does 'upstream' conventionally refer to?"
    options:
      - "The original repository that was forked, as opposed to your own fork ('origin')"
      - "Any branch that has been merged into main"
      - "The remote branch you are currently pushing to"
      - "A required alias that Git creates automatically on every clone"
    answer: 0
    explanation: "When you fork a repository, 'origin' typically points to your own fork, while 'upstream' is manually added as an additional remote pointing back to the original repository, letting you fetch/pull updates from the project you forked from."
  - type: multiple_choice
    difficulty: 2
    text: "Why does 'git push --force' carry risk on a shared branch?"
    options:
      - "It can overwrite the remote branch's history, discarding commits that others may have already based work on"
      - "It permanently deletes the entire remote repository"
      - "It only works the very first time a branch is pushed"
      - "It automatically merges every open pull request"
    answer: 0
    explanation: "A regular push is rejected if it isn't a fast-forward of the remote branch (e.g. after a rebase changed history); --force overrides that safety check and replaces the remote branch's history outright, which can silently discard commits other collaborators already pulled and built on."
  - type: multiple_choice
    difficulty: 3
    text: "What does '--force-with-lease' do differently from a plain '--force' push?"
    options:
      - "It refuses to force-push if the remote branch has new commits you haven't seen yet, preventing you from accidentally overwriting someone else's work"
      - "It force-pushes to every remote configured for the repository at once"
      - "It skips the pre-push hook automatically"
      - "It behaves identically to --force in every case"
    answer: 0
    explanation: "--force-with-lease checks that the remote branch's current tip still matches what you last fetched before overwriting it; if someone else pushed in the meantime, the push is rejected instead of silently clobbering their commits, making it a safer alternative to a blind --force."
  - type: multiple_choice
    difficulty: 2
    text: "What is a merge conflict, fundamentally?"
    options:
      - "A situation where Git cannot automatically decide how to combine changes because the same lines were modified differently on both sides"
      - "An error that occurs whenever two different people commit on the same day"
      - "A permanent failure that requires deleting one of the branches"
      - "A warning that only appears when merging unrelated repositories"
    answer: 0
    explanation: "Git can merge non-overlapping changes automatically, but when the same region of a file was changed differently on both branches being merged, it can't decide which version is correct and marks the file as conflicted, leaving conflict markers for a human to resolve manually."
  - type: multiple_choice
    difficulty: 2
    text: "After resolving conflict markers in a file by hand, what must you do before completing the merge?"
    options:
      - "Stage the resolved file (git add) and then complete the merge commit"
      - "Delete the file and recreate it from scratch"
      - "Nothing further is needed; Git detects the resolution automatically"
      - "Force-push immediately to finalize the resolution"
    answer: 0
    explanation: "Editing the file to remove the conflict markers only changes the working tree; Git still considers the file conflicted until you explicitly 'git add' it to mark the conflict as resolved, after which 'git commit' (or 'git merge --continue') finalizes the merge."
  - type: multiple_choice
    difficulty: 4
    text: "What is a Git submodule?"
    options:
      - "A reference in one repository to a specific commit of another, entirely separate repository, checked out as a subdirectory"
      - "A folder that is automatically excluded from version control"
      - "A branch that can only contain configuration files"
      - "A built-in Git feature for splitting a monorepo into microservices at runtime"
    answer: 0
    explanation: "A submodule embeds another Git repository inside your own at a specific commit, useful for depending on external code you also want under version control separately; it's notorious for tripping people up because the submodule's checked-out commit doesn't update automatically when the parent repo is pulled."
  - type: multiple_choice
    difficulty: 3
    text: "What is a 'shallow clone' ('git clone --depth 1')?"
    options:
      - "A clone that only downloads the most recent commit(s), omitting the full history, to save time and bandwidth"
      - "A clone that only downloads the .gitignore file"
      - "A clone that skips downloading any files, only the folder structure"
      - "A clone that automatically deletes itself after use"
    answer: 0
    explanation: "--depth 1 fetches only the latest commit (and none of its ancestry), which is much faster and smaller for cases like CI pipelines that just need the current state of the code and don't need full history — at the cost of most history-dependent operations (like full log or bisect) not working properly."
  - type: multiple_choice
    difficulty: 2
    text: "What is the purpose of a Git hook, such as 'pre-commit'?"
    options:
      - "A script that Git runs automatically at a specific point in the workflow (e.g. before a commit is created), often to run checks or formatting"
      - "A keyboard shortcut for a common Git command"
      - "A remote server endpoint that receives push notifications"
      - "A way to permanently lock a branch from further commits"
    answer: 0
    explanation: "Hooks are scripts stored in .git/hooks that Git invokes automatically at defined points (pre-commit, pre-push, post-merge, etc.); a pre-commit hook commonly runs linters, formatters, or tests, and can reject the commit if it fails."
  - type: multiple_choice
    difficulty: 3
    text: "What does 'git blame <file>' show?"
    options:
      - "For each line in the file, which commit last modified it and who authored that commit"
      - "A list of every person who has ever cloned the repository"
      - "Which commit introduced the most bugs, based on issue tracker data"
      - "A diff between the file and its version on the remote"
    answer: 0
    explanation: "'git blame' annotates each line of a file with the commit hash, author, and date of the last change to that line, which is useful for understanding why a specific line exists or tracking down who to ask about it."
  - type: multiple_choice
    difficulty: 4
    text: "What are the three core object types that make up Git's underlying content model (besides tags)?"
    options:
      - "Blobs (file contents), trees (directory listings), and commits (snapshots with metadata)"
      - "Branches, remotes, and stashes"
      - "Repositories, working trees, and indexes"
      - "Pushes, pulls, and fetches"
    answer: 0
    explanation: "A blob stores a file's raw content, a tree records a directory's structure (mapping names to blobs/other trees), and a commit points to a tree plus metadata (author, message, parent commit(s)) — together these form Git's content-addressable object database, where every object is identified by the hash of its content."
  - type: multiple_choice
    difficulty: 2
    text: "What is a merge commit's defining structural feature?"
    options:
      - "It has two (or more) parent commits instead of the usual single parent"
      - "It cannot contain any file changes of its own"
      - "It is always the very first commit in a repository"
      - "It must always be tagged"
    answer: 0
    explanation: "Ordinary commits have exactly one parent (the previous commit on that branch); a merge commit records two (or more) parents, representing the point where two independent lines of history were joined back together."
  - type: multiple_choice
    difficulty: 2
    text: "Which command lets you see the exact line-by-line changes between your working directory and the last commit?"
    options:
      - "git diff"
      - "git status"
      - "git log"
      - "git branch"
    answer: 0
    explanation: "'git diff' with no arguments shows unstaged changes as a unified diff; 'git diff --staged' shows staged changes instead; 'git status' only tells you which files changed, not the actual content differences."
  - type: multiple_choice
    difficulty: 3
    text: "What is the effect of running 'git checkout -- <file>' (or 'git restore <file>')?"
    options:
      - "It discards uncommitted changes to that file, restoring it to match the last commit"
      - "It permanently deletes the file from the repository"
      - "It stages the file for the next commit"
      - "It creates a new branch containing only that file"
    answer: 0
    explanation: "This discards any unstaged modifications to the given file, reverting it to the version in the index/last commit — it's a destructive operation on uncommitted work, so it's worth double-checking the filename before running it."
  - type: multiple_choice
    difficulty: 3
    text: "What does the '.git' directory contain?"
    options:
      - "All of the repository's metadata and history: objects, refs, configuration, and hooks — everything that makes it a Git repository"
      - "Only the .gitignore file"
      - "A compressed backup of the remote repository's web server"
      - "Nothing; it's an empty marker folder"
    answer: 0
    explanation: "The .git folder is the actual repository: it holds the object database (commits, trees, blobs), references (branches, tags), the index (staging area), configuration, and hooks. The rest of the project directory is just the working tree — a checked-out snapshot of one commit's content."
  - type: multiple_choice
    difficulty: 2
    text: "What is the difference between 'git branch' and 'git branch -a'?"
    options:
      - "Plain 'git branch' lists only local branches; '-a' additionally lists remote-tracking branches"
      - "'-a' deletes all branches at once"
      - "Plain 'git branch' lists remote branches only"
      - "They are identical; '-a' has no effect"
    answer: 0
    explanation: "'git branch' by default only shows local branches; adding '-a' (all) also lists remote-tracking branches (like origin/main, origin/feature-x), which are read-only local references to the state of branches on the remote as of the last fetch."
  - type: multiple_choice
    difficulty: 1
    text: "What does 'git clone <url>' do?"
    options:
      - "Downloads a full copy of a remote repository, including its history, into a new local directory"
      - "Creates a completely empty new repository with no connection to any remote"
      - "Uploads your current local repository to a new remote"
      - "Only downloads the latest file contents, discarding all history"
    answer: 0
    explanation: "Clone copies the entire repository (by default, full history) from the given URL into a new local directory, and automatically sets up a remote named 'origin' pointing back to the source."
  - type: multiple_choice
    difficulty: 3
    text: "What is a 'tracking branch' in Git?"
    options:
      - "A local branch configured to have a direct relationship with a specific remote branch, enabling plain 'git push'/'git pull' without specifying the remote and branch each time"
      - "A branch that automatically records every keystroke made while editing"
      - "A branch used exclusively for tagging releases"
      - "A branch that cannot be deleted once created"
    answer: 0
    explanation: "A tracking (or 'upstream') branch links a local branch to a remote counterpart (e.g. local 'main' tracking 'origin/main'), so Git knows what to compare against for 'ahead/behind' status and which remote branch a bare 'git push'/'git pull' should target."
  - type: multiple_choice
    difficulty: 4
    text: "What is the practical benefit of 'git worktree'?"
    options:
      - "It lets you check out multiple branches of the same repository into separate directories simultaneously, without needing multiple clones"
      - "It automatically formats code according to a style guide"
      - "It merges the working trees of two different repositories into one"
      - "It replaces the need for a .gitignore file"
    answer: 0
    explanation: "Normally a single repository can only have one branch checked out at a time; 'git worktree add' creates an additional working directory linked to the same repository/object database but with a different branch checked out, useful for working on a hotfix without disturbing your current feature branch's uncommitted state."
  - type: multiple_choice
    difficulty: 2
    text: "What does 'git rm --cached <file>' do, as opposed to plain 'git rm <file>'?"
    options:
      - "Removes the file from Git tracking (and stages that removal) while leaving the actual file on disk"
      - "Deletes the file from disk but leaves it tracked in Git"
      - "Removes the file from the remote repository only"
      - "Permanently deletes the file from all of Git's history"
    answer: 0
    explanation: "'--cached' only affects the index/staging area — the file stops being tracked (useful for a file that was committed by mistake and should now be gitignored) but the actual file remains untouched on disk; without --cached, 'git rm' deletes the file from disk too."
  - type: multiple_choice
    difficulty: 3
    text: "In GitFlow-style branching, what is the typical purpose of a 'develop' branch alongside 'main'?"
    options:
      - "'develop' integrates completed features for the next release, while 'main' reflects only stable, released code"
      - "'develop' is used only by a single designated lead developer"
