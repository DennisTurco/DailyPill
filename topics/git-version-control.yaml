    answer: 0
    explanation: "'git clean' deletes files Git doesn't track at all (not modifications to tracked files); -f forces the deletion (required by default as a safety measure) and -d also removes untracked directories, not just files. It's often run alongside 'git reset --hard' to fully clean a working tree."
  - type: multiple_choice
    difficulty: 3
    text: "What is a 'bare' Git repository?"
    options:
      - "A repository with no working directory, containing only the .git metadata itself — typically used as a central server-side repository"
      - "A repository with no commit history at all"
      - "A repository that has been stripped of all branches except main"
      - "A repository that only accepts read-only clones"
    answer: 0
    explanation: "A bare repository (created with 'git init --bare') has no checked-out files, just the object database and refs — since nobody edits files directly on a shared server repository, there's no need for a working tree, and it avoids the possibility of someone directly modifying files on the server."
  - type: multiple_choice
    difficulty: 2
    text: "What does 'git show <commit>' display?"
    options:
      - "The commit's metadata (author, date, message) along with the diff it introduced"
      - "Only the list of files that exist in the repository at that commit"
      - "The full contents of every file in the repository"
      - "A list of every branch that contains that commit"
    answer: 0
    explanation: "'git show' is commonly used to inspect one specific commit in detail: its message/metadata plus the actual changes (diff) it introduced relative to its parent — useful for reviewing a single commit without listing the whole history."
  - type: multiple_choice
    difficulty: 3
    text: "What does 'git log --author=\"Jane\" --since=\"2 weeks ago\"' filter the log by?"
    options:
      - "Only commits authored by Jane within the last two weeks"
      - "Only commits that modified files authored by Jane in any timeframe"
      - "Only merge commits from the last two weeks, regardless of author"
      - "It is invalid syntax and Git would reject it"
    answer: 0
    explanation: "'git log' supports numerous filters that can be combined; --author matches the commit's author field (by substring), and --since restricts to commits after a given date/relative time expression, letting you narrow down history by both criteria at once."
  - type: multiple_choice
    difficulty: 3
    text: "What is the purpose of 'git format-patch' combined with 'git am'?"
    options:
      - "format-patch exports commits as individual patch files that can be emailed or transferred, and 'git am' applies those patch files as real commits on another repository"
      - "format-patch permanently deletes commits, and 'git am' restores them from backup"
      - "They are used exclusively for resolving merge conflicts"
      - "format-patch compresses the entire repository into a single archive file"
    answer: 0
    explanation: "This pair predates (and still coexists with) pull requests: format-patch turns a range of commits into .patch files (in a mailbox-compatible format, preserving author/message/diff), which can be sent to someone who then applies them with 'git am' to recreate the same commits in their own repository."
  - type: multiple_choice
    difficulty: 2
    text: "What is the purpose of a .gitattributes file?"
    options:
      - "It lets you configure per-path behavior, such as forcing consistent line endings, marking files as binary, or customizing diff behavior"
      - "It lists which files should never be tracked, identical to .gitignore"
      - "It stores each contributor's personal Git configuration"
      - "It defines which branches are protected from force-push"
    answer: 0
    explanation: ".gitattributes controls how Git treats specific paths — for example normalizing line endings across platforms (text=auto), telling Git a file is binary so it doesn't try to diff/merge it as text, or specifying a custom diff driver for certain file types."
  - type: multiple_choice
    difficulty: 4
    text: "What does 'sparse checkout' let you do in a large repository?"
    options:
      - "Check out only a subset of the repository's directory tree into your working directory, while still having the full history available"
      - "Clone only the most recent commit, discarding all older history"
      - "Check out a repository without downloading any file contents at all"
      - "Automatically split a monorepo into multiple smaller repositories"
    answer: 0
    explanation: "Sparse checkout is useful for very large monorepos where you only need to work on a small part of the tree: Git still has the full object history, but only populates the working directory with the paths you've specified, saving disk space and checkout time."
  - type: open_answer
    difficulty: 2
    text: "Explain what 'git show HEAD' would display, and how it differs from 'git log -1'."
    answer: "'git show HEAD' displays the current commit's full metadata (author, date, message) plus the actual diff it introduced compared to its parent. 'git log -1' shows only the metadata of the most recent commit (limited to 1 entry) without the diff content, unless you add '-p'/'--patch' to also include it."
    explanation: "Both commands can end up showing similar information, but 'git show' is oriented around inspecting one specific object (commit, tag, blob) in full detail including its diff by default, while 'git log' is oriented around browsing a sequence of commits, with the diff being opt-in via -p."
  - type: open_answer
    difficulty: 3
    text: "Explain the purpose of a bare Git repository and why a typical developer would never want to edit files directly inside one."
    answer: "A bare repository has no working directory — it only contains the .git metadata (objects, refs, config), and is meant to be a shared, central point that developers push to and pull/fetch from, not a place where anyone directly edits files. Since there's no working tree, there's nothing to 'edit' directly in a meaningful way; all real work happens in a normal (non-bare) clone, with changes pushed back to the bare repository to be shared with others."
    explanation: "This is exactly the model used by self-hosted Git servers and by platforms like GitHub under the hood — the server holds a bare repository as the single source of truth, and every developer works from their own regular clone."
  - type: open_answer
    difficulty: 3
    text: "Explain what problem .gitattributes' line-ending normalization (e.g. '* text=auto') solves for a team with both Windows and Unix/macOS developers."
    answer: "Windows and Unix-like systems use different line-ending characters by default (CRLF vs LF). Without normalization, a file edited on Windows can end up with different line endings than the same file edited on macOS/Linux, causing every single line to show as changed in a diff even when no meaningful content changed, and creating spurious merge conflicts. '* text=auto' tells Git to normalize line endings to LF in the repository itself while still allowing each platform's tools to check out files with their native line ending, avoiding these false diffs."
    explanation: "This is a very common real-world source of confusing 'the whole file changed' diffs and merge conflicts on cross-platform teams, and .gitattributes is the recommended, repository-level fix (as opposed to relying on each individual's local Git or editor configuration)."
  - type: open_answer
    difficulty: 2
    text: "Write the Git command to remove all untracked files and directories from your working tree, excluding anything covered by .gitignore."
    answer: |
      ```bash
      git clean -fd
      ```
    explanation: "-f (force) is required by Git as a safety measure since this permanently deletes files, and -d additionally removes untracked directories, not just loose untracked files; add -x to also remove files that are ignored by .gitignore, if that's specifically intended."
  - type: open_answer
    difficulty: 2
    text: "Write the Git command to permanently discard all uncommitted changes in your working directory, restoring every tracked file to match the last commit."
    answer: |
      ```bash
      git checkout -- .
      ```
    explanation: "This restores every tracked file in the current directory (and subdirectories) to its committed version, discarding uncommitted modifications; the equivalent modern syntax is 'git restore .'. Note this only affects tracked files already known to Git, not new untracked files, which would need 'git clean' instead."
