      ```
    explanation: "'--soft' moves the branch pointer back one commit without touching the working tree or the index, so every change from that commit remains staged exactly as it was — perfect for redoing the commit (e.g. with a corrected message via 'git commit --amend' style workflow, or adding another file first)."
  - type: multiple_choice
    difficulty: 2
    text: "What does 'git clean -fd' do?"
    options:
      - "Removes untracked files and directories from the working tree that are not covered by .gitignore"
