name: Python
category: Computer Science
difficulty: medium
ai_generate: true
content: |
  Zero-to-hero Python fundamentals: language basics (interpreted, dynamically typed,
  indentation), operators, input/output and f-strings, control flow (if/for/while),
  the core collection types (list, tuple, set, dict) and comprehensions, strings,
  functions (default/keyword args, *args/**kwargs, lambdas, recursion), object-oriented
  programming (classes, dunder methods, classmethod/staticmethod/property, inheritance,
  dataclasses), exception handling, and file/JSON/logging basics.
manual_questions:
  - type: multiple_choice
    difficulty: 1
    text: "Python is best described as which kind of language?"
    options:
      - "An interpreted language, executed line by line by an interpreter"
      - "A language compiled directly into a standalone machine-code executable before it runs"
      - "A markup language with no executable logic"
      - "A language that only runs inside a web browser"
    answer: 0
    explanation: "Python code is read and executed line by line by an interpreter (CPython, by default), rather than being compiled ahead of time into a native executable like C or Rust; this makes development faster and more portable at some cost to raw execution speed."
  - type: completion
    difficulty: 1
    text: "Python is dynamically typed, meaning you never need to declare a variable's ____ before assigning it a value."
    answer: "type"
    explanation: "In Python the interpreter infers a variable's type automatically from the value assigned to it, so there's no type declaration step like `int x = 5;` in statically typed languages."
  - type: multiple_choice
    difficulty: 2
    text: "In Python, what defines which statements belong to a block of code, such as the body of an if statement?"
    options:
      - "Indentation (whitespace)"
      - "Curly braces { }"
      - "BEGIN and END keywords"
      - "Parentheses around the block"
    answer: 0
    explanation: "Python uses indentation itself to delimit blocks — an inconsistently indented block is a SyntaxError — whereas languages like C or Java use curly braces and don't care about whitespace."
  - type: single_word
    difficulty: 1
    text: "In Python, are strings mutable or immutable? Answer with one word."
    answer: "immutable"
    explanation: "Once a string is created, it cannot be changed in place — operations like `.upper()` or slicing always return a brand-new string object rather than modifying the original."
