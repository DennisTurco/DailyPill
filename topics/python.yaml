    explanation: "@property turns a method into something accessed like `obj.eta` rather than `obj.eta()`, and pairing it with a matching `@eta.setter` lets you run validation logic (e.g. rejecting a negative age) on assignment, all without changing how calling code interacts with the attribute."
  - type: multiple_choice
