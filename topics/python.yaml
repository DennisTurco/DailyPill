  - type: open_answer
    difficulty: 2
    text: "Write a Python function called is_even that takes an integer and returns True if it is even, False otherwise."
    answer: |
      ```python
      def is_even(n):
          return n % 2 == 0
      ```
    explanation: "The modulo operator % gives the remainder of dividing n by 2; that remainder is 0 exactly when n is even, so the comparison `n % 2 == 0` directly produces the correct boolean without any branching."
  - type: open_answer
    difficulty: 4
    text: "Write a recursive Python function called factorial that computes the factorial of a non-negative integer n (0! is 1)."
    answer: |
      ```python
      def factorial(n):
          if n == 0:
              return 1
          return n * factorial(n - 1)
      ```
    explanation: "The base case `n == 0` returning 1 stops the recursion; for any other n, the function multiplies n by the factorial of n - 1, and each recursive call moves n one step closer to the base case."
