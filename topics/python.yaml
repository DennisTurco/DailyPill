      - "Exponentiation"
      - "Returns the remainder of a division"
    answer: 0
    explanation: "// performs floor division, rounding the result down to the nearest whole number (e.g. 7 // 3 is 2); regular division uses a single /, and the remainder is obtained with %."
  - type: multiple_choice
