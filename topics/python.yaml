  - type: open_answer
    difficulty: 2
    text: "Write a Python list comprehension that produces a list of the squares of the integers from 0 to 4 (inclusive)."
    answer: |
      ```python
      squares = [x**2 for x in range(5)]
      ```
    explanation: "The comprehension `[x**2 for x in range(5)]` iterates x over 0, 1, 2, 3, 4 and collects x**2 for each into a new list, producing [0, 1, 4, 9, 16] — a compact alternative to writing an explicit for loop with .append()."
  - type: open_answer
    difficulty: 3
    text: "Write a Python function called remove_duplicates that takes a list and returns a new list with duplicate values removed, using a set."
    answer: |
      ```python
      def remove_duplicates(items):
          return list(set(items))
      ```
    explanation: "Converting the list to a set automatically discards duplicate values because sets only store unique elements; wrapping the result back in list() converts it to a list again, though the original order is not preserved since sets are unordered."
