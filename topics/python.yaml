  - type: open_answer
    difficulty: 3
    text: "Write a Python class called Rectangle with an __init__ that takes width and height, and a method area() that returns width multiplied by height."
    answer: |
      ```python
      class Rectangle:
          def __init__(self, width, height):
              self.width = width
              self.height = height

          def area(self):
              return self.width * self.height
      ```
    explanation: "__init__ stores width and height as instance attributes via self so each Rectangle object keeps its own values, and area() then reads those same attributes back through self to compute and return their product."
  - type: open_answer
