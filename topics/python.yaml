          def speak(self):
              print("Woof!")
      ```
    explanation: "Writing `class Dog(Animal):` makes Dog a subclass that inherits everything from Animal by default; defining a new speak() method with the same name inside Dog overrides the inherited version, so Dog instances use this implementation instead of Animal's."
