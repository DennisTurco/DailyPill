      - "The result raised to a power"
      - "Always zero"
    answer: 0
    explanation: "% is the modulo operator: 7 % 3 evaluates to 1, the remainder left over after dividing 7 by 3; it's commonly used to test for even/odd numbers via `n % 2 == 0`."
