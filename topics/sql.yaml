    text: "Write a SQL query using NOT EXISTS that finds all customers who have never placed an order (assume customers.id = orders.customer_id)."
    answer: |
      ```sql
      SELECT *
      FROM customers c
      WHERE NOT EXISTS (
          SELECT 1
          FROM orders o
          WHERE o.customer_id = c.id
      );
      ```
    explanation: "NOT EXISTS returns true only when the correlated subquery finds no matching order row for that customer, which is generally the safest way to express 'has none of' in SQL, avoiding the NULL pitfalls of NOT IN."
