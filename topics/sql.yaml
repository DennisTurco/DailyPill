    answer: |
      ```sql
      CREATE TABLE employees (
          id INT PRIMARY KEY,
          name VARCHAR(100) NOT NULL,
          manager_id INT,
          FOREIGN KEY (manager_id) REFERENCES employees(id)
      );
      ```
    explanation: "The FOREIGN KEY clause references the same table's id column, letting manager_id point to another row in employees; it's left nullable so top-level employees with no manager can have manager_id set to NULL."
  - type: open_answer
    difficulty: 4
    text: "Write a SQL query using a correlated subquery that finds every product whose price is higher than the average price of products in that same category (assume products has category and price columns)."
    answer: |
      ```sql
      SELECT p1.*
      FROM products p1
      WHERE p1.price > (
          SELECT AVG(p2.price)
          FROM products p2
          WHERE p2.category = p1.category
      );
      ```
    explanation: "The inner subquery is correlated because it references p1.category from the outer query, so it recomputes a different average for every outer row instead of running once for the whole table."
  - type: open_answer
