    text: "Write a SQL query that finds all student_id values from an enrollments table (columns student_id, course_id) who are enrolled in every course listed in a courses table (column course_id), using GROUP BY and HAVING — conceptually equivalent to the relational-algebra Division operator."
    answer: |
      ```sql
      SELECT student_id
      FROM enrollments
      WHERE course_id IN (SELECT course_id FROM courses)
      GROUP BY student_id
      HAVING COUNT(DISTINCT course_id) = (SELECT COUNT(*) FROM courses);
      ```
    explanation: "Grouping by student_id and comparing the count of distinct enrolled courses against the total number of required courses selects only students who match every single course, which is exactly what relational-algebra Division computes."
