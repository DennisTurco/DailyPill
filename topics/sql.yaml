    text: "Explain the difference between a clustered index and a non-clustered index, and why a table can have only one clustered index."
    answer: "A clustered index physically reorders the table's rows on disk to match the index key, so there is only one actual physical ordering of the data. A non-clustered index instead keeps a separate structure with pointers back to the table's rows, leaving the physical row order untouched. Because a table's rows can only be physically sorted in one way at a time, a table can have at most one clustered index but can have several non-clustered indexes."
    explanation: "The physical-storage aspect is the key distinction: clustering rewrites the data's actual disk order, which is inherently a one-at-a-time property, whereas non-clustered indexes are additional lookup structures layered on top without touching row order."
