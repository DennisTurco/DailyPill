    answer: |
      ```sql
      CREATE TRIGGER log_new_order
      AFTER INSERT
      ON orders
      FOR EACH ROW
      INSERT INTO order_audit (order_id, logged_at) VALUES (NEW.id, NOW());
      ```
    explanation: "AFTER INSERT means the trigger fires once the new order row is already committed to orders, and FOR EACH ROW makes it run once per inserted row, using NEW.id to reference that row's just-inserted id."
