  - type: open_answer
    difficulty: 4
    text: "Explain what excess property checking is in TypeScript, and why it doesn't trigger when you assign an object through an intermediate variable instead of a literal."
    answer: "Excess property checking is a stricter structural check TypeScript applies specifically to freshly written object literals: if the literal has a property that doesn't exist on the target type, it's flagged as an error, since it's often a typo. When the same object is first assigned to a variable (with its own inferred wider type) and only that variable is assigned to the target, TypeScript instead relies on ordinary structural compatibility, which allows extra properties as long as all required ones are present, so the excess-property error doesn't appear."
    explanation: "The check exists to catch likely mistakes in literals (a misspelled property name, or one that doesn't belong on the type) at the exact point of definition; once the value is behind a variable, its shape is checked only for compatibility, not exactness, which is standard structural typing behavior."
  - type: open_answer
