name: TypeScript
category: Computer Science
difficulty: medium
ai_generate: true
content: |
  TypeScript as a typed superset of JavaScript, tooling (tsc, tsconfig, Vite),
  basic types and inference, arrays and tuples, literal types and enums,
  any/unknown, optional chaining and nullish coalescing, functions (optional
  params, rest params, overloads), interfaces, classes (access modifiers,
  abstract classes, implements), static members, generics, type aliases,
  union and intersection types, type guards, discriminated unions, utility
  types (Partial, Readonly, Record, Pick, Omit, Exclude, ReturnType), modules.
manual_questions:
  - type: multiple_choice
    difficulty: 1
    text: "What best describes TypeScript's relationship with JavaScript?"
    options:
      - "It is a superset of JavaScript that adds static types and compiles down to JavaScript"
      - "It is a completely separate language that runs independently of JavaScript"
      - "It replaces JavaScript engines like V8 with a new runtime"
      - "It is a JavaScript library imported at runtime"
    answer: 0
    explanation: "TypeScript adds a static type system on top of JavaScript syntax and is transpiled to plain JavaScript to run; it doesn't run on its own or replace the JS engine."
  - type: multiple_choice
    difficulty: 1
    text: "What happens to TypeScript's type annotations when the code is compiled?"
    options:
      - "They are converted into runtime checks that throw errors"
      - "They are kept in the output JavaScript as comments"
      - "They are erased — they exist only for compile-time checking"
      - "They are converted into JSON schema files"
    answer: 2
    explanation: "TypeScript types are a compile-time-only construct used for static analysis; the compiler strips them out entirely, producing plain JavaScript with no runtime type checks."
  - type: multiple_choice
    difficulty: 2
    text: "Which command generates the tsconfig.json file?"
    options:
      - "npm init tsconfig"
      - "tsc build"
      - "npx tsc --init"
      - "npm install tsconfig"
    answer: 2
    explanation: "`tsc --init` scaffolds a default tsconfig.json with common compiler options commented out; the other commands are not real TypeScript CLI invocations."
  - type: multiple_choice
    difficulty: 2
    text: "What does the `strict` compiler option do?"
    options:
      - "It enables the full set of strict type-checking rules"
      - "It disables all type checking for faster builds"
      - "It forces the use of ES5 output"
      - "It deletes the node_modules folder before building"
    answer: 0
    explanation: "`strict` is a shorthand flag that turns on a bundle of stricter checks (like strictNullChecks and noImplicitAny) rather than loosening or removing type checking."
  - type: multiple_choice
    difficulty: 1
    text: "What is the difference between `let x: number = 3;` and `let z = 10;`?"
    options:
      - "The first uses an explicit type annotation, the second relies on type inference"
      - "There is no difference at all"
      - "The second one has no type and can hold any value"
      - "The first one cannot be reassigned, ever"
    answer: 0
    explanation: "TypeScript infers `z`'s type as number from its initializer even without an annotation, so both variables end up typed as number, just declared differently."
  - type: multiple_choice
    difficulty: 2
    text: "Which of these is NOT a valid value for a variable of type `number` in TypeScript?"
    options:
      - "Infinity"
      - "-3.14"
      - "0"
      - "\"42\" (the string \"42\")"
    answer: 3
    explanation: "TypeScript's number type covers all numeric values including Infinity and negatives, but a string like \"42\" is a different type and is not assignable without conversion."
  - type: multiple_choice
    difficulty: 2
    text: "What does the type `string[][]` describe?"
    options:
      - "A tuple with exactly two strings"
      - "An array whose elements are each a string[]"
      - "A function returning a string"
      - "A readonly array of numbers"
    answer: 1
    explanation: "`string[][]` is shorthand for `Array<Array<string>>`, i.e. an array of string arrays; a tuple would use bracket-with-fixed-types syntax like `[string, string]`."
  - type: multiple_choice
    difficulty: 3
    text: "What is the key difference between a tuple and a regular array?"
    options:
      - "A tuple can only contain numbers"
      - "A tuple has a fixed length with a specific type per position"
      - "A tuple cannot be nested"
      - "There is no difference at runtime or compile time"
    answer: 1
    explanation: "A tuple type fixes both the length and the type at each index (e.g. [string, number]), whereas a regular array type just describes a variable-length sequence of one element type."
  - type: multiple_choice
    difficulty: 2
    text: "What happens if you `.push()` onto a `readonly number[]`?"
    options:
      - "It works, but only once"
      - "It silently does nothing"
      - "The compiler reports an error because push is not available"
      - "It converts the array to a mutable one automatically"
    answer: 2
    explanation: "A readonly array type omits mutating methods like push, splice, and pop from its type, so the compiler flags any attempt to call them as a type error."
  - type: multiple_choice
    difficulty: 2
    text: "What value does `Size.Small` have by default in `enum Size { Small, Medium, Large }`?"
    options:
      - "1"
      - "\"Small\""
      - "0"
      - "undefined"
    answer: 2
    explanation: "Numeric enums auto-assign values starting at 0 for the first member and incrementing by 1 for each subsequent member unless explicitly overridden."
  - type: multiple_choice
    difficulty: 3
    text: "What is a key difference between numeric and string enums?"
    options:
      - "String enum members do not auto-increment and must each be explicitly assigned"
      - "Numeric enums cannot be compared with ==="
      - "String enums cannot be logged to the console"
      - "There is no difference in behavior"
    answer: 0
    explanation: "String enums have no natural incrementing scheme, so every member needs its own explicit string value, unlike numeric enums which auto-increment from the previous member."
  - type: multiple_choice
    difficulty: 3
    text: "What does prefixing an enum with `const` do?"
    options:
      - "It makes every member optional"
      - "It inlines the enum's values at compile time and avoids generating a runtime object"
      - "It converts the enum into a literal union automatically"
      - "It forces all members to be strings"
    answer: 1
    explanation: "A const enum is completely erased at compile time — its usages are replaced directly with the literal values, so no enum object exists in the emitted JavaScript, reducing runtime overhead."
  - type: multiple_choice
    difficulty: 2
    text: "Why does `let x: any = 1; console.log(x.length);` compile without error?"
    options:
      - "Because `any` disables type checking for that value"
      - "Because all values in JavaScript have a `.length` property"
      - "Because TypeScript infers `x` as `string`"
      - "Because `any` is the same as `unknown`"
    answer: 0
    explanation: "The `any` type opts a value out of the type system entirely, so any property access or operation on it is allowed without compile-time checking, even if it fails at runtime."
  - type: multiple_choice
    difficulty: 2
    text: "What must you do before using a value of type `unknown`?"
    options:
      - "Nothing, it behaves exactly like `any`"
      - "Cast it to `any` first"
      - "Narrow its type with a check like `typeof` or `instanceof`"
      - "Declare it as `const`"
    answer: 2
    explanation: "Unlike any, unknown forces you to prove the value's actual type through a narrowing check (typeof, instanceof, a type guard, etc.) before the compiler will let you use it as that type."
  - type: multiple_choice
    difficulty: 2
    text: "What does `arr.pop()?.name` do if `arr` is empty?"
    options:
      - "It throws a runtime error"
      - "It evaluates to undefined without throwing"
      - "It returns an empty string"
      - "It does not compile"
    answer: 1
    explanation: "pop() on an empty array returns undefined, and optional chaining (?.) short-circuits to undefined instead of throwing when accessing .name on that undefined value."
  - type: multiple_choice
    difficulty: 3
    text: "Given `const count = 0;`, what does `count ?? 10` evaluate to?"
    options:
      - "10, because 0 is falsy"
      - "0, because ?? only falls back on null/undefined"
      - "undefined"
      - "It causes a compile error"
    answer: 1
    explanation: "The nullish coalescing operator only falls back to its right operand when the left is null or undefined, unlike ||, which would also treat falsy values like 0 as triggering the fallback."
  - type: multiple_choice
    difficulty: 2
    text: "Where must optional parameters be placed in a function's parameter list?"
    options:
      - "Anywhere, order does not matter"
      - "Always first"
      - "After all required parameters"
      - "Optional parameters are not supported in TypeScript"
    answer: 2
    explanation: "TypeScript requires optional parameters to follow all required ones, since parameters are matched positionally and a required parameter can't come after an omittable one."
  - type: multiple_choice
    difficulty: 3
    text: "What does a rest parameter like `...numbers: number[]` allow?"
    options:
      - "Exactly one additional optional argument"
      - "An unlimited number of number arguments collected into an array"
      - "A single tuple of numbers only"
      - "Passing numbers only as strings"
    answer: 1
    explanation: "A rest parameter gathers any number of trailing arguments (zero or more) into a single array, letting the function accept a variable-length argument list of that type."
  - type: multiple_choice
    difficulty: 3
    text: "In a function overload setup, which signatures are visible to callers?"
    options:
      - "Only the implementation signature"
      - "Only the overload signatures, not the general implementation signature"
      - "All signatures are equally callable including the implementation one"
      - "None, overloads are resolved only at runtime"
    answer: 1
    explanation: "The implementation signature exists only to satisfy the compiler internally and is usually broader/less specific; callers can only invoke the function through one of the declared overload signatures."
  - type: multiple_choice
    difficulty: 2
    text: "What does TypeScript check when you assign an object literal to a variable typed with an interface?"
    options:
      - "That the object was created with an `implements` clause"
      - "That the object's shape structurally matches the interface"
      - "That the object's constructor name matches the interface name"
      - "Nothing — interfaces are only documentation"
    answer: 1
    explanation: "TypeScript uses structural typing: an object satisfies an interface if it has the required properties and types, regardless of how it was constructed or named."
  - type: multiple_choice
    difficulty: 3
    text: "Which access modifier allows a member to be used by the declaring class and its subclasses, but not from outside code?"
    options:
      - "private"
      - "protected"
      - "public"
      - "readonly"
    answer: 1
    explanation: "protected members are accessible in the declaring class and any derived class, but not from unrelated external code, unlike public (accessible everywhere) or private (accessible only in the declaring class)."
  - type: multiple_choice
    difficulty: 3
    text: "What does the `static` keyword mean when applied to a class member?"
    options:
      - "The member is read-only after construction"
      - "The member belongs to the class itself, shared across all instances"
      - "The member can only be accessed inside the constructor"
      - "The member is only available in abstract classes"
    answer: 1
    explanation: "A static member lives on the class object itself rather than on each instance, so it's shared and accessed via the class name (e.g. ClassName.member) instead of through `this`."
  - type: multiple_choice
    difficulty: 3
    text: "Why can't you write `new Animal()` when `Animal` is declared `abstract`?"
    options:
      - "Abstract classes can never have a constructor"
      - "Abstract classes are only allowed one subclass"
      - "An abstract method has no implementation to run"
      - "TypeScript doesn't support abstract classes"
    answer: 2
    explanation: "An abstract class may declare methods without bodies, meant to be implemented by subclasses; instantiating the abstract class directly would leave those methods with no implementation to call, so TypeScript forbids it."
  - type: multiple_choice
    difficulty: 3
    text: "What problem do generics primarily solve?"
    options:
      - "They make code run faster at runtime"
      - "They let one implementation work with multiple types while preserving type safety"
      - "They remove the need for interfaces"
      - "They allow classes to have multiple constructors"
    answer: 1
    explanation: "Generics parameterize a type over another type, so a single function or class can operate on many concrete types without losing type checking, avoiding both code duplication and the use of `any`."
  - type: multiple_choice
    difficulty: 3
    text: "What kind of type is `type ID = string | number;`?"
    options:
      - "A tuple type"
      - "A union type"
      - "A function type"
      - "An intersection type"
    answer: 1
    explanation: "The `|` operator combines types into a union, meaning a value of type ID can be either a string or a number; `&` would instead build an intersection type."
  - type: multiple_choice
    difficulty: 4
    text: "What does the intersection operator `&` mean in a type definition?"
    options:
      - "The value can be any one of the listed types"
      - "Only the first type is enforced"
      - "The resulting type must satisfy all combined types simultaneously"
      - "It creates an enum"
    answer: 2
    explanation: "An intersection type combines multiple types into one that must satisfy every member type at once, effectively merging their properties, unlike a union which requires only one to match."
  - type: multiple_choice
    difficulty: 3
    text: "Which type guard is best suited for narrowing between primitive types like string and number?"
    options:
      - "instanceof"
      - "typeof"
      - "in"
      - "A custom type predicate is required"
    answer: 1
    explanation: "typeof works directly on JavaScript's runtime primitive tags (\"string\", \"number\", etc.), while instanceof is meant for class instances and `in` checks for property presence on objects."
  - type: multiple_choice
    difficulty: 4
    text: "In `function isDog(pet: Cat | Dog): pet is Dog { ... }`, what does the `pet is Dog` return type actually do at runtime?"
    options:
      - "It throws an error if pet is not a Dog"
      - "It automatically converts pet into a Dog instance"
      - "Nothing at runtime — it is a compile-time signal that lets TypeScript narrow the type after the call"
      - "It removes the Cat type from the union permanently"
    answer: 2
    explanation: "A type predicate (`pet is Dog`) has no runtime effect; the function's actual logic determines the boolean returned, and TypeScript only uses the predicate to narrow the static type in branches where the function returns true."
  - type: multiple_choice
    difficulty: 4
    text: "What makes a union of interfaces a 'discriminated union'?"
    options:
      - "Every member has at least one optional property"
      - "Every member shares a common property with a distinct literal type value"
      - "The union has exactly two members"
      - "All members extend the same base class"
    answer: 1
    explanation: "A discriminated union relies on a shared 'tag' property whose literal type differs per member, letting TypeScript narrow the union to a specific member just by checking that property's value."
  - type: multiple_choice
    difficulty: 4
    text: "What is the purpose of `const _exhaustive: never = log;` in a default switch branch over a discriminated union?"
    options:
      - "It improves runtime performance"
      - "It forces a compile error if a new union member is added without a matching case"
      - "It converts log into a string"
      - "It is required syntax for every switch statement"
    answer: 1
    explanation: "After all known cases are handled, the remaining type in the default branch should be `never`; if a new union member is added without a corresponding case, `log` retains a real type and fails to assign to `never`, catching the gap at compile time."
  - type: multiple_choice
    difficulty: 3
    text: "What does `Partial<Todo>` produce?"
    options:
      - "A type with all properties of Todo made optional"
      - "A type with only the first property of Todo"
      - "A type where all properties become readonly"
      - "An array of Todo objects"
    answer: 0
    explanation: "Partial<T> is a utility type that maps over T's properties and marks each one optional, useful for representing partial updates to an object."
  - type: multiple_choice
    difficulty: 4
    text: "Which utility type builds a type with all properties EXCEPT the ones you list?"
    options:
      - "Pick<T, K>"
      - "Omit<T, K>"
      - "Partial<T>"
      - "Record<K, T>"
    answer: 1
    explanation: "Omit<T, K> constructs a type by removing the keys in K from T, the inverse of Pick<T, K>, which keeps only the specified keys."
  - type: multiple_choice
    difficulty: 3
    text: "How many default exports can a single TypeScript module have?"
    options:
      - "Unlimited"
      - "Exactly one"
      - "Exactly two"
      - "Zero, default exports don't exist in TypeScript"
    answer: 1
    explanation: "ES modules (which TypeScript follows) allow only one default export per module, though any number of named exports can coexist alongside it."
  - type: completion
    difficulty: 2
    text: "The TypeScript compiler binary is called ____."
    answer: "tsc"
    explanation: "`tsc` is the command-line entry point for the TypeScript compiler, used to type-check and transpile .ts files into JavaScript."
  - type: completion
    difficulty: 2
    text: "The operator '??' is called ____ coalescing."
    answer: "nullish"
    explanation: "The `??` operator is nullish coalescing: it returns its right-hand operand only when the left is null or undefined, distinguishing it from the `||` logical OR fallback."
  - type: completion
    difficulty: 3
    text: "A pattern where every union member shares a common property typed as a distinct literal value is called a ____ union."
    answer: "discriminated"
    explanation: "This is called a discriminated (or tagged) union; the shared literal-typed property acts as the discriminant TypeScript uses to narrow which member a value is."
  - type: completion
    difficulty: 2
    text: "An interface can build on top of another one using the ____ keyword."
    answer: "extends"
    explanation: "The `extends` keyword lets an interface inherit all members of one or more other interfaces, adding to or refining them."
  - type: completion
    difficulty: 3
    text: "A class promises to fulfill an interface's contract using the ____ keyword."
    answer: "implements"
    explanation: "The `implements` clause tells the compiler to check that the class provides all the members declared by the interface, enforcing the contract at compile time."
  - type: single_word
    difficulty: 2
    text: "What TypeScript keyword declares a set of named constants that exists as a real value at runtime?"
    answer: "enum"
    explanation: "Unlike interfaces or type aliases, which are erased, a regular `enum` compiles down to an actual JavaScript object that exists at runtime and can be iterated or referenced."
  - type: single_word
    difficulty: 3
    text: "What is the term for TypeScript refining a value's type inside a conditional based on a runtime check, such as `typeof value === 'string'`?"
    answer: "narrowing"
    explanation: "Narrowing is the process by which TypeScript uses control-flow analysis of runtime checks to reduce a broader type (like a union) to a more specific one within a given code branch."
  - type: single_word
    difficulty: 4
    text: "What generic utility type makes every property of an object type optional?"
    answer: "Partial"
    explanation: "Partial<T> maps every property of T to an optional version of itself, commonly used for objects representing partial updates or patches."
  - type: single_word
    difficulty: 3
    text: "What is the name of the `?.` operator used to safely access a possibly-missing property?"
    answer: "optional chaining"
    explanation: "Optional chaining (`?.`) short-circuits to undefined instead of throwing when accessing a property on a null or undefined value, avoiding manual null checks at each step."
  - type: open_answer
    difficulty: 4
    text: "Explain the difference between any and unknown in TypeScript."
    answer: "any disables type checking entirely, allowing any operation on the value without complaint; unknown also accepts any value but forces you to narrow its type with a check, such as typeof or instanceof, before you can use it, which preserves type safety."
    explanation: "any opts out of the type system completely, so operations on it are never checked; unknown is the type-safe counterpart that still accepts any value but requires explicit narrowing before you can act on it, catching mistakes the any type would silently allow."
  - type: open_answer
    difficulty: 4
    text: "Explain what a discriminated union is and why it makes narrowing easier than using the in operator on every call site."
    answer: "A discriminated union is a union of object types that all share a common property, the discriminant, typed as a distinct literal value on each member; TypeScript can automatically narrow the type inside a switch or if statement based purely on that tag, without requiring a manual type guard to be written for each branch."
    explanation: "Because the discriminant has a distinct literal type per member, checking it once (e.g. in a switch) lets TypeScript infer the exact member type for that branch automatically, rather than needing a bespoke `in`-based or custom type guard for every property combination."
  - type: open_answer
    difficulty: 5
    text: "Explain why const enum produces different output than a regular enum, and mention one limitation of using it."
    answer: "A const enum is fully inlined at compile time and does not generate a runtime object, producing smaller and faster output than a regular enum; a limitation is that it cannot be used with build tools that transpile files in isolation, such as Babel, since inlining the values correctly requires whole-program type information."
    explanation: "A regular enum emits an actual object mapping members to values, while a const enum is erased and its member references are replaced directly with literal values at each usage site, which requires the compiler to see the enum's declaration — something single-file transpilers like Babel can't do."
  - type: open_answer
    difficulty: 2
    text: "Write a TypeScript function called double that takes a number and returns it multiplied by 2, with explicit parameter and return types."
    answer: |
      ```ts
      function double(x: number): number {
        return x * 2;
      }
      ```
    explanation: "The parameter `x: number` and the return type annotation `: number` explicitly document the function's contract, so the compiler flags any call site that passes a non-number or misuses the result."
  - type: open_answer
    difficulty: 3
    text: "Write a TypeScript interface called User with a required name: string property and an optional age?: number property."
    answer: |
      ```ts
      interface User {
        name: string;
        age?: number;
      }
      ```
    explanation: "The `?` after `age` marks it optional, meaning an object can satisfy the User interface with or without that property; `name` has no `?`, so it must always be present."
  - type: open_answer
    difficulty: 3
    text: "Write a generic TypeScript function called first that takes an array of type T and returns its first element, typed as T."
    answer: |
      ```ts
      function first<T>(items: T[]): T {
        return items[0];
      }
      ```
    explanation: "The type parameter <T> lets the function work with an array of any element type while preserving that specific type in the return value, so `first([1,2,3])` is inferred as number and `first(['a','b'])` as string."
  - type: open_answer
    difficulty: 4
    text: "Write a TypeScript discriminated union type called Shape with two variants: a circle with kind: \"circle\" and radius: number, and a square with kind: \"square\" and side: number."
    answer: |
      ```ts
      type Shape =
        | { kind: "circle"; radius: number }
        | { kind: "square"; side: number };
      ```
    explanation: "The shared `kind` property, typed as a distinct string literal per variant, is the discriminant: checking its value (e.g. `if (shape.kind === \"circle\")`) lets TypeScript narrow to the right variant and safely access `radius` or `side`."
  - type: multiple_choice
    difficulty: 3
    text: "Given `interface Person { name: string; age: number }`, what does `type Keys = keyof Person;` produce?"
    options:
      - "\"name\" | \"age\""
      - "string | number"
      - "Person[]"
      - "An array containing [\"name\", \"age\"] at runtime"
    answer: 0
    explanation: "`keyof` produces a union of the type's property names as string (or number) literal types — here `\"name\" | \"age\"` — and it exists only at the type level, not as a runtime array."
  - type: multiple_choice
    difficulty: 2
    text: "Given `const person = { name: \"Ada\", age: 30 };`, what does `type PersonType = typeof person;` do?"
    options:
      - "It creates a runtime copy of the person object"
      - "It captures the static type of the person value, inferring { name: string; age: number }"
      - "It converts person into a string"
      - "It is invalid — typeof only works on primitives"
    answer: 1
    explanation: "In a type position, `typeof` is a type query operator that reads the compile-time type of an existing value, letting you derive a type from a variable instead of writing it out by hand."
  - type: multiple_choice
    difficulty: 4
    text: "What does the mapped type `type Nullable<T> = { [K in keyof T]: T[K] | null };` do?"
    options:
      - "It removes all properties from T"
      - "It iterates over every key of T and produces a new type where each property's value may also be null"
      - "It converts T into a tuple"
      - "It makes every property of T a function"
    answer: 1
    explanation: "A mapped type loops over `keyof T` with `[K in keyof T]` and rebuilds each property; here every original property type `T[K]` is unioned with `null`, producing an object type with the same keys but nullable values."
  - type: multiple_choice
    difficulty: 4
    text: "What does the conditional type `type Flatten<T> = T extends Array<infer U> ? U : T;` do when T is `string[]`?"
    options:
      - "It resolves to string[]"
      - "It resolves to string, extracting the array's element type"
      - "It resolves to never"
      - "It causes a compile error because infer cannot be used in a type"
    answer: 1
    explanation: "A conditional type with an `infer` pattern-matches T against `Array<infer U>`; when T is string[], U is inferred as string, so Flatten<string[]> resolves to string. If T weren't an array, the type would just resolve to T itself."
  - type: multiple_choice
    difficulty: 5
    text: "Given `type Lang = \"en\" | \"it\"; type Locale = `${Lang}-US`;`, what does Locale evaluate to?"
    options:
      - "The literal string type \"en-US\" | \"it-US\""
      - "A single string type with no further narrowing"
      - "A compile error, since template literals can't use unions"
      - "\"Lang-US\""
    answer: 0
    explanation: "Template literal types distribute over unions placed inside the ${} interpolation, producing one literal type per combination — here \"en-US\" | \"it-US\" — rather than collapsing to plain string."
  - type: multiple_choice
    difficulty: 3
    text: "What changes when you write `const colors = [\"red\", \"green\"] as const;` instead of `const colors = [\"red\", \"green\"];`?"
    options:
      - "colors becomes typed as the readonly tuple [\"red\", \"green\"] with literal element types, instead of a mutable string[]"
      - "colors is converted to a Set at runtime"
      - "It has no effect on the inferred type"
      - "It forces colors to be typed as any[]"
    answer: 0
    explanation: "`as const` tells TypeScript to infer the narrowest possible type for a literal: array literals become readonly tuples and string/number literals keep their exact literal type instead of being widened to string or number."
  - type: multiple_choice
    difficulty: 3
    text: "What does `interface Scores { [studentId: string]: number; }` describe?"
    options:
      - "An interface with exactly one property called studentId"
      - "An object type that can have any number of string keys, each mapping to a number value"
      - "A tuple of student IDs and scores"
      - "A function that takes a string and returns a number"
    answer: 1
    explanation: "An index signature describes objects whose set of keys isn't known in advance: any string key is allowed, as long as every corresponding value matches the declared value type — here, number."
  - type: multiple_choice
    difficulty: 3
    text: "Can an abstract class have a constructor with parameters, even though it can't be instantiated directly?"
    options:
      - "No, abstract classes can never define a constructor"
