    difficulty: 2
    text: "Explain, conceptually, what a .d.ts declaration file is for and why you would need one when using a plain JavaScript library from a TypeScript project."
    answer: "A .d.ts file contains only type declarations — interfaces, function and variable signatures, module shapes — with no actual runtime implementation. A plain JavaScript library has no type information of its own, so without a .d.ts file describing its shape, TypeScript would have to treat everything from it as implicitly any, losing all compile-time checking and autocompletion; a .d.ts file (either shipped with the library, installed separately as an @types package, or written by hand) restores that type safety by telling the compiler what the library's exports actually look like."
    explanation: "Declaration files let TypeScript's static checking extend across a boundary where no TypeScript source exists, which is essential for adopting TypeScript incrementally alongside existing JavaScript code or third-party libraries."
