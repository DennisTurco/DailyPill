    text: "Explain the difference between marking an object type's properties readonly (or wrapping it in Readonly<T>) and calling Object.freeze() on the actual object at runtime."
    answer: "readonly and Readonly<T> are purely compile-time constructs: they make the TypeScript compiler reject reassignments to that property in code it checks, but they generate no runtime code and don't prevent mutation through casting, plain JavaScript, or code the compiler doesn't see. Object.freeze() is a runtime operation that actually prevents the object's own properties from being changed, added, or removed, enforced by the JavaScript engine itself regardless of what the type system says."
    explanation: "Because TypeScript's type annotations are erased during compilation, readonly can only guard against mistakes the compiler can see; true immutability that holds even against `as any` casts or external code requires an actual runtime mechanism like Object.freeze()."
  - type: open_answer
    difficulty: 3
    text: "Explain why using unknown for a public function's parameter type is generally safer API design than using any, from the perspective of what the function's own body is allowed to do."
    answer: "With a parameter typed any, the function body can call any method, access any property, or pass the value anywhere else without the compiler ever objecting, so a typo or wrong assumption about the value's shape goes completely unnoticed until runtime. With a parameter typed unknown, the compiler forces the function body itself to first narrow the value (with typeof, instanceof, a type guard, etc.) before doing anything with it, which means both the implementer and any code that consumes the narrowed result are protected by the type checker rather than trusting an unchecked assumption."
    explanation: "any effectively turns off type checking for that value everywhere it flows, while unknown only turns it back on once you've proven what the value actually is, which is why unknown is the recommended type for values whose shape isn't known ahead of time, such as parsed JSON or external input."
  - type: open_answer
    difficulty: 4
    text: "Explain what the satisfies operator gives you that a plain type annotation on the same object literal does not."
    answer: "A plain type annotation widens the variable's type to exactly the annotated type, discarding any more specific information TypeScript could have inferred from the literal, like the exact set of keys or their literal values. satisfies instead checks that the literal is compatible with the given type, producing a compile error if it isn't, but leaves the variable's inferred type as the narrower, more specific type TypeScript would have inferred without any annotation at all, so things like specific property names or literal values remain available afterward."
    explanation: "This distinction matters when downstream code relies on the precise inferred type, such as accessing a specific known key or getting literal-type autocompletion, which a widening annotation would have erased even though it still validated correctly against the target type."
